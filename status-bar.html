<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Bar</title>
  <!-- Eigenstaendige Bottom-Leiste (EQ-Visualizer + Plattenspieler + Track-
       Marquee + MIC/CAM/NET-Status + Uptime), aus in-game.html herausgeloest
       (siehe rl-stats.html fuer den vollen Kontext dieser Modularisierungs-
       Runde). NET-Punkt haengt an einer eigenen Twitch-EventSub-Verbindung
       (nur fuer den Verbindungsstatus, kein Widget reagiert hier auf
       konkrete Events). MIC/CAM bleiben dekorativ. ?track=/?artist=
       weiterhin unterstuetzt. Fuellt die eigene Seite randlos aus -
       Streamlabs' Transform-Panel entscheidet ueber Endgroesse/Position. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --blood: #ff2340; --tan: #d9b872; --cream: #f4f1ea; --vu: 1px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: transparent; font-family: 'Share Tech Mono', monospace; color: var(--cream); overflow: hidden; width: 100%; height: 100%; }

    @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
    @keyframes eqBounce { 0%, 100% { transform: scaleY(.18); } 50% { transform: scaleY(1); } }
    @keyframes marqueeScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .bottom-bar { position: fixed; inset: 0; width: 100%; height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 calc(var(--vu) * 44); background: linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,.15)); border-top: 1px solid rgba(255,35,64,.5); box-shadow: 0 -1px 14px rgba(255,35,64,.3); }
    .bottom-left { display: flex; align-items: center; gap: calc(var(--vu) * 16); }
    .eq-group { display: flex; align-items: flex-end; gap: calc(var(--vu) * 4); height: calc(var(--vu) * 40); }
    .eq-bar { width: calc(var(--vu) * 6); height: calc(var(--vu) * 40); border-radius: 1px 1px 0 0; background: linear-gradient(180deg,#e8b25a,var(--blood)); transform-origin: bottom; animation-name: eqBounce; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .vinyl { width: calc(var(--vu) * 36); height: calc(var(--vu) * 36); border-radius: 50%; background: repeating-radial-gradient(circle, #1a1a1c 0 2px, #0d0d0e 2px 4px); border: 2px solid rgba(217,184,114,.55); display: flex; align-items: center; justify-content: center; animation: spinSlow 4s linear infinite; flex: none; }
    .vinyl-dot { width: calc(var(--vu) * 10); height: calc(var(--vu) * 10); border-radius: 50%; background: var(--blood); box-shadow: 0 0 6px rgba(255,35,64,.8); }
    .track-info { display: flex; flex-direction: column; gap: calc(var(--vu) * 3); }
    .track-label { font-size: calc(var(--vu) * 12); letter-spacing: 3px; color: var(--tan); white-space: nowrap; }
    .track-marquee-mask { width: calc(var(--vu) * 320); overflow: hidden; }
    .track-marquee { display: flex; gap: calc(var(--vu) * 50); width: max-content; animation: marqueeScroll 13s linear infinite; }
    .track-marquee span { font-size: calc(var(--vu) * 17); letter-spacing: 1.5px; color: var(--cream); white-space: nowrap; }
    .bottom-right { display: flex; align-items: center; gap: calc(var(--vu) * 22); }
    .status-group { display: flex; align-items: center; gap: calc(var(--vu) * 18); }
    .status-item { display: flex; align-items: center; gap: calc(var(--vu) * 6); }
    .status-item .dot { width: calc(var(--vu) * 7); height: calc(var(--vu) * 7); border-radius: 50%; }
    .status-item .dot.stable { background: var(--tan); box-shadow: 0 0 6px rgba(217,184,114,.7); }
    .status-item .dot.warn { background: var(--blood); box-shadow: 0 0 6px rgba(255,35,64,.8); animation: blinkDot 1s ease-in-out infinite; }
    .status-item span { font-size: calc(var(--vu) * 11); letter-spacing: 2px; color: rgba(244,241,234,.6); }
    .status-sep { width: 1px; height: calc(var(--vu) * 26); background: rgba(255,35,64,.4); }
    .live-group { display: flex; align-items: center; gap: calc(var(--vu) * 8); }
    .live-group .dot { width: calc(var(--vu) * 7); height: calc(var(--vu) * 7); border-radius: 50%; background: var(--blood); box-shadow: 0 0 6px 2px rgba(255,35,64,.8); animation: blinkDot 1.4s ease-in-out infinite; flex: none; }
    .live-group span { font-size: calc(var(--vu) * 16); letter-spacing: 2px; color: var(--cream); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

  <div class="bottom-bar">
    <div class="bottom-left">
      <div class="eq-group" id="eqGroup"></div>
      <div class="vinyl"><div class="vinyl-dot"></div></div>
      <div class="track-info">
        <span class="track-label">LÄUFT GERADE</span>
        <div class="track-marquee-mask">
          <div class="track-marquee">
            <span id="trackTitle1">BOOM BAP INSTRUMENTAL — LO-FI CREW</span>
            <span id="trackTitle2">BOOM BAP INSTRUMENTAL — LO-FI CREW</span>
          </div>
        </div>
      </div>
    </div>
    <div class="bottom-right">
      <div class="status-group">
        <div class="status-item"><div class="dot stable"></div><span>MIC</span></div>
        <div class="status-item"><div class="dot stable"></div><span>CAM</span></div>
        <div class="status-item"><div class="dot stable" id="netDot"></div><span>NET</span></div>
      </div>
      <div class="status-sep"></div>
      <div class="live-group"><span class="dot"></span><span id="uptimeText">00:00:00</span></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);

    const TRACK_PARAM = params.get('track') || 'BOOM BAP INSTRUMENTAL';
    const ARTIST_PARAM = params.get('artist') || 'LO-FI CREW';
    const trackText = TRACK_PARAM + ' — ' + ARTIST_PARAM;
    document.getElementById('trackTitle1').textContent = trackText;
    document.getElementById('trackTitle2').textContent = trackText;

    const EQ_SPECS = [
      ['.9s','0s'],['1.2s','.15s'],['.7s','.05s'],['1.4s','.3s'],['.85s','.2s'],['1.1s','0s'],
      ['.65s','.4s'],['1.3s','.1s'],['.95s','.25s'],['1.05s','.05s'],['.75s','.35s'],['1.25s','.15s'],
      ['.6s','.2s'],['1.15s','0s'],['.8s','.3s'],['1.35s','.1s'],
    ];
    const eqGroup = document.getElementById('eqGroup');
    EQ_SPECS.forEach(([dur, delay]) => {
      const bar = document.createElement('div');
      bar.className = 'eq-bar';
      bar.style.animationDuration = dur;
      bar.style.animationDelay = delay;
      eqGroup.appendChild(bar);
    });

    const uptimeStart = performance.now();
    const uptimeEl = document.getElementById('uptimeText');
    function formatUptime(totalSec) {
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return h + ':' + m + ':' + s;
    }
    function mainTick(nowMs) {
      uptimeEl.textContent = formatUptime(Math.floor((nowMs - uptimeStart) / 1000));
      requestAnimationFrame(mainTick);
    }
    requestAnimationFrame(mainTick);

    // =====================================================================
    // Twitch EventSub - hier nur fuer den NET-Verbindungsstatus-Punkt, kein
    // Widget reagiert in dieser Quelle auf konkrete Events.
    // =====================================================================
    const TWITCH_EVENTSUB_URL = 'wss://eventsub.wss.twitch.tv/ws';
    let reconnectAttempts = 0;
    let reconnectTimer = null;
    const netDot = document.getElementById('netDot');

    function setNetStatus(stable) {
      netDot.classList.toggle('stable', stable);
      netDot.classList.toggle('warn', !stable);
    }

    function scheduleReconnect(reason) {
      setNetStatus(false);
      reconnectAttempts += 1;
      const delay = Math.min(30000, 2000 * reconnectAttempts);
      console.log('[EventSub] verbinde neu in ' + (delay / 1000) + 's (' + reason + ')');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => connectTwitchEventSub(), delay);
    }

    function connectTwitchEventSub(url, isReconnectHandoff) {
      url = url || TWITCH_EVENTSUB_URL;
      const ws = new WebSocket(url);
      let handoffInProgress = false;

      ws.onopen = () => {};
      ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch (e) { return; }
        const messageType = data.metadata && data.metadata.message_type;

        if (messageType === 'session_welcome') {
          reconnectAttempts = 0;
          setNetStatus(true);
          return;
        }
        if (messageType === 'session_reconnect') {
          handoffInProgress = true;
          connectTwitchEventSub(data.payload.session.reconnect_url, true);
          return;
        }
      };
      ws.onerror = () => {};
      ws.onclose = (event) => {
        if (handoffInProgress) return;
        scheduleReconnect(event.reason || `Code ${event.code}`);
      };
    }
    connectTwitchEventSub();
  </script>

</body>
</html>
