<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Oldschool Live Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08080a;
      --panel: #121217;
      --line: rgba(255,255,255,0.22);
      --text: #f3f3f5;
      --muted: #a8acb7;
      --blood: #c8102e;
      --blood-strong: #8f0c22;
      --ok: #6be3a8;
      --warn: #ff8f8f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background:
        radial-gradient(1000px 700px at 80% -10%, rgba(200,16,46,0.2), transparent 60%),
        radial-gradient(900px 600px at -20% 110%, rgba(255,255,255,0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
    }
    body { padding: 14px; }
    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    .card {
      background: linear-gradient(180deg, rgba(20,20,25,.95), rgba(10,10,14,.95));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 10px 34px rgba(0,0,0,.35), inset 0 0 0 1px rgba(200,16,46,.18);
    }
    h1 {
      font-size: clamp(28px, 9vw, 42px);
      line-height: 1;
      letter-spacing: .5px;
    }
    .sub {
      color: var(--muted);
      margin-top: 6px;
      font-size: 16px;
    }
    .status {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      font-size: 15px;
      line-height: 1.35;
      white-space: pre-wrap;
    }
    .row {
      display: grid;
      gap: 8px;
    }
    .row.cols { grid-template-columns: 1fr 1fr; }
    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: rgba(0,0,0,.3);
      color: var(--text);
      font: inherit;
      font-size: 18px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 12px;
      padding: 14px 10px;
      font: inherit;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: .4px;
      color: #fff;
      background: linear-gradient(180deg, rgba(200,16,46,.8), rgba(143,12,34,.95));
      cursor: pointer;
      min-height: 64px;
    }
    button.secondary {
      font-size: 18px;
      min-height: 52px;
      background: rgba(255,255,255,.08);
    }
    button.active {
      box-shadow: 0 0 0 2px rgba(255,255,255,.45) inset, 0 0 22px rgba(200,16,46,.6);
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .tiny {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.3;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: var(--warn);
      box-shadow: 0 0 8px rgba(255,143,143,.6);
      vertical-align: middle;
    }
    .dot.ok {
      background: var(--ok);
      box-shadow: 0 0 8px rgba(107,227,168,.6);
    }
    @media (max-width: 560px) {
      .row.cols, .btn-grid, .toolbar { grid-template-columns: 1fr; }
      button { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Live Deck</h1>
      <p class="sub">Ein Druck = Szenenwechsel im oldschool-master</p>
      <div id="status" class="status">Bereit.</div>
    </section>

    <section class="card">
      <div class="row cols">
        <label>Regie API
          <input id="apiUrl" type="text" placeholder="https://.../api/regie-control">
        </label>
        <label>Regie Key
          <input id="apiKey" type="password" placeholder="optional">
        </label>
      </div>
      <div class="toolbar">
        <button id="btnSave" class="secondary" type="button">Speichern</button>
        <button id="btnPing" class="secondary" type="button">Ping</button>
      </div>
      <p class="tiny">Fixes Steuerziel: <strong>oldschool-master</strong>. Kein Umstellen notwendig.</p>
    </section>

    <section class="card">
      <div class="btn-grid">
        <button type="button" data-mode="starting">Starting</button>
        <button type="button" data-mode="gameplay">Gameplay</button>
        <button type="button" data-mode="chatting">Chatting</button>
        <button type="button" data-mode="brb">BRB</button>
        <button type="button" data-mode="outro">Outro</button>
        <button id="btnReload" class="secondary" type="button">Master neu laden</button>
      </div>
    </section>

    <section class="card">
      <div class="toolbar">
        <button id="btnOpenHub" class="secondary" type="button">Regie Startseite</button>
        <button id="btnOpenStudio" class="secondary" type="button">Studio Console</button>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'dangsxr_oldschool_live_deck_v1';
    const TARGET_SCENE = 'oldschool-master';
    const statusEl = document.getElementById('status');
    const apiUrlEl = document.getElementById('apiUrl');
    const apiKeyEl = document.getElementById('apiKey');
    let activeMode = 'starting';

    function defaultApi() {
      return location.origin.replace(/\/$/, '') + '/api/regie-control';
    }

    function setStatus(text, ok) {
      const dotClass = ok ? 'dot ok' : 'dot';
      statusEl.innerHTML = '<span class="' + dotClass + '"></span>' + text;
    }

    function loadConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (err) {
        return null;
      }
    }

    function saveConfig() {
      const cfg = {
        apiUrl: apiUrlEl.value.trim() || defaultApi(),
        apiKey: apiKeyEl.value || ''
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
      setStatus('Gespeichert. API aktiv.', true);
      return cfg;
    }

    function getConfig() {
      return {
        apiUrl: apiUrlEl.value.trim() || defaultApi(),
        apiKey: apiKeyEl.value || ''
      };
    }

    function setActiveButton(mode) {
      activeMode = mode;
      document.querySelectorAll('[data-mode]').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
      });
    }

    async function sendCommand(action, payload) {
      const cfg = getConfig();
      const headers = { 'Content-Type': 'application/json' };
      if (cfg.apiKey) headers['X-Regie-Key'] = cfg.apiKey;

      const res = await fetch(cfg.apiUrl, {
        method: 'POST',
        headers,
        body: JSON.stringify({
          scene: TARGET_SCENE,
          action,
          payload: payload || {}
        })
      });

      let data = null;
      try {
        data = await res.json();
      } catch (err) {
        throw new Error('Antwort ist kein JSON. API URL pruefen.');
      }

      if (!res.ok || !data || !data.success) {
        throw new Error((data && data.message) || ('HTTP ' + res.status));
      }

      return data;
    }

    function modeLabel(mode) {
      const map = {
        starting: 'Starting',
        gameplay: 'Gameplay',
        chatting: 'Chatting',
        brb: 'BRB',
        outro: 'Outro'
      };
      return map[mode] || mode;
    }

    async function switchMode(mode) {
      setActiveButton(mode);
      try {
        const data = await sendCommand('scene.switch', { mode });
        setStatus('Live auf: ' + modeLabel(mode) + ' | Revision ' + data.revision, true);
      } catch (err) {
        setStatus('Fehler beim Schalten: ' + err.message, false);
      }
    }

    async function ping() {
      try {
        const data = await sendCommand('system.ping', { ts: Date.now(), mode: activeMode });
        setStatus('Verbindung ok | Revision ' + data.revision, true);
      } catch (err) {
        setStatus('Ping fehlgeschlagen: ' + err.message, false);
      }
    }

    async function reloadMaster() {
      try {
        const data = await sendCommand('scene.reload', {});
        setStatus('Master neu geladen | Revision ' + data.revision, true);
      } catch (err) {
        setStatus('Reload fehlgeschlagen: ' + err.message, false);
      }
    }

    document.getElementById('btnSave').addEventListener('click', saveConfig);
    document.getElementById('btnPing').addEventListener('click', ping);
    document.getElementById('btnReload').addEventListener('click', reloadMaster);
    document.getElementById('btnOpenHub').addEventListener('click', () => { location.href = '/oldschool-regie.html'; });
    document.getElementById('btnOpenStudio').addEventListener('click', () => { location.href = '/oldschool-studio.html'; });

    document.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.getAttribute('data-mode');
        switchMode(mode);
      });
    });

    (function init() {
      const cfg = loadConfig();
      apiUrlEl.value = (cfg && cfg.apiUrl) || defaultApi();
      apiKeyEl.value = (cfg && cfg.apiKey) || '';
      setActiveButton('starting');
      setStatus('Bereit fuer Live-Schaltung.', true);
    })();
  </script>
</body>
</html>
