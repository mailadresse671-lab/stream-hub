<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>90s Old School — Main Gameplay</title>
  <!-- F3 aus der "DaNgsxr1000 Stream Overlay Suite" (siehe oldschool-starting.html
       fuer die volle Herkunfts-/Format-/Styleguide-Dokumentation).

       MINIMAL-VERSION: Alert-Popup (Follow/Sub/Cheer/Raid) und die dafuer
       noetige Twitch-EventSub-Verbindung wurden auf Nutzerwunsch entfernt -
       wird stattdessen separat/anders geloest. Diese Datei ist jetzt nur
       noch ein rein kosmetisches, transparentes Overlay (Scanlines/Flicker)
       plus optionale Safe-Zone-Einrichtungshilfe. Die eigentlichen Live-
       Widgets (RL-Stats, Hype-Level, Event-Cards, Avatar, Follower-Ziel)
       laufen weiterhin als EIGENSTAENDIGE Streamlabs-Quellen
       (widgets/hype-level.html, widgets/event-cards.html,
       widgets/avatar.html, widgets/follower-goal.html, rl-stats.html).

       Facecam-Rahmen ebenfalls entfernt: Der Streamer zeigt sich nicht im
       Bild (kein Gesicht, keine Stimme) - Zuschauer sehen ausschliesslich
       das Gameplay plus die separaten Overlay-Widgets.

       Safe-Zone-Markierungen (gestrichelte Boxen fuer Scoreboard/Zeit und
       Boost-Anzeige) bleiben als reine Einrichtungshilfe fuer den Streamer
       selbst erhalten, standardmaessig AUSGEBLENDET, nur einblendbar ueber
       ?safezones=1 zum Ausrichten der echten Rocket-League-HUD-Elemente. -->
  <style>
    :root {
      --ink: #000000;
      --paper: #FFFFFF;
      --cream: #E5E5E5;
      --vu: clamp(0.5px, 0.0521vw, 1px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Barlow Condensed', sans-serif; color: var(--cream); background: transparent; }

    @keyframes flicker { 0%, 100% { opacity: .04; } 50% { opacity: .09; } }

    #stage { position: fixed; inset: 0; overflow: hidden; }

    .scanline-overlay { position: absolute; inset: 0; z-index: 90; pointer-events: none; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0px, rgba(0,0,0,.16) 1px, transparent 2px, transparent 4px); mix-blend-mode: multiply; }
    .flicker-overlay { position: absolute; inset: 0; z-index: 91; pointer-events: none; background: #fff; animation: flicker 5s ease-in-out infinite; mix-blend-mode: overlay; }

    .safe-zones { position: absolute; inset: 0; pointer-events: none; z-index: 4; display: none; }
    .safe-zones.visible { display: block; }
    .safe-zone { position: absolute; border: calc(var(--vu) * 2) dashed rgba(255,255,255,.6); background: rgba(0,0,0,.18); border-radius: calc(var(--vu) * 8); display: flex; align-items: center; justify-content: center; text-align: center; }
    .safe-zone span { font-weight: 700; color: var(--cream); }
    .safe-zone.scoreboard { top: calc(var(--vu) * 20); left: calc(var(--vu) * 760); width: calc(var(--vu) * 400); height: calc(var(--vu) * 90); }
    .safe-zone.scoreboard span { font-size: calc(var(--vu) * 20); }
    .safe-zone.boost { bottom: calc(var(--vu) * 70); right: calc(var(--vu) * 30); width: calc(var(--vu) * 230); height: calc(var(--vu) * 150); }
    .safe-zone.boost span { font-size: calc(var(--vu) * 18); line-height: 1.4; }
  </style>
</head>
<body>

  <div id="stage">
    <div class="safe-zones" id="safeZones">
      <div class="safe-zone scoreboard"><span>⏱️ Scoreboard/Zeit — frei halten</span></div>
      <div class="safe-zone boost"><span>⛽ Boost-Anzeige<br>frei halten</span></div>
    </div>

    <div class="scanline-overlay"></div>
    <div class="flicker-overlay"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);

    // ---------- Safe Zones (?safezones=1, standardmaessig ausgeblendet) ----------
    if (params.get('safezones') === '1') {
      document.getElementById('safeZones').classList.add('visible');
    }
  </script>
</body>
</html>
