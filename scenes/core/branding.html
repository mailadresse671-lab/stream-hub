<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Branding</title>
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.88);
      --neon-blue: #38bdf8;
      --accent-orange: #f97316;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text-primary);
    }

    body { padding: 18px; }

    .brand-position {
      position: fixed;
      bottom: 18px;
      right: 18px;
    }

    .shimmer-frame {
      position: relative;
      border-radius: 16px;
      padding: 1.5px;
      background: linear-gradient(120deg,
        rgba(56, 189, 248, 0.15),
        rgba(56, 189, 248, 0.95),
        rgba(249, 115, 22, 0.65),
        rgba(56, 189, 248, 0.15));
      background-size: 300% 300%;
      animation: shimmer 7s ease-in-out infinite;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .brand-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 14.5px;
      padding: 10px 20px 10px 12px;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--neon-blue), var(--accent-orange));
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
      flex-shrink: 0;
    }

    .logo-mark span {
      font-size: 16px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .brand-name .pipe {
      color: var(--text-muted);
      margin: 0 6px;
      font-weight: 400;
    }

    .brand-name .live-word {
      color: var(--accent-orange);
    }

    .brand-sub {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 7px var(--danger);
      animation: pulse 1.8s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.75); }
    }

    .brand-sub-text {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 1.4px;
      color: var(--neon-blue);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="brand-position">
    <div class="shimmer-frame">
      <div class="brand-card">
        <div class="logo-mark"><span>D</span></div>
        <div class="brand-text">
          <span class="brand-name">DaN<span class="pipe">|</span><span class="live-word">LIVE STREAM</span></span>
          <span class="brand-sub">
            <span class="live-dot"></span>
            <span class="brand-sub-text">On Air</span>
          </span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
