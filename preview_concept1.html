<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konzept 1 — 3D Platinum Vinyl</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 30%, #1e2530 0%, #05060a 75%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 60px rgba(56, 189, 248, 0.25));
    }

    .concept-badge {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 20;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(215, 219, 224, 0.35);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #d7dbe0;
    }
    .concept-badge span { color: #38bdf8; }

    .nav-pills {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      display: flex;
      gap: 6px;
    }
    .nav-pills a {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.3);
      backdrop-filter: blur(8px);
      color: #94a3b8;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 10px;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-pills a.active { color: #38bdf8; border-color: #38bdf8; }
    .nav-pills a:hover { color: #f8fafc; }

    .goal-widget {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: linear-gradient(160deg, rgba(30, 37, 48, 0.85), rgba(10, 12, 16, 0.9));
      border: 1px solid rgba(215, 219, 224, 0.3);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 14px 26px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .goal-widget .kicker {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .goal-widget .count {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f8fafc 10%, #d7dbe0 40%, #94a3b8 55%, #f8fafc 75%, #d7dbe0 100%);
      background-size: 220% 220%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sheen 5s ease-in-out infinite;
    }

    @keyframes sheen {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .goal-widget .bar-bg {
      margin-top: 10px;
      width: 220px;
      height: 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .goal-widget .bar-fill {
      width: 99.5%;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #38bdf8, #d7dbe0, #f97316);
      box-shadow: 0 0 12px rgba(215, 219, 224, 0.6);
    }

    .caption {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 10.5px;
      color: #64748b;
      letter-spacing: 0.4px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="concept-badge">Konzept 1 — <span>3D Platinum Vinyl</span></div>

  <div class="nav-pills">
    <a href="preview_concept1.html" class="active">1</a>
    <a href="preview_concept2.html">2</a>
    <a href="preview_concept3.html">3</a>
  </div>

  <div class="goal-widget">
    <div class="kicker">Follower Goal</div>
    <div class="count">209 / 210</div>
    <div class="bar-bg"><div class="bar-fill"></div></div>
  </div>

  <canvas id="scene"></canvas>

  <div class="caption">Idle: langsame Rotation &amp; Sheen · alle 6s: Licht-Puls simuliert einen Alert</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.4, 6);
    camera.lookAt(0, 0, 0);

    // ---- Beleuchtung: liefert die "reflektierende Platin"-Optik allein
    // durch bewegte, farbige Lichtquellen - keine externe HDR/Environment-
    // Textur noetig, kein zusaetzlicher Netzwerk-Request. ----
    scene.add(new THREE.HemisphereLight(0x9fb4d8, 0x0a0a10, 0.55));
    const keyLight = new THREE.PointLight(0x38bdf8, 40, 25);
    keyLight.position.set(-4, 3, 4);
    scene.add(keyLight);
    const rimLight = new THREE.PointLight(0xf97316, 28, 25);
    rimLight.position.set(4, -1.5, -3);
    scene.add(rimLight);
    const frontLight = new THREE.PointLight(0xffffff, 18, 20);
    frontLight.position.set(0, 1, 6);
    scene.add(frontLight);

    // ---- Prozedurale Rillen-Textur (einmalig gezeichnet, kein Redraw pro
    // Frame) fuer die Vinyl-Optik + Roughness-Variation fuer Reflexionen. ----
    function makeGrooveTexture() {
      const size = 1024;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#111318';
      ctx.fillRect(0, 0, size, size);
      const cx = size / 2, cy = size / 2;
      for (let r = 60; r < size / 2 - 8; r += 2.5) {
        const accent = r % 22 < 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = accent ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.035)';
        ctx.lineWidth = accent ? 1.4 : 0.8;
        ctx.stroke();
      }
      return new THREE.CanvasTexture(c);
    }
    const grooveMap = makeGrooveTexture();

    // ---- Vinyl-Scheibe: physisches Material mit hoher Metalness + Clearcoat
    // fuer den Platin-Chrome-Look. ----
    const discGeo = new THREE.CylinderGeometry(2, 2, 0.045, 128);
    const discMat = new THREE.MeshPhysicalMaterial({
      color: 0xd7dbe0,
      metalness: 1,
      roughness: 0.24,
      clearcoat: 1,
      clearcoatRoughness: 0.12,
      map: grooveMap,
      roughnessMap: grooveMap
    });
    const disc = new THREE.Mesh(discGeo, discMat);
    scene.add(disc);

    // ---- Label (Dummy-Goal-Daten direkt auf der Scheibe) ----
    function makeLabelTexture() {
      const size = 512;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 10, 256, 256, 256);
      grad.addColorStop(0, '#1e293b');
      grad.addColorStop(1, '#0f172a');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(256, 256, 256, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#38bdf8';
      ctx.font = '900 46px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('209 / 210', 256, 240);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '800 20px system-ui, sans-serif';
      ctx.letterSpacing = '2px';
      ctx.fillText('FOLLOWER GOAL', 256, 278);
      return new THREE.CanvasTexture(c);
    }
    const labelTex = makeLabelTexture();
    const labelMat = new THREE.MeshBasicMaterial({ map: labelTex });
    const labelGeo = new THREE.CircleGeometry(0.68, 64);

    const labelTop = new THREE.Mesh(labelGeo, labelMat);
    labelTop.rotation.x = -Math.PI / 2;
    labelTop.position.y = 0.024;
    scene.add(labelTop);

    const labelBottom = new THREE.Mesh(labelGeo, labelMat);
    labelBottom.rotation.x = Math.PI / 2;
    labelBottom.position.y = -0.024;
    scene.add(labelBottom);

    // ---- Animations-Loop: Idle-Rotation + alle 6s ein Licht-Puls als
    // Alert-Simulation. ----
    let pulseUntil = 0;

    function animate(time) {
      requestAnimationFrame(animate);
      disc.rotation.y += 0.007;

      const now = time / 1000;
      const pulsing = now < pulseUntil;
      keyLight.intensity += ((pulsing ? 95 : 40) - keyLight.intensity) * 0.06;
      rimLight.intensity += ((pulsing ? 75 : 28) - rimLight.intensity) * 0.06;

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    setInterval(() => {
      pulseUntil = performance.now() / 1000 + 1.4;
    }, 6000);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
