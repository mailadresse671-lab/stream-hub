<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Chat Overlay</title>
  <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/185/tmi.min.js"></script>
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.85);
      --neon-blue: #38bdf8;
      --accent-orange: #f97316;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --warning: #fbbf24;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
    }

    body { padding: 20px; }

    #chat-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: flex-end;
      max-width: 380px;
      width: 100%;
      z-index: 100;
    }

    .chat-msg {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--bg-glass);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-left: 3px solid var(--neon-blue);
      border-radius: 12px;
      padding: 10px 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
      font-size: 13px;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.45s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-dot {
      width: 7px;
      height: 7px;
      margin-top: 5px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
      flex-shrink: 0;
    }

    .msg-body {
      min-width: 0;
    }

    .username {
      font-weight: 800;
      margin-right: 6px;
      display: inline;
    }

    .text {
      color: var(--text-primary);
      word-break: break-word;
    }

    .chat-emote {
      height: 1.6em;
      width: auto;
      vertical-align: middle;
      margin: -2px 1px;
    }

    .fade-out {
      transition: opacity 0.7s ease, transform 0.7s ease;
      opacity: 0;
      transform: translateY(-8px);
    }
  </style>
</head>
<body>

  <div id="chat-container"></div>

  <script>
    // ==========================================
    // DEIN TWITCH KANALNAME
    // ==========================================
    const CHANNEL_NAME = "dangsxr1000";
    // ==========================================

    const AUTO_HIDE_MS = 15000;
    const SYSTEM_HIDE_MS = 6000;
    const MAX_VISIBLE_MESSAGES = 5;

    const container = document.getElementById('chat-container');

    function addMessage(username, text, color = '#38bdf8', isSystem = false, emotesTag = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg';
      const accentColor = isSystem ? '#fbbf24' : color;
      msgDiv.style.borderLeftColor = accentColor;

      msgDiv.innerHTML = `
        <span class="avatar-dot" style="color: ${accentColor}"></span>
        <span class="msg-body">
          <span class="username" style="color: ${accentColor}">${username}:</span>
          <span class="text">${renderMessageHtml(text, emotesTag)}</span>
        </span>
      `;

      container.appendChild(msgDiv);

      if (container.children.length > MAX_VISIBLE_MESSAGES) {
        container.removeChild(container.firstChild);
      }

      setTimeout(() => {
        msgDiv.classList.add('fade-out');
        setTimeout(() => {
          if (msgDiv.parentNode === container) {
            container.removeChild(msgDiv);
          }
        }, 700);
      }, isSystem ? SYSTEM_HIDE_MS : AUTO_HIDE_MS);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Ersetzt Twitch-Emote-Bereiche in der Nachricht (laut tags.emotes von tmi.js)
    // durch <img>-Tags vom Twitch-CDN, der restliche Text bleibt escaped.
    function renderMessageHtml(message, emotesTag) {
      if (!emotesTag || Object.keys(emotesTag).length === 0) {
        return escapeHtml(message);
      }

      const ranges = [];
      for (const id in emotesTag) {
        emotesTag[id].forEach(pos => {
          const [start, end] = pos.split('-').map(Number);
          ranges.push({ id, start, end });
        });
      }
      ranges.sort((a, b) => a.start - b.start);

      let html = '';
      let cursor = 0;

      ranges.forEach(({ id, start, end }) => {
        if (start < cursor) return; // überlappende/kaputte Range überspringen
        if (start > cursor) {
          html += escapeHtml(message.slice(cursor, start));
        }
        const code = message.slice(start, end + 1);
        const src = `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(id)}/default/dark/2.0`;
        html += `<img class="chat-emote" src="${src}" alt="${escapeHtml(code)}" title="${escapeHtml(code)}" draggable="false">`;
        cursor = end + 1;
      });

      if (cursor < message.length) {
        html += escapeHtml(message.slice(cursor));
      }

      return html;
    }

    // 1. Sofortige Start-Testnachricht beim Laden
    addMessage("SYSTEM", "Chat-Overlay geladen! Warte auf Nachrichten...", "#fbbf24", true);

    // 2. Gesicherte Verbindung zu Twitch herstellen
    const client = new tmi.Client({
      options: { debug: false },
      connection: {
        secure: true,
        reconnect: true
      },
      channels: [ CHANNEL_NAME.toLowerCase().trim() ]
    });

    client.connect().catch(err => {
      console.error("Verbindungsfehler:", err);
      addMessage("FEHLER", "Verbindung zum Chat fehlgeschlagen!", "#ef4444", true);
    });

    client.on('message', (channel, tags, message, self) => {
      const userColor = tags.color || '#38bdf8';
      const displayName = tags['display-name'] || tags.username;
      addMessage(displayName, message, userColor, false, tags.emotes);
    });
  </script>

</body>
</html>
