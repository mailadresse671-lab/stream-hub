<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Follower Goal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.88);
      --neon-blue: #38bdf8;
      --accent-orange: #f97316;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --warning: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
    }

    body { padding: 18px; }

    /* ---------- Top-Right Fortschritts-Widget ---------- */

    .goal-position {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 10;
    }

    .shimmer-frame {
      position: relative;
      border-radius: 16px;
      padding: 1.5px;
      background: linear-gradient(120deg,
        rgba(56, 189, 248, 0.15),
        rgba(56, 189, 248, 0.95),
        rgba(249, 115, 22, 0.65),
        rgba(56, 189, 248, 0.15));
      background-size: 300% 300%;
      animation: shimmer 7s ease-in-out infinite;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .goal-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 14.5px;
      padding: 12px 18px;
      min-width: 230px;
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 14px;
    }

    .goal-title {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.4px;
      color: var(--neon-blue);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .goal-stats {
      font-size: 13px;
      font-weight: 900;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-orange), var(--warning));
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.55);
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ---------- Party Pop-up (Bildschirmmitte) ---------- */

    #party-popup {
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96));
      border: 1.5px solid var(--neon-blue);
      border-radius: 20px;
      padding: 34px 58px;
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28),
                  transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 100;
    }

    #party-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .party-tag {
      font-size: 13px;
      font-weight: 900;
      color: var(--neon-blue);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .party-name {
      font-size: 44px;
      font-weight: 900;
      color: var(--text-primary);
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
      margin: 8px 0;
      word-break: break-word;
    }

    .party-thanks {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 8px;
    }

    /* Konfetti Partikel */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      z-index: 99;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Fortschritts-Widget oben rechts -->
  <div class="goal-position">
    <div class="shimmer-frame">
      <div class="goal-card" id="goalContainer">
        <div class="goal-header">
          <span class="goal-title" id="goalTitle">Ziel: 210 Follower</span>
          <span class="goal-stats" id="goalText">209 / 210</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill" id="barFill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Party Pop-up in der Mitte -->
  <div id="party-popup">
    <div class="party-tag" id="partyTag">🎉 NEUER FOLLOWER! 🎉</div>
    <div class="party-name" id="partyName">Name</div>
    <div class="party-thanks" id="partyThanks">Vielen Dank für deinen Support!</div>
  </div>

  <script>
    // DEINE FESTE VERCEL-CLOUD ADRESSE
    const VERCEL_URL = "https://stream-hub-three-gold.vercel.app";

    let currentFollowers = 209;
    const STEP_SIZE = 10;

    function calculateTarget(followers) {
      return Math.ceil((followers + 1) / STEP_SIZE) * STEP_SIZE;
    }

    let targetFollowers = calculateTarget(currentFollowers);

    function updateUI() {
      const previousTarget = targetFollowers - STEP_SIZE;
      const progressInStep = currentFollowers - previousTarget;
      const pct = Math.min(100, Math.max(0, Math.round((progressInStep / STEP_SIZE) * 100)));

      document.getElementById('goalTitle').innerText = `Ziel: ${targetFollowers} Follower`;
      document.getElementById('goalText').innerText = `${currentFollowers} / ${targetFollowers}`;
      document.getElementById('barFill').style.width = pct + '%';
    }

    function playFollowSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.15, now + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.6);
        });
      } catch (e) { console.log(e); }
    }

    function playGoalSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const chord = [261.63, 329.63, 392.00, 523.25, 659.25];
        chord.forEach(freq => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 1.2);
        });

        setTimeout(() => {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.1);
            osc.stop(ctx.currentTime + idx * 0.1 + 0.5);
          });
        }, 300);

      } catch (e) { console.log(e); }
    }

    function triggerConfetti(isGoal) {
      const colors = isGoal ? ['#fbbf24', '#f97316', '#ffffff', '#38bdf8'] : ['#38bdf8', '#22c55e', '#a855f7', '#fbbf24'];
      const count = isGoal ? 120 : 70;

      for (let i = 0; i < count; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.width = Math.random() * 12 + 6 + 'px';
        confetti.style.height = Math.random() * 12 + 6 + 'px';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
        confetti.style.animationDuration = Math.random() * 2 + 1.5 + 's';
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        document.body.appendChild(confetti);

        setTimeout(() => { confetti.remove(); }, 3500);
      }
    }

    function showPartyPopup(name, isGoal) {
      const popup = document.getElementById('party-popup');
      const tag = document.getElementById('partyTag');
      const nameElem = document.getElementById('partyName');
      const thanks = document.getElementById('partyThanks');

      if (isGoal) {
        tag.innerText = "🚀 ZIEL KRACHER! HYPE! 🚀";
        tag.style.color = "#fbbf24";
        nameElem.innerText = name;
        nameElem.style.textShadow = "0 0 30px rgba(251, 191, 36, 0.9)";
        thanks.innerText = `Mega! Ziel erreicht! Nächstes Ziel: ${targetFollowers} Follower!`;
        popup.style.borderColor = "#fbbf24";
        popup.style.boxShadow = "0 0 80px rgba(251, 191, 36, 0.8)";

        playGoalSound();
        triggerConfetti(true);
      } else {
        tag.innerText = "🎉 NEUER FOLLOWER! 🎉";
        tag.style.color = "#38bdf8";
        nameElem.innerText = name;
        nameElem.style.textShadow = "0 0 25px rgba(56, 189, 248, 0.8)";
        thanks.innerText = `Vielen Dank für deinen Support, ${name}! Willkommen im Stream!`;
        popup.style.borderColor = "#38bdf8";
        popup.style.boxShadow = "0 0 60px rgba(56, 189, 248, 0.6)";

        playFollowSound();
        triggerConfetti(false);
      }

      popup.classList.add('show');

      setTimeout(() => {
        popup.classList.remove('show');
        // Warten bis die Ausblend-Transition fertig ist, bevor das nächste Popup startet
        setTimeout(() => {
          popupBusy = false;
          processPopupQueue();
        }, 450);
      }, 6000);
    }

    // Warteschlange, damit mehrere Follower kurz hintereinander (z.B. bei einem Raid)
    // nacheinander vollständig angezeigt werden, statt sich gegenseitig zu unterbrechen.
    const popupQueue = [];
    let popupBusy = false;

    function queuePopup(name, isGoal) {
      popupQueue.push({ name, isGoal });
      processPopupQueue();
    }

    function processPopupQueue() {
      if (popupBusy || popupQueue.length === 0) return;
      popupBusy = true;
      const next = popupQueue.shift();
      showPartyPopup(next.name, next.isGoal);
    }

    async function initFollowerSocket() {
      try {
        const cleanUrl = VERCEL_URL.replace(/\/$/, "");
        const res = await fetch(`${cleanUrl}/api/streamlabs-proxy`);
        const data = await res.json();

        if (!data || !data.success || !data.token) {
          console.error("Streamlabs-Token konnte nicht vom Proxy geladen werden.", data && data.message);
          return;
        }

        const socket = io(`https://sockets.streamlabs.com?token=${data.token}`, { transports: ['websocket'] });

        socket.on('event', (eventData) => {
          if (eventData.type === 'follow') {
            let followerName = "Zuschauer";
            if (eventData.message && eventData.message[0] && eventData.message[0].name) {
              followerName = eventData.message[0].name;
            } else if (eventData.name) {
              followerName = eventData.name;
            }

            currentFollowers += 1;

            if (currentFollowers >= targetFollowers) {
              queuePopup(followerName, true);
              targetFollowers = calculateTarget(currentFollowers);
            } else {
              queuePopup(followerName, false);
            }

            updateUI();
          }
        });
      } catch (e) {
        console.error("Verbindung zum Streamlabs-Proxy fehlgeschlagen:", e);
      }
    }

    updateUI();
    initFollowerSocket();
  </script>

</body>
</html>
