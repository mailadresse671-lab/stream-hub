<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follower Goal Overlay</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      padding: 10px;
    }

    .goal-container {
      display: inline-flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-right: 4px solid #38bdf8;
      border-radius: 12px;
      padding: 12px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      min-width: 260px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .goal-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .goal-stats {
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
    }

    .bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f97316, #fbbf24);
      border-radius: 6px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.6);
    }

    /* Animation bei neuem Follower */
    .pulse-effect {
      animation: hypePulse 0.8s ease-in-out 2;
    }

    @keyframes hypePulse {
      0% { transform: scale(1); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); }
      50% { transform: scale(1.08); box-shadow: 0 0 30px rgba(56, 189, 248, 0.8); border-color: #38bdf8; }
      100% { transform: scale(1); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); }
    }
  </style>
</head>
<body>

  <div class="goal-container" id="goalContainer">
    <div class="goal-header">
      <span class="goal-title">Ziel: 210 Follower</span>
      <span class="goal-stats" id="goalText">209 / 210</span>
    </div>

    <div class="bar-bg">
      <div class="bar-fill" id="barFill"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // EINSTELLUNGEN
    // ==========================================
    let currentFollowers = 209;
    const targetFollowers = 210;
    
    // Deinen Streamlabs Socket Token hier eintragen:
    // (Findest du unter: streamlabs.com/dashboard/settings/api-settings -> Socket API Token)
    const STREAMLABS_SOCKET_TOKEN = "DEIN_STREAMLABS_SOCKET_TOKEN"; 
    // ==========================================

    function updateUI() {
      const pct = Math.min(100, Math.round((currentFollowers / targetFollowers) * 100));
      document.getElementById('barFill').style.width = pct + '%';
      document.getElementById('goalText').innerText = `${currentFollowers} / ${targetFollowers}`;
    }

    // Sound-Synthesizer für den Stream (keine externen MP3s nötig!)
    function playHypeSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 (Level-Up Fanfare)
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.1);
          osc.stop(ctx.currentTime + idx * 0.1 + 0.35);
        });
      } catch (e) { console.log(e); }
    }

    function triggerAlert() {
      playHypeSound();
      const container = document.getElementById('goalContainer');
      container.classList.remove('pulse-effect');
      void container.offsetWidth; // Trigger reflow
      container.classList.add('pulse-effect');
    }

    updateUI();

    // Live WebSockets Anbindung an Streamlabs
    if (STREAMLABS_SOCKET_TOKEN && STREAMLABS_SOCKET_TOKEN !== "DEIN_STREAMLABS_SOCKET_TOKEN") {
      const socket = io(`https://sockets.streamlabs.com?token=${STREAMLABS_SOCKET_TOKEN}`, { transports: ['websocket'] });

      socket.on('event', (eventData) => {
        if (eventData.type === 'follow') {
          currentFollowers += 1;
          updateUI();
          triggerAlert();
        }
      });
    }
  </script>

</body>
</html>
