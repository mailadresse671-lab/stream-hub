<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Party Overlay</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      padding: 10px;
      overflow: hidden;
      height: 100vh;
    }

    /* Das Ziel-Widget dezent oben rechts */
    .goal-container {
      position: fixed;
      top: 15px;
      right: 15px;
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-right: 4px solid #38bdf8;
      border-radius: 12px;
      padding: 10px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      min-width: 240px;
      z-index: 10;
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .goal-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .goal-stats {
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f97316, #fbbf24);
      border-radius: 5px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Party Pop-up in der MITTE des Bildschirms */
    #party-popup {
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96));
      border: 3px solid #fbbf24;
      border-radius: 20px;
      padding: 30px 60px;
      text-align: center;
      box-shadow: 0 0 80px rgba(251, 191, 36, 0.7);
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 100;
    }

    #party-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .party-tag {
      font-size: 14px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .party-name {
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(251, 191, 36, 0.8);
      margin: 5px 0;
      word-break: break-all;
    }

    .party-thanks {
      font-size: 16px;
      color: #cbd5e1;
      font-weight: 600;
      margin-top: 6px;
    }

    /* Konfetti Partikel */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      z-index: 99;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Ziel oben rechts -->
  <div class="goal-container" id="goalContainer">
    <div class="goal-header">
      <span class="goal-title" id="goalTitle">Ziel: 210 Follower</span>
      <span class="goal-stats" id="goalText">209 / 210</span>
    </div>
    <div class="bar-bg">
      <div class="bar-fill" id="barFill"></div>
    </div>
  </div>

  <!-- Riesiges Party Pop-up in der Mitte -->
  <div id="party-popup">
    <div class="party-tag" id="partyTag">🎉 NEUER FOLLOWER! 🎉</div>
    <div class="party-name" id="partyName">Name</div>
    <div class="party-thanks" id="partyThanks">Vielen Dank für deinen Support!</div>
  </div>

  <script>
    // ==========================================
    // EINSTELLUNGEN & AUTO-LEVEL
    // ==========================================
    let currentFollowers = 209; 
    const STEP_SIZE = 10;        

    function calculateTarget(followers) {
      return Math.ceil((followers + 1) / STEP_SIZE) * STEP_SIZE;
    }

    let targetFollowers = calculateTarget(currentFollowers);

    // HIER DEINEN SOCKET-TOKEN EINFÜGEN:
    const STREAMLABS_SOCKET_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ0b2tlbiI6IjIxQTMzN0NEMzEzQkNEQTE5MzU4MzVDNDIzM0EzMDQ0ODJEQzY5MjFDQzgwMTU4OUVDMzgzRUEwMzMwM0M2NTMyODVDOEI3MTIxQzQ0MEVGQkMwMjM3N0Y1Q0Q1QUUxRDRFQ0FBRjQ5QzFERkU4OUQyOTk0OUVDNDU5NjQxODA4RTRFNkNBMzQ1MkIwNkQwMzFFMDZEOThGQkEzRjZEMUI2MDBEOEI1NDBDRjlBNEMzNTRFQ0ZGQUJFQ0Y1RTkwRTdCMEI3MjFFRkJEQkU4REUxNDZBNkE2NURCNDc0ODQyMjhGRDcxQzIzNkYxRTAxQkFFRDJEQTlENUQiLCJyZWFkX29ubHkiOnRydWUsInByZXZlbnRfbWFzdGVyIjp0cnVlLCJ0d2l0Y2hfaWQiOiI3ODU4ODc3MzUifQ.TnmJmgYgJ3RxNuxibF2SsTGkeChRxbTxfYsiZGbc9gk"; 
    // ==========================================

    function updateUI() {
      const previousTarget = targetFollowers - STEP_SIZE;
      const progressInStep = currentFollowers - previousTarget;
      const pct = Math.min(100, Math.max(0, Math.round((progressInStep / STEP_SIZE) * 100)));

      document.getElementById('goalTitle').innerText = `Ziel: ${targetFollowers} Follower`;
      document.getElementById('goalText').innerText = `${currentFollowers} / ${targetFollowers}`;
      document.getElementById('barFill').style.width = pct + '%';
    }

    // Fetter Party-Sound (Synthesizer Fanfare)
    function playPartySound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51]; // A-Dur Akkord Fanfare
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.09);
          osc.stop(ctx.currentTime + idx * 0.09 + 0.4);
        });
      } catch (e) { console.log(e); }
    }

    // Konfetti-Regen auslösen
    function triggerConfetti() {
      const colors = ['#38bdf8', '#fbbf24', '#f97316', '#22c55e', '#ec4899', '#a855f7'];
      for (let i = 0; i < 70; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.width = Math.random() * 10 + 6 + 'px';
        confetti.style.height = Math.random() * 10 + 6 + 'px';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%`' : '0%';
        confetti.style.animationDuration = Math.random() * 2 + 1.5 + 's';
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        document.body.appendChild(confetti);

        setTimeout(() => { confetti.remove(); }, 3500);
      }
    }

    // Party-Alarm auf dem Bildschirm anzeigen
    function showPartyPopup(name, isGoal) {
      const popup = document.getElementById('party-popup');
      const tag = document.getElementById('partyTag');
      const nameElem = document.getElementById('partyName');
      const thanks = document.getElementById('partyThanks');

      if (isGoal) {
        tag.innerText = "🚀 ZIEL GECRACHTT! HYPE! 🚀";
        nameElem.innerText = name;
        thanks.innerText = `Mega! Nächstes Ziel: ${targetFollowers} Follower!`;
      } else {
        tag.innerText = "🎉 NEUER FOLLOWER! 🎉";
        nameElem.innerText = name;
        thanks.innerText = "Vielen Dank für deinen Support & Willkommen im Stream!";
      }

      popup.classList.add('show');
      playPartySound();
      triggerConfetti();

      // Nach 6 Sekunden wieder ausblenden
      setTimeout(() => {
        popup.classList.remove('show');
      }, 6000);
    }

    updateUI();

    // Streamlabs WebSockets Live Verbindung
    if (STREAMLABS_SOCKET_TOKEN && STREAMLABS_SOCKET_TOKEN !== "DEIN_TOKEN_HIER_EINFÜGEN") {
      const socket = io(`https://sockets.streamlabs.com?token=${STREAMLABS_SOCKET_TOKEN}`, { transports: ['websocket'] });

      socket.on('event', (eventData) => {
        if (eventData.type === 'follow') {
          let followerName = "Zuschauer";
          if (eventData.message && eventData.message[0] && eventData.message[0].name) {
            followerName = eventData.message[0].name;
          } else if (eventData.name) {
            followerName = eventData.name;
          }

          currentFollowers += 1;

          if (currentFollowers >= targetFollowers) {
            showPartyPopup(followerName, true);
            targetFollowers = calculateTarget(currentFollowers); // Nächstes Ziel (z.B. 220)
          } else {
            showPartyPopup(followerName, false);
          }

          updateUI();
        }
      });
    }
  </script>

</body>
</html>
