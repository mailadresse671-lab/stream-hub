<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follower Goal Auto-Level Overlay</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      padding: 10px;
    }

    .goal-container {
      display: inline-flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-right: 4px solid #38bdf8;
      border-radius: 12px;
      padding: 12px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      min-width: 260px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .goal-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .goal-stats {
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
    }

    .bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f97316, #fbbf24);
      border-radius: 6px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.6);
    }

    /* Normaler Follower Effekt */
    .pulse-effect {
      animation: hypePulse 0.8s ease-in-out 2;
    }

    /* Ziel-Erreicht Spezial-Effekt (Gold/Neon) */
    .level-up-effect {
      animation: levelUp 1.5s ease-in-out 3;
    }

    @keyframes hypePulse {
      0% { transform: scale(1); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); }
      50% { transform: scale(1.08); box-shadow: 0 0 30px rgba(56, 189, 248, 0.8); border-color: #38bdf8; }
      100% { transform: scale(1); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); }
    }

    @keyframes levelUp {
      0% { transform: scale(1); border-color: #38bdf8; }
      50% { transform: scale(1.12); box-shadow: 0 0 40px rgba(251, 191, 36, 1); border-color: #fbbf24; }
      100% { transform: scale(1); border-color: #38bdf8; }
    }
  </style>
</head>
<body>

  <div class="goal-container" id="goalContainer">
    <div class="goal-header">
      <span class="goal-title" id="goalTitle">Ziel: 210 Follower</span>
      <span class="goal-stats" id="goalText">209 / 210</span>
    </div>

    <div class="bar-bg">
      <div class="bar-fill" id="barFill"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // EINSTELLUNGEN & AUTO-LEVEL LOGIK
    // ==========================================
    let currentFollowers = 209; // Startwert
    const STEP_SIZE = 10;        // Schritte (210, 220, 230...)

    // Berechnet automatisch das nächste Ziel basierend auf aktuellen Followern
    function calculateTarget(followers) {
      return Math.ceil((followers + 1) / STEP_SIZE) * STEP_SIZE;
    }

    let targetFollowers = calculateTarget(currentFollowers);

    // Deinen Streamlabs Socket Token hier eintragen:
    const STREAMLABS_SOCKET_TOKEN = "DEIN_STREAMLABS_SOCKET_TOKEN"; 
    // ==========================================

    function updateUI() {
      // Berechne Prozentwert für den Ladebalken relativ zum aktuellen Ziel
      const previousTarget = targetFollowers - STEP_SIZE;
      const progressInStep = currentFollowers - previousTarget;
      const pct = Math.min(100, Math.max(0, Math.round((progressInStep / STEP_SIZE) * 100)));

      document.getElementById('goalTitle').innerText = `Ziel: ${targetFollowers} Follower`;
      document.getElementById('goalText').innerText = `${currentFollowers} / ${targetFollowers}`;
      document.getElementById('barFill').style.width = pct + '%';
    }

    // Sound 1: Normaler Follower Sound
    function playFollowSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.08);
          osc.stop(ctx.currentTime + idx * 0.08 + 0.25);
        });
      } catch (e) { console.log(e); }
    }

    // Sound 2: Epische Fanfare bei Erreichen des Ziels!
    function playLevelUpSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5, E5, G5, C6, E6
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.1);
          osc.stop(ctx.currentTime + idx * 0.1 + 0.45);
        });
      } catch (e) { console.log(e); }
    }

    function triggerFollowAlert() {
      playFollowSound();
      const container = document.getElementById('goalContainer');
      container.classList.remove('pulse-effect', 'level-up-effect');
      void container.offsetWidth;
      container.classList.add('pulse-effect');
    }

    function triggerGoalReachedAlert() {
      playLevelUpSound();
      const container = document.getElementById('goalContainer');
      container.classList.remove('pulse-effect', 'level-up-effect');
      void container.offsetWidth;
      container.classList.add('level-up-effect');
    }

    updateUI();

    // WebSockets Live Anbindung
    if (STREAMLABS_SOCKET_TOKEN && STREAMLABS_SOCKET_TOKEN !== "DEIN_STREAMLABS_SOCKET_TOKEN") {
      const socket = io(`https://sockets.streamlabs.com?token=${STREAMLABS_SOCKET_TOKEN}`, { transports: ['websocket'] });

      socket.on('event', (eventData) => {
        if (eventData.type === 'follow') {
          currentFollowers += 1;

          // Prüfen, ob das Ziel erreicht wurde
          if (currentFollowers >= targetFollowers) {
            triggerGoalReachedAlert(); // Spezial-Sound & Effekt
            targetFollowers = calculateTarget(currentFollowers); // Ziel automatisch hochschrauben!
          } else {
            triggerFollowAlert(); // Standard-Effekt
          }

          updateUI();
        }
      });
    }
  </script>

</body>
</html>
