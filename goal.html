<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Follower Goal</title>
  <!-- Streamlabs' Socket-Server (sockets.streamlabs.com) spricht das alte
       Socket.IO-v2-Protokoll. Ein v3/v4-Client verbindet sich hier NICHT
       zuverlässig (keine Events, oft ohne sichtbaren Fehler) - deshalb
       bewusst ein 2.x-Client statt der aktuellen Socket.IO-Version. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.3.0/socket.io.min.js"></script>
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.88);
      --neon-blue: #38bdf8;
      --accent-orange: #f97316;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --warning: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
    }

    body { padding: 18px; }

    /* ---------- Top-Right Fortschritts-Widget ---------- */

    .goal-position {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 10;
    }

    .shimmer-frame {
      position: relative;
      border-radius: 16px;
      padding: 1.5px;
      background: linear-gradient(120deg,
        rgba(56, 189, 248, 0.15),
        rgba(56, 189, 248, 0.95),
        rgba(249, 115, 22, 0.65),
        rgba(56, 189, 248, 0.15));
      background-size: 300% 300%;
      animation: shimmer 7s ease-in-out infinite;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .goal-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 14.5px;
      padding: 12px 18px;
      min-width: 230px;
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 14px;
    }

    .goal-title {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.4px;
      color: var(--neon-blue);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .goal-stats {
      font-size: 13px;
      font-weight: 900;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-orange), var(--warning));
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.55);
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Diagnose-Zeile fuer Token-/Socket-Status - klein & dezent, aber auf
       dem Tablet ohne Inspector direkt sichtbar. */
    .debug-line {
      font-size: 8px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ---------- Party Pop-up (Bildschirmmitte) ---------- */

    #party-popup {
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96));
      border: 1.5px solid var(--neon-blue);
      border-radius: 20px;
      padding: 34px 58px;
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28),
                  transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 100;
    }

    #party-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .party-tag {
      font-size: 13px;
      font-weight: 900;
      color: var(--neon-blue);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .party-name {
      font-size: 44px;
      font-weight: 900;
      color: var(--text-primary);
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
      margin: 8px 0;
      word-break: break-word;
    }

    .party-thanks {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 8px;
    }

    /* Konfetti Partikel */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      z-index: 99;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Fortschritts-Widget oben rechts -->
  <div class="goal-position">
    <div class="shimmer-frame">
      <div class="goal-card" id="goalContainer">
        <div class="goal-header">
          <span class="goal-title" id="goalTitle">Ziel: 210 Follower</span>
          <span class="goal-stats" id="goalText">209 / 210</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill" id="barFill"></div>
        </div>
        <div class="debug-line" id="debugLine">Token: … | Socket: –</div>
      </div>
    </div>
  </div>

  <!-- Party Pop-up in der Mitte -->
  <div id="party-popup">
    <div class="party-tag" id="partyTag">🎉 NEUER FOLLOWER! 🎉</div>
    <div class="party-name" id="partyName">Name</div>
    <div class="party-thanks" id="partyThanks">Vielen Dank für deinen Support!</div>
  </div>

  <script>
    // DEINE FESTE VERCEL-CLOUD ADRESSE
    const VERCEL_URL = "https://stream-hub-three-gold.vercel.app";

    let currentFollowers = 209;
    const STEP_SIZE = 10;

    function calculateTarget(followers) {
      return Math.ceil((followers + 1) / STEP_SIZE) * STEP_SIZE;
    }

    let targetFollowers = calculateTarget(currentFollowers);

    function updateUI() {
      const previousTarget = targetFollowers - STEP_SIZE;
      const progressInStep = currentFollowers - previousTarget;
      const pct = Math.min(100, Math.max(0, Math.round((progressInStep / STEP_SIZE) * 100)));

      document.getElementById('goalTitle').innerText = `Ziel: ${targetFollowers} Follower`;
      document.getElementById('goalText').innerText = `${currentFollowers} / ${targetFollowers}`;
      document.getElementById('barFill').style.width = pct + '%';
    }

    // ---------- Web-Audio-Alertsystem ----------
    // Sounds werden einmal beim Laden als dekodierte AudioBuffer vorgehalten,
    // damit sie beim Event ohne Netzwerk-/Dekodier-Delay sofort abspielbar sind.
    const SOUND_FILES = {
      follow: 'follow.mp3',
      sub: 'sub.mp3',
      bits: 'bits.mp3',
      raid: 'raid.mp3'
    };

    let audioCtx = null;
    const soundBuffers = {};
    const soundUrls = {};

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        console.log('[Audio] AudioContext erstellt, initialer state:', audioCtx.state);
      }
      return audioCtx;
    }

    // Zentrale Resume-Funktion: wird von der Touch/Klick-Freischaltung (1),
    // beim Eintreffen eines Socket-Events (2) und vor jeder Wiedergabe erneut
    // versucht - resume() auf einem bereits laufenden Context ist ein
    // günstiges No-op, mehrfaches Aufrufen ist also unproblematisch.
    async function resumeAudioContext(reason) {
      const ctx = getAudioContext();
      if (ctx.state !== 'suspended') {
        console.log(`[Audio] state ist bereits "${ctx.state}" (Auslöser: ${reason}) - kein Resume nötig.`);
        return ctx;
      }
      console.warn(`[Audio] AudioContext ist "suspended" (Auslöser: ${reason}), versuche resume()...`);
      try {
        await ctx.resume();
        console.log(`[Audio] resume() erfolgreich (Auslöser: ${reason}), neuer state: "${ctx.state}".`);
      } catch (err) {
        console.warn(`[Audio] resume() fehlgeschlagen (Auslöser: ${reason}) - Browser blockiert Web Audio vermutlich ohne Nutzer-Geste:`, err);
      }
      return ctx;
    }

    // 1. AudioContext-Unlocking: die erste Touch-/Klick-/Tasten-Interaktion
    // auf der Seite schaltet den AudioContext sofort frei.
    const AUDIO_UNLOCK_EVENTS = ['pointerdown', 'touchstart', 'click', 'keydown'];
    function unlockAudioOnFirstInteraction() {
      console.log('[Audio] Erste Nutzer-Interaktion erkannt, versuche Freischaltung...');
      resumeAudioContext('erste Nutzer-Interaktion');
      AUDIO_UNLOCK_EVENTS.forEach(evt => document.removeEventListener(evt, unlockAudioOnFirstInteraction));
    }
    AUDIO_UNLOCK_EVENTS.forEach(evt => document.addEventListener(evt, unlockAudioOnFirstInteraction, { passive: true }));

    // Fehlt eine Sounddatei (noch) im Repo, bleibt der jeweilige Alert einfach
    // stumm - Popup/Confetti/Warteschlange laufen davon unbeeinflusst weiter.
    async function preloadSounds() {
      const ctx = getAudioContext();
      console.log('[Audio] Starte Sound-Preload für:', Object.keys(SOUND_FILES).join(', '));

      await Promise.all(Object.entries(SOUND_FILES).map(async ([key, file]) => {
        const url = `${VERCEL_URL}/assets/audio/${file}`;
        soundUrls[key] = url;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const arrayBuffer = await res.arrayBuffer();
          soundBuffers[key] = await ctx.decodeAudioData(arrayBuffer);
          console.log(`[Audio] "${file}" geladen und dekodiert (${key}).`);
        } catch (e) {
          console.warn(`[Audio] Sound "${file}" nicht verfügbar, Alert "${key}" bleibt stumm:`, e.message);
        }
      }));

      const loaded = Object.keys(soundBuffers);
      const missing = Object.keys(SOUND_FILES).filter(k => !soundBuffers[k]);
      console.log(`[Audio] Preload abgeschlossen. Geladen: [${loaded.join(', ') || '-'}] | Fehlend: [${missing.join(', ') || '-'}]`);
    }

    // 3. Fallback: einfaches HTML5-<audio>-Element, falls Web Audio blockiert
    // bleibt (z.B. AudioContext bleibt trotz resume()-Versuch "suspended").
    function playHtmlAudioFallback(key) {
      const url = soundUrls[key];
      if (!url) {
        console.warn(`[Audio] Kein Fallback für "${key}" möglich - Datei-URL unbekannt.`);
        return;
      }
      const el = new Audio(url);
      el.play()
        .then(() => console.log(`[Audio] Fallback-Wiedergabe (HTML5 Audio) für "${key}" gestartet.`))
        .catch(err => console.warn(`[Audio] Fallback-Wiedergabe (HTML5 Audio) für "${key}" ebenfalls blockiert:`, err));
    }

    async function playFileSound(key) {
      if (!soundBuffers[key]) {
        console.warn(`[Audio] Kein geladener Sound für "${key}" vorhanden (Datei fehlt/fehlgeschlagen) - kein Ton.`);
        return;
      }

      const ctx = await resumeAudioContext(`Wiedergabe "${key}"`);

      if (ctx.state === 'running') {
        const source = ctx.createBufferSource();
        source.buffer = soundBuffers[key];
        source.connect(ctx.destination);
        source.start(0);
        console.log(`[Audio] "${key}" via Web Audio API abgespielt.`);
        return;
      }

      console.warn(`[Audio] Web Audio weiterhin blockiert (state: "${ctx.state}") - nutze HTML5-Audio-Fallback für "${key}".`);
      playHtmlAudioFallback(key);
    }

    async function playGoalSound() {
      try {
        const ctx = await resumeAudioContext('Wiedergabe "goal"');
        if (ctx.state !== 'running') {
          console.warn(`[Audio] Web Audio blockiert (state: "${ctx.state}") - Ziel-Fanfare basiert auf Synthese und hat keinen HTML5-Fallback, bleibt stumm.`);
          return;
        }
        const now = ctx.currentTime;
        const chord = [261.63, 329.63, 392.00, 523.25, 659.25];
        chord.forEach(freq => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 1.2);
        });

        setTimeout(() => {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.1);
            osc.stop(ctx.currentTime + idx * 0.1 + 0.5);
          });
        }, 300);

      } catch (e) { console.log(e); }
    }

    function triggerConfetti(colors, count) {
      for (let i = 0; i < count; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.width = Math.random() * 12 + 6 + 'px';
        confetti.style.height = Math.random() * 12 + 6 + 'px';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
        confetti.style.animationDuration = Math.random() * 2 + 1.5 + 's';
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        document.body.appendChild(confetti);

        setTimeout(() => { confetti.remove(); }, 3500);
      }
    }

    // Ein Eintrag pro Alert-Art: Anzeige-Text/-Farben, Confetti-Menge und Sound
    // an einer Stelle, statt den Popup-Code für jede Event-Art zu duplizieren.
    const ALERT_CONFIG = {
      follow: {
        tag: '🎉 NEUER FOLLOWER! 🎉',
        color: '#38bdf8',
        glow: 'rgba(56, 189, 248, 0.6)',
        confetti: ['#38bdf8', '#22c55e', '#a855f7', '#fbbf24'],
        confettiCount: 70,
        thanks: p => `Vielen Dank für deinen Support, ${p.name}! Willkommen im Stream!`,
        sound: () => playFileSound('follow')
      },
      goal: {
        tag: '🚀 ZIEL KRACHER! HYPE! 🚀',
        color: '#fbbf24',
        glow: 'rgba(251, 191, 36, 0.8)',
        confetti: ['#fbbf24', '#f97316', '#ffffff', '#38bdf8'],
        confettiCount: 120,
        thanks: p => `Mega! Ziel erreicht! Nächstes Ziel: ${p.nextTarget} Follower!`,
        sound: () => playGoalSound()
      },
      sub: {
        tag: '⭐ NEUER SUB! ⭐',
        color: '#a855f7',
        glow: 'rgba(168, 85, 247, 0.65)',
        confetti: ['#a855f7', '#38bdf8', '#fbbf24', '#ffffff'],
        confettiCount: 90,
        thanks: p => `Willkommen in der Community, ${p.name}!`,
        sound: () => playFileSound('sub')
      },
      resub: {
        tag: '🔥 RESUB! 🔥',
        color: '#a855f7',
        glow: 'rgba(168, 85, 247, 0.65)',
        confetti: ['#a855f7', '#38bdf8', '#fbbf24', '#ffffff'],
        confettiCount: 90,
        thanks: p => `Danke, dass du seit ${p.months} Monaten dabei bist, ${p.name}!`,
        sound: () => playFileSound('sub')
      },
      cheer: {
        tag: '💎 BITS! 💎',
        color: '#f97316',
        glow: 'rgba(249, 115, 22, 0.65)',
        confetti: ['#f97316', '#fbbf24', '#ffffff'],
        confettiCount: 100,
        thanks: p => `Danke für ${p.amount} Bits, ${p.name}!`,
        sound: () => playFileSound('bits')
      },
      raid: {
        tag: '🚨 RAID! 🚨',
        color: '#ef4444',
        glow: 'rgba(239, 68, 68, 0.7)',
        confetti: ['#ef4444', '#f97316', '#fbbf24'],
        confettiCount: 130,
        thanks: p => `Willkommen, ${p.name}, mit ${p.viewers} Zuschauern!`,
        sound: () => playFileSound('raid')
      }
    };

    function showPartyPopup(kind, payload) {
      const config = ALERT_CONFIG[kind];
      if (!config) {
        popupBusy = false;
        processPopupQueue();
        return;
      }

      const popup = document.getElementById('party-popup');
      const tag = document.getElementById('partyTag');
      const nameElem = document.getElementById('partyName');
      const thanks = document.getElementById('partyThanks');

      tag.innerText = config.tag;
      tag.style.color = config.color;
      nameElem.innerText = payload.name;
      nameElem.style.textShadow = `0 0 25px ${config.glow}`;
      thanks.innerText = config.thanks(payload);
      popup.style.borderColor = config.color;
      popup.style.boxShadow = `0 0 60px ${config.glow}`;

      config.sound();
      triggerConfetti(config.confetti, config.confettiCount);

      popup.classList.add('show');

      setTimeout(() => {
        popup.classList.remove('show');
        // Warten bis die Ausblend-Transition fertig ist, bevor das nächste Popup startet
        setTimeout(() => {
          popupBusy = false;
          processPopupQueue();
        }, 450);
      }, 6000);
    }

    // Warteschlange, damit mehrere Events kurz hintereinander (z.B. Bit-Train
    // oder Raid) nacheinander vollständig angezeigt werden, statt sich
    // gegenseitig zu unterbrechen.
    const popupQueue = [];
    let popupBusy = false;

    function queuePopup(kind, payload) {
      popupQueue.push({ kind, payload });
      processPopupQueue();
    }

    function processPopupQueue() {
      if (popupBusy || popupQueue.length === 0) return;
      popupBusy = true;
      const next = popupQueue.shift();
      showPartyPopup(next.kind, next.payload);
    }

    // 3. Sichtbarer Verbindungsstatus - direkt im Widget, damit man auf dem
    // Tablet ohne Inspector sieht, ob Token/Socket stehen.
    function setDebugStatus(tokenState, socketState) {
      const el = document.getElementById('debugLine');
      if (!el) return;
      const tokenLabel = { pending: '…', ok: '✓', failed: '✗' }[tokenState] || tokenState;
      const socketLabel = {
        idle: '–',
        connecting: '… verbindet',
        connected: '✓ verbunden',
        disconnected: '✗ getrennt',
        error: '✗ Fehler'
      }[socketState] || socketState;
      el.innerText = `Token: ${tokenLabel} | Socket: ${socketLabel}`;
    }

    async function initFollowerSocket() {
      setDebugStatus('pending', 'idle');
      console.log('[Streamlabs] Fordere Socket-Token von /api/streamlabs-proxy an...');

      // 1. Token-Empfang eindeutig prüfen und loggen - eigener try/catch,
      // damit ein späterer Socket-Fehler den Token-Status nicht faelschlich
      // ueberschreibt.
      let token;
      try {
        const cleanUrl = VERCEL_URL.replace(/\/$/, "");
        const res = await fetch(`${cleanUrl}/api/streamlabs-proxy`);
        const data = await res.json();

        if (!data || !data.success || !data.token) {
          console.error('[Streamlabs] Token NICHT erhalten:', data && data.message);
          setDebugStatus('failed', 'idle');
          return;
        }
        token = data.token;
        console.log('[Streamlabs] Token erhalten (Länge:', token.length, 'Zeichen).');
        setDebugStatus('ok', 'connecting');
      } catch (e) {
        console.error('[Streamlabs] Verbindung zum Streamlabs-Proxy fehlgeschlagen:', e);
        setDebugStatus('failed', 'idle');
        return;
      }

      // 2. Verbindungsaufbau: Server-URL und Event-Name ('event') sind laut
      // Streamlabs-Doku korrekt. Wichtig ist der Client: Streamlabs' Socket-
      // Server spricht Socket.IO v2 - ein v4-Client verbindet sich damit
      // nicht zuverlässig, siehe Script-Tag im <head>. Token wird bewusst
      // über die "query"-Option übergeben statt in die URL eingebettet
      // (offizielles Streamlabs-Beispiel-Pattern).
      try {
        const socket = io('https://sockets.streamlabs.com', {
          query: { token },
          transports: ['websocket', 'polling']
        });

        socket.on('connect', () => {
          console.log('[Streamlabs] Socket verbunden. Socket-ID:', socket.id);
          setDebugStatus('ok', 'connected');
        });

        socket.on('disconnect', (reason) => {
          console.warn('[Streamlabs] Socket getrennt. Grund:', reason);
          setDebugStatus('ok', 'disconnected');
        });

        socket.on('connect_error', (err) => {
          console.error('[Streamlabs] Verbindungsfehler:', err && err.message ? err.message : err);
          setDebugStatus('ok', 'error');
        });

        socket.on('event', (eventData) => {
          console.log('[Streamlabs] Event empfangen:', eventData.type, eventData);
          const msg = (eventData.message && eventData.message[0]) || {};

          // 2. Auto-Resume: bereits beim Eintreffen des Events versuchen, den
          // AudioContext freizuschalten - nicht erst kurz vor der Wiedergabe,
          // da das Popup (und damit der Sound) bei voller Warteschlange erst
          // später drankommt.
          resumeAudioContext(`Socket-Event "${eventData.type}"`);

          if (eventData.type === 'follow') {
            const followerName = msg.name || eventData.name || 'Zuschauer';
            currentFollowers += 1;

            if (currentFollowers >= targetFollowers) {
              const nextTarget = calculateTarget(currentFollowers);
              queuePopup('goal', { name: followerName, nextTarget });
              targetFollowers = nextTarget;
            } else {
              queuePopup('follow', { name: followerName });
            }

            updateUI();
            return;
          }

          // Hinweis: type-/Feldnamen unten (subscription/resub/cheer/raid,
          // months/amount/raiders) entsprechen der gängigen Streamlabs-Socket-
          // Struktur, sollten beim ersten echten Event im Log aber gegen-
          // geprüft werden, falls ein Alert nicht wie erwartet triggert.
          if (eventData.type === 'subscription') {
            const name = msg.name || eventData.name || 'Zuschauer';
            const months = msg.months || msg.streak_months || 1;
            queuePopup(months > 1 ? 'resub' : 'sub', { name, months });
            return;
          }

          if (eventData.type === 'resub') {
            const name = msg.name || eventData.name || 'Zuschauer';
            queuePopup('resub', { name, months: msg.months || msg.streak_months || '?' });
            return;
          }

          if (eventData.type === 'cheer') {
            const name = msg.name || eventData.name || 'Zuschauer';
            queuePopup('cheer', { name, amount: msg.amount || 0 });
            return;
          }

          if (eventData.type === 'raid') {
            const name = msg.name || msg.from || eventData.name || 'Ein Raid';
            queuePopup('raid', { name, viewers: msg.raiders || msg.viewers || '?' });
            return;
          }
        });
      } catch (e) {
        console.error('[Streamlabs] Socket-Erstellung fehlgeschlagen (Socket.IO-Client nicht geladen?):', e);
        setDebugStatus('ok', 'error');
      }
    }

    updateUI();
    preloadSounds();
    initFollowerSocket();
  </script>

</body>
</html>
