<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Avatar</title>
  <!-- Modul 3: eigenes Bild statt CSS-Maske (assets/images/avatar_idle.png /
       avatar_action.png, vom Nutzer bereitgestellt, echte RGBA-Transparenz).
       Zwei Bild-Zustaende statt nur einem: IDLE (Dauerzustand, leichtes
       CSS-Wippen) wechselt bei jedem Event (Chat-Nachricht) fuer ca. 3.5s
       auf ACTION (Bild-Swap + Neon-Rot-Glow-Puls), dann fliessend
       (Opacity-Crossfade) zurueck auf IDLE. Kein Mikro noetig, siehe
       Modul-3-Historie in CLAUDE.md. -->
  <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/185/tmi.min.js"></script>
  <style>
    :root {
      --blood: #ff1a1a;
      --blood-glow: rgba(255, 26, 26, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      overflow: hidden;
      height: 100vh;
    }

    .avatar-position {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 210px;
    }

    /* Glow-Impuls im Hintergrund waehrend des Action-Zustands - pulsiert
       kontinuierlich in Neon-Rot statt nur einmalig aufzublitzen. */
    .avatar-glow-bg {
      position: absolute;
      inset: -26px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--blood-glow), transparent 70%);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .avatar-glow-bg.action {
      opacity: 1;
      animation: avatarGlowPulse 1s ease-in-out infinite;
    }
    @keyframes avatarGlowPulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.16); opacity: 1; }
    }

    /* Aeussere Huelle traegt das dauerhafte Idle-Wippen (CSS-Animation) -
       getrennt vom Punch-Wrapper, der per JS fuer den Reaktions-Bounce
       skaliert/verschoben wird (gleiches Trennprinzip wie ueberall sonst
       im Projekt: zwei Transform-Quellen duerfen sich nicht gegenseitig
       ueberschreiben). */
    .avatar-bob {
      animation: avatarIdleBounce 3.2s ease-in-out infinite;
      transform-origin: 50% 100%;
    }
    @keyframes avatarIdleBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(-1.2deg); }
    }

    /* Punch-Wrapper: kurzer Bounce-Impuls bei jedem Trigger, unabhaengig
       vom darunterliegenden Idle-Wippen. Haelt die beiden gestapelten
       Bild-Layer, die per Opacity ueberblendet werden (fliessender
       Uebergang statt hartem src-Swap). */
    .avatar-punch {
      position: relative;
      transition: transform 0.12s ease-out;
      transform-origin: 50% 100%;
    }
    .avatar-punch.punch {
      transform: translateY(-16px) scale(1.05);
    }

    .avatar-layer {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.65));
      transition: opacity 0.4s ease;
    }
    .avatar-layer-idle { position: relative; opacity: 1; }
    .avatar-layer-action { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
    .avatar-punch.action .avatar-layer-idle { opacity: 0; }
    .avatar-punch.action .avatar-layer-action { opacity: 1; }
  </style>
</head>
<body>

  <div class="avatar-position">
    <div class="avatar-glow-bg" id="avatarGlow"></div>
    <div class="avatar-bob">
      <div class="avatar-punch" id="avatarPunch">
        <img class="avatar-layer avatar-layer-idle" src="assets/images/avatar_idle.png" alt="DaN Avatar">
        <img class="avatar-layer avatar-layer-action" src="assets/images/avatar_action.png" alt="DaN Avatar (Action)">
      </div>
    </div>
  </div>

  <script>
    // ?test=speak simuliert einen Reaktions-Puls ohne echtes Mikro/Chat -
    // gleiches Prinzip wie goal.html's ?test=.
    const TEST_MODE = new URLSearchParams(location.search).get('test') === 'speak';
    const MIC_SPEAK_THRESHOLD = 0.08;

    const avatarPunch = document.getElementById('avatarPunch');
    const avatarGlow = document.getElementById('avatarGlow');

    const ACTION_DURATION_MS = 3500;
    let actionResetTimer = null;

    let lastPunchAt = 0;
    const PUNCH_COOLDOWN_MS = 350;

    function triggerReaction() {
      const now = performance.now();
      // Kurzer Bounce-Impuls - per Cooldown gegen Nachrichten-Spam gedrosselt.
      if (now - lastPunchAt >= PUNCH_COOLDOWN_MS) {
        lastPunchAt = now;
        avatarPunch.classList.add('punch');
        setTimeout(() => avatarPunch.classList.remove('punch'), 280);
      }

      // Action-Bild + Glow-Puls halten ca. 3.5s; jedes weitere Event
      // waehrenddessen verlaengert die Anzeigedauer (Baer bleibt "hyped",
      // solange staendig Events reinkommen), statt hart abzuschneiden.
      avatarPunch.classList.add('action');
      avatarGlow.classList.add('action');
      clearTimeout(actionResetTimer);
      actionResetTimer = setTimeout(() => {
        avatarPunch.classList.remove('action');
        avatarGlow.classList.remove('action');
      }, ACTION_DURATION_MS);
    }

    // ---------- Chat-reaktiv: "Chat ist meine Stimme" ----------
    // Eigene tmi.js-Verbindung (in try/catch gekapselt, damit ein CDN-
    // Ausfall die Idle-Animation nicht mitreisst). Jede eingehende
    // Nachricht loest einen kurzen Bounce+Glow-Puls aus.
    const CHAT_REACT_CHANNEL = 'dangsxr1000';
    try {
      const reactChatClient = new tmi.Client({
        options: { debug: false },
        connection: { secure: true, reconnect: true },
        channels: [CHAT_REACT_CHANNEL]
      });
      reactChatClient.connect().catch(err => {
        console.warn('[Avatar] Chat-Reaktivitaet: Verbindung fehlgeschlagen:', err.message || err);
      });
      reactChatClient.on('message', (channel, tags, message, self) => {
        if (self) return;
        triggerReaction();
      });
    } catch (e) {
      console.warn('[Avatar] tmi.js nicht verfuegbar, Chat-Reaktivitaet deaktiviert (Idle-Animation laeuft unabhaengig davon weiter):', e.message);
    }

    // ---------- Mikro-Reaktivitaet (kostenloser Bonus-Pfad) ----------
    // In der Streamlabs-Mobile-WebView bestaetigt blockiert - bleibt im
    // Code, falls die Seite je in einem weniger restriktiven Kontext
    // laeuft; schlaegt es fehl, laeuft die Chat-/Idle-Animation unveraendert
    // weiter.
    function startMicVisualLoop(getLevel) {
      function step() {
        const level = getLevel();
        if (level > MIC_SPEAK_THRESHOLD) triggerReaction();
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function startMicTestMode() {
      let t = 0;
      startMicVisualLoop(() => {
        t += 0.05;
        return Math.max(0, Math.sin(t) * 0.5 + 0.5) * (0.6 + Math.random() * 0.4);
      });
    }

    async function tryStartMic() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        // Bewusst NICHT mit audioCtx.destination verbunden - sonst waere
        // das eigene Mikrofon im Stream als Echo/Feedback zu hoeren.
        source.connect(analyser);

        startMicVisualLoop(() => {
          analyser.getByteTimeDomainData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += Math.abs(dataArray[i] - 128);
          return Math.min(1, (sum / dataArray.length) / 40);
        });
        console.log('[Avatar] Mikrofon-Bonus aktiv - Reaktionen jetzt zusaetzlich stimmgesteuert.');
      } catch (err) {
        console.log('[Avatar] Mikrofon-Bonus nicht verfuegbar (' + (err.name || 'Fehler') + ') - Idle-/Chat-Animation laeuft normal weiter.');
      }
    }

    if (TEST_MODE) {
      startMicTestMode();
    } else {
      tryStartMic();
    }
  </script>

</body>
</html>
