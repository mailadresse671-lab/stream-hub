<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oldschool Master Stage</title>
  <style>
    :root {
      --bg: #050505;
      --fg: #f4f4f4;
      --accent: #c8102e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--fg);
      font-family: Arial, sans-serif;
    }
    #stageViewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: transparent;
    }
    #stage {
      position: fixed;
      top: 0;
      left: 0;
      border: 0;
      width: 1920px;
      height: 1080px;
      background: transparent;
      transform-origin: top left;
      will-change: transform;
    }
    #hud {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(0,0,0,.55);
      color: var(--fg);
      padding: 6px 12px;
      font-size: 12px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    body.hide-hud #hud {
      display: none;
    }
    .state {
      color: #ffffff;
      font-weight: 700;
    }
    .state.warn {
      color: #ff8a8a;
    }
    .state.ok {
      color: #bdf6ca;
    }
    .mode {
      color: #ffffff;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 4px;
    }
    .transport {
      color: #a8acb7;
      font-weight: 600;
      margin-left: 6px;
      font-size: 11px;
      letter-spacing: 0.3px;
    }
    .transport.live {
      color: #bdf6ca;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 8px;
      box-shadow: 0 0 8px rgba(200,16,46,0.8);
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="stageViewport">
    <iframe id="stage" allow="autoplay"></iframe>
  </div>
  <div id="hud"><span class="dot"></span><span class="state" id="state">Verbinde...</span> <span class="mode" id="mode">starting</span><span class="transport" id="transport">Polling</span></div>

  <!-- Lokal gehostetes Browser-Bundle statt CDN-Link, gleiches Muster wie
       assets/js/tmi.min.js (siehe CLAUDE.md tmi.js-Historie) - Streamlabs-
       Mobile-WebView-CDN-Zuverlaessigkeit war bereits mehrfach ein echtes
       Problem in diesem Projekt. Setzt bei Erfolg window.Pusher. -->
  <script src="/assets/js/pusher.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const apiUrl = params.get('regieApi') || '/api/regie-control';
    const pollMs = Math.max(700, Number(params.get('regiePoll')) || 1200);
    const targetSceneName = 'oldschool-master';
    const hideHud = params.get('hud') === '0';
    const stageWidth = Math.max(1, Number(params.get('stageW')) || 1920);
    const stageHeight = Math.max(1, Number(params.get('stageH')) || 1080);
    // fit=device (Default): iframe fuellt den echten Geraete-Viewport komplett,
    // damit auf Hochformat-Handys keine grossen schwarzen Balken entstehen.
    // fit=contain/cover bleiben als explizite Override-Modi verfuegbar.
    const fitMode = (params.get('fit') || 'device').toLowerCase();
    const stage = document.getElementById('stage');
    const stageViewport = document.getElementById('stageViewport');
    const stateEl = document.getElementById('state');
    const modeEl = document.getElementById('mode');
    const transportEl = document.getElementById('transport');

    stage.style.width = stageWidth + 'px';
    stage.style.height = stageHeight + 'px';

    function fitStage() {
      const vw = stageViewport.clientWidth || window.innerWidth || stageWidth;
      const vh = stageViewport.clientHeight || window.innerHeight || stageHeight;

      if (fitMode === 'device') {
        stage.style.width = vw + 'px';
        stage.style.height = vh + 'px';
        stage.style.transform = 'translate(0px, 0px) scale(1)';
        return;
      }

      stage.style.width = stageWidth + 'px';
      stage.style.height = stageHeight + 'px';
      const scaleX = vw / stageWidth;
      const scaleY = vh / stageHeight;
      const scale = fitMode === 'cover' ? Math.max(scaleX, scaleY) : Math.min(scaleX, scaleY);
      const offsetX = (vw - stageWidth * scale) / 2;
      const offsetY = (vh - stageHeight * scale) / 2;
      stage.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    }

    if (hideHud) {
      document.body.classList.add('hide-hud');
    }

    const sceneMap = {
      starting: '/oldschool-starting.html',
      gameplay: '/oldschool-gameplay.html',
      technical: '/oldschool-technical-issue.html',
      chatting: '/oldschool-chatting.html',
      brb: '/oldschool-brb.html',
      outro: '/oldschool-outro.html'
    };

    const FORWARDED_PARAMS = [
      'channel',
      'track',
      'artist',
      'minutes',
      'rlMode',
      'rlPlaylist'
    ];

    const defaultMode = (params.get('mode') || 'starting').toLowerCase();
    let currentMode = sceneMap[defaultMode] ? defaultMode : 'starting';
    let since = 0;
    let failures = 0;
    let timer = null;
    let lastAppliedCommandId = null;
    let pusherInitialized = false;
    let pusherClient = null;

    function buildSceneUrl(mode) {
      const raw = params.get(mode);
      const base = raw && raw.trim() ? raw.trim() : sceneMap[mode];
      if (!base) return '';

      const url = new URL(base, location.origin);
      FORWARDED_PARAMS.forEach((key) => {
        const value = params.get(key);
        if (value !== null && !url.searchParams.has(key)) {
          url.searchParams.set(key, value);
        }
      });

      return url.pathname + url.search + url.hash;
    }

    function setStatus(text, kind) {
      stateEl.textContent = text;
      stateEl.className = 'state' + (kind ? ' ' + kind : '');
    }

    function setMode(mode) {
      const nextMode = sceneMap[mode] ? mode : null;
      if (!nextMode) {
        setStatus('Unbekannter Modus', 'warn');
        return;
      }
      const nextUrl = buildSceneUrl(nextMode);
      if (!nextUrl) {
        setStatus('URL fehlt', 'warn');
        return;
      }
      currentMode = nextMode;
      modeEl.textContent = nextMode;
      stage.src = nextUrl;
      setStatus('Live', 'ok');
    }

    function applyCommand(command) {
      if (!command || command.scene !== targetSceneName) return;
      // scene.switch/scene.reload sind idempotent (dasselbe stage.src nochmal
      // setzen ist harmlos) - dieser einfache Vergleich gegen die zuletzt
      // angewandte command.id vermeidet trotzdem unnoetige Doppel-Anwendung,
      // falls derselbe Befehl sowohl per Pusher als auch per nachfolgendem
      // Poll ankommt (siehe CLAUDE.md "Fertig & gemerged", Pusher-Kurskorrektur).
      if (command.id != null && command.id === lastAppliedCommandId) return;
      lastAppliedCommandId = command.id;

      const action = command.action;
      const payload = command.payload || {};

      if (action === 'scene.switch') {
        setMode(String(payload.mode || '').toLowerCase());
        return;
      }

      if (action === 'scene.reload') {
        stage.src = stage.src;
        setStatus('Neu geladen', 'ok');
        return;
      }
    }

    function setTransport(mode) {
      transportEl.textContent = mode === 'realtime' ? 'Live (Echtzeit)' : 'Live (Polling)';
      transportEl.classList.toggle('live', mode === 'realtime');
    }

    // Echtzeit-Broadcast-Kanal (Kurskorrektur 11.08.2026, siehe CLAUDE.md
    // "Fertig & gemerged"): ergaenzt das bestehende Polling, ersetzt es NICHT.
    // Wird erst initialisiert, sobald ein Poll pusherKey/pusherCluster liefert
    // (server-seitig nur gesetzt, wenn alle vier PUSHER_*-Env-Vars konfiguriert
    // sind) - ohne Konfiguration bleibt die Seite bei reinem Polling, exakt wie
    // vor dieser Aenderung.
    function initPusherIfNeeded(data) {
      if (pusherInitialized) return;
      if (!data || !data.pusherKey || !data.pusherCluster) return;
      if (typeof Pusher === 'undefined') {
        console.warn('assets/js/pusher.min.js nicht geladen - bleibe bei reinem Polling.');
        return;
      }

      pusherInitialized = true;
      try {
        pusherClient = new Pusher(data.pusherKey, { cluster: data.pusherCluster });
        const channel = pusherClient.subscribe('regie-control');
        channel.bind('command', function (command) {
          applyCommand(command);
        });
        pusherClient.connection.bind('connected', function () {
          setTransport('realtime');
        });
        pusherClient.connection.bind('unavailable', function () {
          setTransport('polling');
        });
        pusherClient.connection.bind('failed', function () {
          setTransport('polling');
        });
        pusherClient.connection.bind('disconnected', function () {
          setTransport('polling');
        });
      } catch (err) {
        // Darf die Seite nie mitreissen - Polling laeuft unveraendert als
        // Fallback weiter, siehe STREAMLABS_SETUP.md "Fernsteuerung im
        // Hintergrund (Regie-System)".
        console.error('Pusher-Initialisierung fehlgeschlagen, bleibe bei reinem Polling:', err);
        pusherClient = null;
      }
    }

    async function poll() {
      try {
        const url = apiUrl + '?since=' + encodeURIComponent(String(since)) + '&_=' + Date.now();
        const res = await fetch(url, { cache: 'no-store' });
        const data = await res.json();

        if (!data || !data.success) {
          throw new Error((data && data.message) || 'Regie-API Fehler');
        }

        failures = 0;
        since = Number.isFinite(Number(data.revision)) ? Number(data.revision) : since;

        initPusherIfNeeded(data);

        if (data.changed && data.command) {
          applyCommand(data.command);
        }

        if (stateEl.classList.contains('warn')) {
          setStatus('Live', 'ok');
        }
      } catch (err) {
        failures += 1;
        setStatus('Offline ' + failures, 'warn');
      } finally {
        const backoff = failures > 0 ? Math.min(6000, pollMs + failures * 500) : pollMs;
        timer = setTimeout(poll, backoff);
      }
    }

    setMode(currentMode);
    fitStage();
    poll();

    // Nach einer Zwangspause (z.B. GeForce NOW im Vordergrund, Chromium drosselt
    // setTimeout-Timer in nicht sichtbaren Seiten) sofort pollen statt auf den
    // naechsten regulaeren Tick zu warten - verkuerzt nur die Aufhol-Verzoegerung
    // nach dem Zurueckwechseln zu Streamlabs, loest aber nicht das eigentliche
    // Hintergrund-Problem selbst (siehe STREAMLABS_SETUP.md "Fernsteuerung im
    // Hintergrund (Regie-System)").
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
      poll();
    });

    window.addEventListener('resize', fitStage);
    window.addEventListener('orientationchange', fitStage);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitStage);
    }

    window.addEventListener('beforeunload', function () {
      if (timer) clearTimeout(timer);
      if (pusherClient) {
        try { pusherClient.disconnect(); } catch (err) { /* egal, Seite verschwindet ohnehin */ }
      }
    });
  </script>
</body>
</html>
