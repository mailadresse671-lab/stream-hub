<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start-Szene</title>
  <!-- Eigenstaendige "Starting Soon"-Szene fuer Streamlabs (eigene Browser-
       Quelle, eigene Szene - liegt NICHT wie goal.html/chat.html transparent
       ueber dem Gameplay, sondern ersetzt es kurz vor Stream-Start). Deckend
       schwarzer/radialer Hintergrund ist deshalb bewusst kein Bug, sondern
       Absicht.

       Diese Version ist die Umsetzung eines vom Nutzer in Claude Design
       gebauten Prototyps ("Twitch Start Countdown.dc.html", Komponente
       CountdownPiece aus countdown-piece.jsx) - ersetzt die vorherige,
       selbst entworfene Version von start.html vollstaendig. Jede feste
       px-Position/-Groesse aus dem 1920x1080-Design wurde 1:1 nach
       calc(var(--vu) * N) uebersetzt (siehe --vu-Definition unten) statt
       sie woertlich als px zu uebernehmen - exakt dasselbe Verfahren wie in
       overlay.html, wo feste px-Werte in der echten Streamlabs-Mobile-
       WebView nachweislich zu falscher Groesse/Unschaerfe fuehrten.

       Bewusste Abweichung vom Rest des Projekts: diese Szene nutzt 'Chakra
       Petch' + 'JetBrains Mono' statt der sonst ueberall verwendeten 'Bebas
       Neue' + 'Montserrat' - das war eine explizite Typografie-Entscheidung
       im Original-Design, hier bewusst uebernommen statt uebersteuert.

       animations-v2.jsx und tweaks-panel.jsx (die beiden anderen vom Design
       importierten Dateien) sind NICHT mitportiert - das sind interne
       Engine-/Editor-Werkzeuge von Claude Design selbst (Szenen-Timeline,
       Scrubbing, Video-Export, ein schwebendes Tweaks-Panel), nicht Teil der
       eigentlichen Szene. Die "localTime"-Animationsmathematik aus
       countdown-piece.jsx (reine Math.sin()-Funktionen, kein
       Animationsframework noetig) liess sich 1:1 in eine einzige
       requestAnimationFrame-Schleife unten uebertragen. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blood: #ff1a1a;
      --chrome-1: #f4f4f4;
      --text-muted: #9a9ca3;
      /* Fluide Basis-Einheit statt fixer px/transform:scale() - loest sich
         zu 1px bei 1920px Browser-Quellen-Breite auf, schrumpft aber
         proportional mit einer kleineren TATSAECHLICHEN Breite mit (Boden
         0.5px), bleibt dabei nativ scharf (calc() wird vor dem Rendern
         aufgeloest, kein nachtraegliches Herunterskalieren). Jeder Wert aus
         dem 1920x1080-Design unten ist calc(var(--vu) * <Original-px>). */
      --vu: clamp(0.5px, 0.0521vw, 1px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #050505;
      overflow: hidden;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* ---------- Buehne ---------- */
    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 40%, #14161a 0%, #0a0b0c 55%, #050505 100%);
      font-family: 'Chakra Petch', sans-serif;
    }

    /* Durchlaufender Scan-Sweep (Position wird jeden Frame per JS aus
       localTime gesetzt, siehe Script) statt der dichten VHS-Textur der
       anderen Widgets. */
    #scan-sweep {
      position: absolute;
      left: 0;
      right: 0;
      height: calc(var(--vu) * 2);
      background: linear-gradient(90deg, transparent, rgba(255, 26, 26, 0.12), transparent);
      pointer-events: none;
      z-index: 1;
    }

    /* ---------- HUD-Ecken-Klammern (statisch, wie im Original-Design) ---------- */
    .hud-corner {
      position: absolute;
      width: calc(var(--vu) * 34);
      height: calc(var(--vu) * 34);
      pointer-events: none;
      z-index: 2;
    }
    .hud-corner.tl { top: calc(var(--vu) * 20); left: calc(var(--vu) * 20); border-top: calc(var(--vu) * 2) solid rgba(255, 26, 26, 0.8); border-left: calc(var(--vu) * 2) solid rgba(255, 26, 26, 0.8); }
    .hud-corner.tr { top: calc(var(--vu) * 20); right: calc(var(--vu) * 20); border-top: calc(var(--vu) * 2) solid rgba(255, 26, 26, 0.8); border-right: calc(var(--vu) * 2) solid rgba(255, 26, 26, 0.8); }
    .hud-corner.bl { bottom: calc(var(--vu) * 20); left: calc(var(--vu) * 20); border-bottom: calc(var(--vu) * 2) solid rgba(255, 26, 26, 0.8); border-left: calc(var(--vu) * 2) solid rgba(255, 26, 26, 0.8); }
    .hud-corner.br { bottom: calc(var(--vu) * 20); right: calc(var(--vu) * 20); border-bottom: calc(var(--vu) * 2) solid rgba(255, 26, 26, 0.8); border-right: calc(var(--vu) * 2) solid rgba(255, 26, 26, 0.8); }

    /* ---------- Twitch-Handle, permanent oben sichtbar ---------- */
    .handle-bar {
      position: absolute;
      top: calc(var(--vu) * 40);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: calc(var(--vu) * 10);
      z-index: 3;
    }
    .handle-dot {
      width: calc(var(--vu) * 10);
      height: calc(var(--vu) * 10);
      border-radius: 50%;
      background: var(--blood);
      box-shadow: 0 0 calc(var(--vu) * 12) rgba(255, 26, 26, 0.9);
    }
    .handle-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: calc(var(--vu) * 32);
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--chrome-1);
    }

    /* ---------- Baerenkopf: dominantes Zentralelement ---------- */
    /* Position/Transform (Sway, Glitch, "Eye-Contact-Lock", Atmen) werden
       komplett per JS aus localTime berechnet, siehe animFrame() im Script -
       identische Formeln wie in GlitchBear() aus countdown-piece.jsx. */
    .bear-wrap {
      position: absolute;
      left: 50%;
      top: 46%;
      /* Etwas groesser als zuvor (460 -> 500), seit das linke Hype-Level-HUD
         entfernt wurde und der Baer als alleiniges zentrales Element den
         freigewordenen Platz bekommt. */
      width: calc(var(--vu) * 500);
      /* Echtes Seitenverhaeltnis des freigestellten Bildes (714x804) statt
         eines erzwungenen Quadrats wie im Original-Design (dessen Platzhalter-
         Asset quadratisch war) - object-fit:contain haette bei unserem
         echten, nicht-quadratischen Bild sonst Luft links/rechts gelassen. */
      aspect-ratio: 714 / 804;
      z-index: 3;
    }
    .bear-head, .bear-ghost {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .bear-ghost {
      display: none;
      pointer-events: none;
      mix-blend-mode: screen;
    }
    /* Zwei eingefaerbte "Geister"-Kopien, die nur waehrend eines Glitch-
       Fensters sichtbar werden (per JS) und seitlich auseinanderdriften -
       klassischer Rot/Cyan-Kanaltrennungs-Trick: brightness(0) reduziert das
       Bild auf eine reine Alpha-Silhouette, invert()+sepia()+saturate()
       faerbt sie danach einheitlich ein. */
    .bear-ghost-red { filter: brightness(0) saturate(100%) invert(13%) sepia(89%) saturate(6000%) hue-rotate(-2deg); opacity: 0.55; }
    .bear-ghost-cyan { filter: brightness(0) saturate(100%) invert(80%) sepia(56%) saturate(4000%) hue-rotate(150deg); opacity: 0.35; }

    /* Platzhalter, bis assets/images/bear_head_lowpoly.png hochgeladen ist -
       zeigt absichtlich KEIN kaputtes Bildsymbol, sondern einen klar
       beschrifteten, stilistisch passenden Hinweis. Wird per onerror auf dem
       <img> eingeblendet (siehe Script unten). */
    .bear-placeholder {
      display: none;
      position: absolute;
      inset: 8% 12%;
      border-radius: 50%;
      border: 1px dashed rgba(255, 26, 26, 0.5);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(var(--vu) * 16);
    }
    .bear-placeholder span {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: clamp(10px, 1vw, 14px);
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      line-height: 1.6;
    }
    .bear-placeholder code {
      display: block;
      color: var(--blood);
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(9px, 0.85vw, 12px);
      margin-top: calc(var(--vu) * 4);
    }

    /* ---------- Countdown-Block ---------- */
    .countdown-block {
      position: absolute;
      left: 50%;
      bottom: calc(var(--vu) * 150);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--vu) * 8);
      z-index: 3;
    }
    .countdown-label {
      font-size: calc(var(--vu) * 13);
      font-weight: 600;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.5);
    }
    .countdown-digits {
      display: flex;
      align-items: baseline;
      font-family: 'JetBrains Mono', monospace;
      font-size: calc(var(--vu) * 88);
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.04em;
      line-height: 1;
      /* text-shadow ("pulse") wird per JS gesetzt */
    }
    .countdown-digits .colon { animation: blink 1s steps(1) infinite; }
    .countdown-digits.is-live { color: var(--blood); }
    .status-ticker {
      font-family: 'JetBrains Mono', monospace;
      font-size: calc(var(--vu) * 13);
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.55);
      white-space: nowrap;
      /* opacity (Crossfade zwischen Meldungen) wird per JS gesetzt */
    }

    /* ---------- Soundtrack-Leiste mit Audio-Visualizer ---------- */
    .soundtrack-bar {
      position: absolute;
      bottom: calc(var(--vu) * 32);
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--vu) * 460);
      max-width: 90vw;
      display: flex;
      align-items: center;
      gap: calc(var(--vu) * 16);
      padding: calc(var(--vu) * 10) calc(var(--vu) * 18);
      background: rgba(6, 6, 7, 0.62);
      backdrop-filter: blur(calc(var(--vu) * 10));
      -webkit-backdrop-filter: blur(calc(var(--vu) * 10));
      border-top: calc(var(--vu) * 1.5) solid rgba(255, 20, 20, 0.9);
      z-index: 3;
    }
    .soundtrack-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--vu) * 3); }
    .soundtrack-title {
      font-size: calc(var(--vu) * 12);
      font-weight: 600;
      color: var(--chrome-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .soundtrack-artist {
      font-family: 'JetBrains Mono', monospace;
      font-size: calc(var(--vu) * 10);
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.4);
    }
    /* Rein dekorativ/prozedural (Sinus-Wellen aus localTime) statt echt
       audio-reaktiv - fuer diese Start-Szene gibt es keine echte Audioquelle
       zum Analysieren (kein Mikro, kein Player), anders als der
       AudioAnalysisRig in goal.html. */
    .visualizer { display: flex; align-items: flex-end; gap: calc(var(--vu) * 4); height: calc(var(--vu) * 32); flex-shrink: 0; }
    .viz-bar {
      width: calc(var(--vu) * 3);
      background: var(--blood);
      box-shadow: 0 0 calc(var(--vu) * 5) rgba(255, 26, 26, 0.8);
      border-radius: calc(var(--vu) * 1);
      /* height wird per JS gesetzt */
    }
  </style>
</head>
<body>

  <div id="stage">
    <div id="scan-sweep"></div>
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>

    <div class="handle-bar">
      <span class="handle-dot"></span>
      <span class="handle-name">DaNgsxr1000</span>
    </div>

    <div class="bear-wrap" id="bearWrap">
      <img class="bear-ghost bear-ghost-red" id="ghostRed" src="assets/images/bear_head_lowpoly.png" alt="">
      <img class="bear-ghost bear-ghost-cyan" id="ghostCyan" src="assets/images/bear_head_lowpoly.png" alt="">
      <img
        id="bearHead"
        class="bear-head"
        src="assets/images/bear_head_lowpoly.png"
        alt="DaN Low-Poly Baer"
        onerror="this.style.display='none'; document.getElementById('bearPlaceholder').style.display='flex';"
      >
      <div class="bear-placeholder" id="bearPlaceholder">
        <span>BAER-BILD FEHLT NOCH<code>assets/images/bear_head_lowpoly.png</code></span>
      </div>
    </div>

    <div class="countdown-block">
      <span class="countdown-label" id="countdownLabel">STREAM STARTS IN</span>
      <span class="countdown-digits" id="countdown">
        <span id="cdMin">05</span><span class="colon">:</span><span id="cdSec">00</span>
      </span>
      <span class="status-ticker" id="statusTicker"></span>
    </div>

    <div class="soundtrack-bar">
      <div class="soundtrack-info">
        <span class="soundtrack-title" id="soundtrackTitle">MIDNIGHT PROTOCOL</span>
        <span class="soundtrack-artist" id="soundtrackArtist">BLACKOUT SYNDICATE</span>
      </div>
      <div class="visualizer" id="visualizer">
        <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
        <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
        <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Konfigurierbar per URL-Parameter, gleiches Prinzip wie ?channel=/
    // ?track= in chat.html/goal.html - ohne Parameter laeuft alles mit
    // sinnvollen Defaults (5 Minuten = 300s, identisch zur "dur":300 im
    // Original-Design).
    const params = new URLSearchParams(location.search);
    const durationMinutes = parseFloat(params.get('minutes')) || 5;
    const labelOverride = params.get('status');
    if (labelOverride) {
      document.getElementById('countdownLabel').textContent = labelOverride;
    }
    const trackParam = params.get('track');
    if (trackParam) document.getElementById('soundtrackTitle').textContent = trackParam;
    const artistParam = params.get('artist');
    if (artistParam) document.getElementById('soundtrackArtist').textContent = artistParam;

    const totalMs = durationMinutes * 60 * 1000;
    const endAt = performance.now() + totalMs;
    const pageStart = performance.now();

    function pad2(n) { return String(Math.floor(n)).padStart(2, '0'); }

    const STATUS_MESSAGES = [
      'INITIALIZING FEED...',
      'SYNCING CHAT UPLINK...',
      'CALIBRATING VISUAL FEED...',
      'PRIMING GLITCH MATRIX...',
      'ARMING SOUNDTRACK MODULE...',
      'STANDBY FOR BROADCAST...',
    ];

    const scanSweepEl = document.getElementById('scan-sweep');
    const bearWrap = document.getElementById('bearWrap');
    const bearHead = document.getElementById('bearHead');
    const ghostRed = document.getElementById('ghostRed');
    const ghostCyan = document.getElementById('ghostCyan');
    const vizBars = document.querySelectorAll('.viz-bar');
    const statusTickerEl = document.getElementById('statusTicker');
    const cdMin = document.getElementById('cdMin');
    const cdSec = document.getElementById('cdSec');
    const countdownEl = document.getElementById('countdown');
    const countdownLabelEl = document.getElementById('countdownLabel');

    let lastRenderedSecond = -1;
    let lastTickerIdx = -1;
    let wentLive = false;

    // Eine einzige requestAnimationFrame-Schleife treibt ALLES (Baer,
    // Scanline, Visualizer, Sterne-Twinkle, HUD-Atmen, Countdown-Puls) aus
    // einem gemeinsamen "localTime" - identisches Prinzip zum Original-
    // Design, wo jede Komponente denselben Szenen-Takt aus useScene() liest,
    // statt eigener, potenziell asynchron laufender CSS-Animationen/Timer.
    function animFrame(nowMs) {
      const localTime = (nowMs - pageStart) / 1000;

      // ---- Scanline: durchlaufend von oben nach unten ----
      const scanY = (localTime * 40) % 1080;
      scanSweepEl.style.top = 'calc(var(--vu) * ' + scanY.toFixed(2) + ')';

      // ---- Baer: Glitch-Zyklus (alle 7s, ~180ms) ----
      const cyclePos = localTime % 7;
      const glitching = cyclePos < 0.18;
      const gT = glitching ? cyclePos / 0.18 : 0;
      const jitter = glitching ? Math.sin(localTime * 220) * 6 * (1 - gT) : 0;

      // ---- Baer: ambientes Augen-Gluehen (kontinuierlich) ----
      const glow = 0.55 + 0.45 * Math.sin(localTime * 1.6);
      const glowSize = 26 + glow * 30;
      const glowAlpha = 0.35 + glow * 0.45;

      // ---- Baer: periodischer "Blickkontakt"-Moment (alle 8s, 1.4s lang) ----
      const lockCycle = localTime % 8;
      const isLocking = lockCycle < 1.4;
      const lockT = isLocking
        ? (lockCycle < 0.4 ? lockCycle / 0.4 : (lockCycle < 1.0 ? 1 : (1.4 - lockCycle) / 0.4))
        : 0;
      const lockGlowSize = glowSize + lockT * 55;
      const lockGlowAlpha = Math.min(1, glowAlpha + lockT * 0.6);
      const breathe = 1 + Math.sin(localTime * 0.5) * 0.015;

      // ---- Baer: Idle-Schaukeln + gelegentlicher Seitenblick ----
      const swayXBase = Math.sin(localTime * 0.35) * 10;
      const swayYBase = Math.sin(localTime * 0.5 + 1.2) * 6;
      const rotBase = Math.sin(localTime * 0.35) * 2.2;
      const swayX = isLocking ? swayXBase * (1 - lockT) : swayXBase;
      const swayY = isLocking ? swayYBase * (1 - lockT) : swayYBase;
      const rot = isLocking ? rotBase * (1 - lockT) : rotBase;
      const lookCycle = localTime % 9;
      const look = lookCycle > 6 ? Math.sin((lookCycle - 6) / 3 * Math.PI) * 8 : 0;
      const lockScale = 1 + lockT * 0.18;

      bearWrap.style.transform =
        'translate(calc(-50% + var(--vu) * ' + (swayX + look).toFixed(2) + '), ' +
        'calc(-50% + var(--vu) * ' + swayY.toFixed(2) + ')) ' +
        'scale(' + (breathe * lockScale).toFixed(4) + ') rotate(' + rot.toFixed(2) + 'deg)';

      if (glitching) {
        ghostRed.style.display = 'block';
        ghostRed.style.transform = 'translate(calc(var(--vu) * ' + jitter.toFixed(2) + '), 0)';
        ghostCyan.style.display = 'block';
        ghostCyan.style.transform = 'translate(calc(var(--vu) * ' + (-jitter).toFixed(2) + '), 0)';
        bearHead.style.transform = 'translate(calc(var(--vu) * ' + (jitter * 0.4).toFixed(2) + '), 0)';
      } else {
        ghostRed.style.display = 'none';
        ghostCyan.style.display = 'none';
        bearHead.style.transform = 'none';
      }
      bearHead.style.filter =
        'drop-shadow(0 0 calc(var(--vu) * ' + lockGlowSize.toFixed(1) + ') rgba(255,20,20,' + lockGlowAlpha.toFixed(3) + ')) ' +
        'drop-shadow(0 0 calc(var(--vu) * ' + (lockGlowSize * 0.4).toFixed(1) + ') rgba(255,20,20,' + (lockGlowAlpha * 0.6).toFixed(3) + '))';

      // ---- Audio-Visualizer: 9 Balken, je eigene Phase/Geschwindigkeit ----
      vizBars.forEach((bar, i) => {
        const phase = i * 0.7;
        const speed = 3.1 + (i % 3) * 0.6;
        const amp = 0.5 + 0.5 * Math.sin(localTime * speed + phase);
        const h = 6 + amp * 26;
        bar.style.height = 'calc(var(--vu) * ' + h.toFixed(2) + ')';
      });

      // ---- Status-Ticker: 10s-Takt, letzte/erste 0.6s ueberblenden ----
      const bucket = 10;
      const tIdx = Math.floor(localTime / bucket) % STATUS_MESSAGES.length;
      const tLocal = localTime % bucket;
      const fade = tLocal < 0.6 ? tLocal / 0.6 : (tLocal > bucket - 0.6 ? (bucket - tLocal) / 0.6 : 1);
      if (tIdx !== lastTickerIdx) {
        lastTickerIdx = tIdx;
        statusTickerEl.textContent = STATUS_MESSAGES[tIdx];
      }
      statusTickerEl.style.opacity = fade;

      // ---- Countdown: Puls-Glow + tatsaechliche verbleibende Zeit ----
      const pulse = 0.7 + 0.3 * Math.sin(localTime * 1.6);
      countdownEl.style.textShadow = '0 0 calc(var(--vu) * ' + (18 + pulse * 22).toFixed(1) + ') rgba(255,26,26,' + (0.55 + pulse * 0.3).toFixed(3) + ')';

      const remainingMs = Math.max(0, endAt - nowMs);
      const remainingSeconds = Math.ceil(remainingMs / 1000);
      if (remainingSeconds !== lastRenderedSecond) {
        lastRenderedSecond = remainingSeconds;
        cdMin.textContent = pad2(remainingSeconds / 60);
        cdSec.textContent = pad2(remainingSeconds % 60);
      }
      if (remainingMs <= 0 && !wentLive) {
        wentLive = true;
        countdownEl.classList.add('is-live');
        // Bleibt bewusst NICHT bei "00:00"/"STREAM STARTS IN" haengen (wirkt
        // kaputt, falls die Szene nach Ablauf noch kurz sichtbar ist, bevor
        // manuell auf die Gameplay-Szene umgeschaltet wird) - kein
        // Gegenstueck im Original-Design (das dort als Endlosschleife fuer
        // die Vorschau im Design-Tool laeuft), aber fuer den echten
        // Stream-Einsatz noetig.
        countdownLabelEl.textContent = 'ON AIR';
      }

      requestAnimationFrame(animFrame);
    }
    requestAnimationFrame(animFrame);
  </script>

</body>
</html>
