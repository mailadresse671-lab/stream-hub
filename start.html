<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start-Szene</title>
  <!-- Eigenstaendige "Starting Soon"-Szene fuer Streamlabs (eigene Browser-
       Quelle, eigene Szene - liegt NICHT wie goal.html/chat.html transparent
       ueber dem Gameplay, sondern ersetzt es kurz vor Stream-Start). Deckend
       schwarzer Hintergrund ist deshalb bewusst kein Bug, sondern Absicht.
       "Urban Blackout"-Look wie der Rest des Projekts, aber bewusst OHNE die
       VHS-Scanline/CRT-Textur aus goal.html/chat.html/overlay.html - der
       Nutzer wollte hier explizit "clean, keine alten Retro-Elemente".
       Bärenkopf-Bild: assets/images/bear_head_lowpoly.png - Datei muss noch
       manuell hochgeladen werden (siehe CLAUDE.md), bis dahin greift ein
       eingebauter Platzhalter (kein kaputtes Bildsymbol). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Gleiche Token-Basis wie goal.html/chat.html/overlay.html - siehe
         CLAUDE.md Styling-Guide "Urban Blackout" fuer die volle Doku. Diese
         Szene nutzt bewusst fast nur die rote Akzentfarbe (kein Gold) -
         passend zum reinen Schwarz/Rot-Look des gelieferten Baerenkopfs. */
      --asphalt: #08090a;
      --chrome-1: #eef0f2;
      --chrome-2: #8b8d93;
      --blood: #ff1a1a;
      --blood-glow: rgba(255, 26, 26, 0.65);
      --text-muted: #9a9ca3;
      /* Fluide Basis-Einheit statt fixer px/transform:scale() - siehe
         overlay.html-Kommentar fuer die volle Begruendung: loest sich zu 1px
         bei 1920px Browser-Quellen-Breite auf, schrumpft aber proportional
         mit einer kleineren TATSAECHLICHEN Breite mit (Boden 0.5px), bleibt
         dabei nativ scharf (calc() wird vor dem Rendern aufgeloest). */
      --vu: clamp(0.5px, 0.0521vw, 1px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--asphalt);
      overflow: hidden;
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* ---------- Buehne ---------- */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 55% 48% at 50% 58%, rgba(255, 26, 26, 0.16), transparent 70%),
        radial-gradient(ellipse 90% 60% at 50% 105%, rgba(255, 26, 26, 0.06), transparent 60%),
        var(--asphalt);
    }

    /* Sehr dezenter, langsamer Scan-Sweep - bewusst NICHT die dichte VHS-
       Scanline-Textur aus den anderen Widgets, sondern eine einzelne, kaum
       sichtbare Linie fuer etwas Umgebungsbewegung ohne "Retro"-Look. */
    #scan-sweep {
      position: fixed;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 26, 26, 0.35), transparent);
      animation: scanSweep 7s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes scanSweep {
      0% { top: 8%; opacity: 0; }
      10% { opacity: 0.8; }
      50% { top: 92%; opacity: 0.8; }
      60% { opacity: 0; }
      100% { top: 92%; opacity: 0; }
    }

    /* ---------- HUD-Ecken-Klammern statt geschlossenem Kasten ---------- */
    .hud-corner {
      position: fixed;
      width: clamp(26px, 3.2vw, 60px);
      height: clamp(26px, 3.2vw, 60px);
      border: 0 solid var(--blood);
      filter: drop-shadow(0 0 calc(var(--vu) * 4) var(--blood-glow));
      opacity: 0.8;
      animation: cornerPulse 5s ease-in-out infinite;
      pointer-events: none;
      z-index: 2;
    }
    .hud-corner.tl { top: 3.2vh; left: 2vw; border-top-width: 1px; border-left-width: 1px; }
    .hud-corner.tr { top: 3.2vh; right: 2vw; border-top-width: 1px; border-right-width: 1px; }
    .hud-corner.bl { bottom: 3.2vh; left: 2vw; border-bottom-width: 1px; border-left-width: 1px; }
    .hud-corner.br { bottom: 3.2vh; right: 2vw; border-bottom-width: 1px; border-right-width: 1px; }
    @keyframes cornerPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.95; }
    }

    /* ---------- Baerenkopf: dominantes Zentralelement ---------- */
    .bear-wrap {
      position: relative;
      width: clamp(200px, 26vw, 560px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }
    .bear-head {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* Folgt der echten Alpha-Silhouette des Bildes statt eines simplen
         Kreis-Glows dahinter - zwei gestapelte drop-shadows fuer einen
         weicheren, tieferen Rotschimmer. */
      filter:
        drop-shadow(0 0 calc(var(--vu) * 22) var(--blood-glow))
        drop-shadow(0 0 calc(var(--vu) * 55) rgba(255, 26, 26, 0.28));
      animation: bearBreathe 4.6s ease-in-out infinite;
    }
    @keyframes bearBreathe {
      0%, 100% {
        transform: scale(1);
        filter:
          drop-shadow(0 0 calc(var(--vu) * 22) var(--blood-glow))
          drop-shadow(0 0 calc(var(--vu) * 55) rgba(255, 26, 26, 0.28));
      }
      50% {
        transform: scale(1.018);
        filter:
          drop-shadow(0 0 calc(var(--vu) * 30) var(--blood-glow))
          drop-shadow(0 0 calc(var(--vu) * 75) rgba(255, 26, 26, 0.4));
      }
    }

    /* Platzhalter, bis assets/images/bear_head_lowpoly.png hochgeladen ist -
       zeigt absichtlich KEIN kaputtes Bildsymbol, sondern einen klar
       beschrifteten, stilistisch passenden Hinweis. Wird per onerror auf dem
       <img> eingeblendet (siehe Script unten). */
    .bear-placeholder {
      display: none;
      width: 78%;
      height: 78%;
      border-radius: 50%;
      border: 1px dashed rgba(255, 26, 26, 0.5);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(var(--vu) * 16);
      animation: bearBreathe 4.6s ease-in-out infinite;
    }
    .bear-placeholder span {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: clamp(10px, 1vw, 14px);
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      line-height: 1.6;
    }
    .bear-placeholder code {
      display: block;
      color: var(--blood);
      font-family: 'Montserrat', monospace;
      font-size: clamp(9px, 0.85vw, 12px);
      margin-top: calc(var(--vu) * 4);
    }

    /* ---------- Text-/Countdown-Stapel ---------- */
    .info-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: clamp(14px, 2.4vh, 34px);
      z-index: 3;
    }

    .eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: clamp(11px, 1.05vw, 16px);
      letter-spacing: 3px;
      color: var(--blood);
      text-transform: uppercase;
      opacity: 0.85;
    }
    .eyebrow::after {
      content: '_';
      animation: blink 1s steps(1) infinite;
    }

    .headline {
      font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
      font-weight: 400;
      font-size: clamp(30px, 4.4vw, 76px);
      letter-spacing: 2px;
      color: var(--chrome-1);
      text-transform: uppercase;
      text-align: center;
      max-width: 90vw;
      text-wrap: balance;
      text-shadow: 0 0 calc(var(--vu) * 26) var(--blood-glow), 2px 2px 0 rgba(0, 0, 0, 0.85);
      margin-top: clamp(4px, 0.8vh, 10px);
    }

    .countdown {
      display: flex;
      align-items: baseline;
      gap: calc(var(--vu) * 2);
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      font-size: clamp(42px, 6.6vw, 122px);
      color: var(--chrome-1);
      text-shadow: 0 0 calc(var(--vu) * 30) var(--blood-glow), 2px 2px 0 rgba(0, 0, 0, 0.85);
      margin-top: clamp(8px, 1.6vh, 20px);
      line-height: 1;
    }
    .countdown .colon { animation: blink 1s steps(1) infinite; color: var(--blood); }
    .countdown.is-live { color: var(--blood); }

    .progress-track {
      width: min(46vw, 460px);
      max-width: 90vw;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin-top: clamp(14px, 2.2vh, 28px);
      position: relative;
      z-index: 3;
    }
    .progress-fill {
      height: 100%;
      width: 100%;
      background: var(--blood);
      box-shadow: 0 0 calc(var(--vu) * 6) 1px var(--blood-glow);
      transform-origin: left center;
    }

    /* ---------- Branding-Wasserzeichen ---------- */
    .watermark {
      position: fixed;
      bottom: 2.4vh;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
      font-size: clamp(11px, 1vw, 15px);
      letter-spacing: 3px;
      color: var(--chrome-2);
      opacity: 0.45;
      z-index: 3;
    }
  </style>
</head>
<body>

  <div id="stage">
    <div id="scan-sweep"></div>
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>

    <div class="bear-wrap">
      <img
        id="bearHead"
        class="bear-head"
        src="assets/images/bear_head_lowpoly.png"
        alt="DaN Low-Poly Baer"
        onerror="this.style.display='none'; document.getElementById('bearPlaceholder').style.display='flex';"
      >
      <div class="bear-placeholder" id="bearPlaceholder">
        <span>BAER-BILD FEHLT NOCH<code>assets/images/bear_head_lowpoly.png</code></span>
      </div>
    </div>

    <div class="info-stack">
      <div class="eyebrow">SYSTEM INITIALIZING</div>
      <div class="headline" id="headlineText">GLEICH GEHT ES LOS</div>
      <div class="countdown" id="countdown">
        <span id="cdMin">05</span><span class="colon">:</span><span id="cdSec">00</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="watermark">DANGSXR1000</div>
  </div>

  <script>
    // Konfigurierbar per URL-Parameter, gleiches Prinzip wie ?channel=/
    // ?track= in chat.html/goal.html - ohne Parameter laeuft alles mit
    // sinnvollen Defaults (5 Minuten, deutscher Standard-Text).
    const params = new URLSearchParams(location.search);
    const durationMinutes = parseFloat(params.get('minutes')) || 5;
    const statusText = params.get('status');
    if (statusText) {
      document.getElementById('headlineText').innerText = statusText;
    }

    const totalMs = durationMinutes * 60 * 1000;
    const endAt = performance.now() + totalMs;

    const cdMin = document.getElementById('cdMin');
    const cdSec = document.getElementById('cdSec');
    const countdownEl = document.getElementById('countdown');
    const progressFill = document.getElementById('progressFill');
    const headlineEl = document.getElementById('headlineText');

    let lastRenderedSecond = -1;
    let wentLive = false;

    // rAF statt setInterval: die Fortschritts-Linie laeuft dadurch bei jedem
    // Frame (60fps) sichtbar fluessig leer, waehrend die MM:SS-Ziffern nur
    // beim tatsaechlichen Sekundenwechsel aktualisiert werden (kein
    // unnoetiges DOM-Geflacker, bleibt gestochen scharf statt weich
    // ueberzublenden).
    function tick(now) {
      const remainingMs = Math.max(0, endAt - now);
      const remainingSeconds = Math.ceil(remainingMs / 1000);

      if (remainingSeconds !== lastRenderedSecond) {
        lastRenderedSecond = remainingSeconds;
        const mm = Math.floor(remainingSeconds / 60);
        const ss = remainingSeconds % 60;
        cdMin.textContent = String(mm).padStart(2, '0');
        cdSec.textContent = String(ss).padStart(2, '0');
      }

      progressFill.style.width = (remainingMs / totalMs * 100).toFixed(3) + '%';

      if (remainingMs <= 0 && !wentLive) {
        wentLive = true;
        countdownEl.classList.add('is-live');
        // Bleibt bewusst NICHT bei "00:00" stehen (wirkt kaputt, falls die
        // Szene nach Ablauf noch kurz sichtbar ist, bevor manuell auf die
        // Gameplay-Szene umgeschaltet wird), sondern faellt auf einen
        // ruhigen "LIVE"-Zustand zurueck - kein harter Modus-Wechsel im JS
        // noetig, die Fortschritts-Linie bleibt einfach leer stehen.
        headlineEl.textContent = 'ON AIR';
      }

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>

</body>
</html>
