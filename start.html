<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start-Szene</title>
  <!-- Eigenstaendige "Starting Soon"-Szene fuer Streamlabs (eigene Browser-
       Quelle, eigene Szene - liegt NICHT wie goal.html/chat.html transparent
       ueber dem Gameplay, sondern ersetzt es kurz vor Stream-Start). Deckend
       schwarzer Hintergrund ist deshalb bewusst kein Bug, sondern Absicht.
       "Urban Blackout"-Look wie der Rest des Projekts, aber bewusst OHNE die
       VHS-Scanline/CRT-Textur aus goal.html/chat.html/overlay.html - der
       Nutzer wollte hier explizit "clean, keine alten Retro-Elemente".
       Bärenkopf-Bild: assets/images/bear_head_lowpoly.png - Datei muss noch
       manuell hochgeladen werden (siehe CLAUDE.md), bis dahin greift ein
       eingebauter Platzhalter (kein kaputtes Bildsymbol). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Gleiche Token-Basis wie goal.html/chat.html/overlay.html - siehe
         CLAUDE.md Styling-Guide "Urban Blackout" fuer die volle Doku. Diese
         Szene nutzt bewusst fast nur die rote Akzentfarbe (kein Gold) -
         passend zum reinen Schwarz/Rot-Look des gelieferten Baerenkopfs. */
      --asphalt: #08090a;
      --chrome-1: #eef0f2;
      --chrome-2: #8b8d93;
      --blood: #ff1a1a;
      --blood-glow: rgba(255, 26, 26, 0.65);
      --text-muted: #9a9ca3;
      /* Fluide Basis-Einheit statt fixer px/transform:scale() - siehe
         overlay.html-Kommentar fuer die volle Begruendung: loest sich zu 1px
         bei 1920px Browser-Quellen-Breite auf, schrumpft aber proportional
         mit einer kleineren TATSAECHLICHEN Breite mit (Boden 0.5px), bleibt
         dabei nativ scharf (calc() wird vor dem Rendern aufgeloest). */
      --vu: clamp(0.5px, 0.0521vw, 1px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--asphalt);
      overflow: hidden;
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* ---------- Buehne ---------- */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 55% 48% at 50% 58%, rgba(255, 26, 26, 0.16), transparent 70%),
        radial-gradient(ellipse 90% 60% at 50% 105%, rgba(255, 26, 26, 0.06), transparent 60%),
        var(--asphalt);
    }

    /* Sehr dezenter, langsamer Scan-Sweep - bewusst NICHT die dichte VHS-
       Scanline-Textur aus den anderen Widgets, sondern eine einzelne, kaum
       sichtbare Linie fuer etwas Umgebungsbewegung ohne "Retro"-Look. */
    #scan-sweep {
      position: fixed;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 26, 26, 0.35), transparent);
      animation: scanSweep 7s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes scanSweep {
      0% { top: 8%; opacity: 0; }
      10% { opacity: 0.8; }
      50% { top: 92%; opacity: 0.8; }
      60% { opacity: 0; }
      100% { top: 92%; opacity: 0; }
    }

    /* ---------- HUD-Ecken-Klammern statt geschlossenem Kasten ---------- */
    .hud-corner {
      position: fixed;
      width: clamp(26px, 3.2vw, 60px);
      height: clamp(26px, 3.2vw, 60px);
      border: 0 solid var(--blood);
      filter: drop-shadow(0 0 calc(var(--vu) * 4) var(--blood-glow));
      opacity: 0.8;
      animation: cornerPulse 5s ease-in-out infinite;
      pointer-events: none;
      z-index: 2;
    }
    .hud-corner.tl { top: 3.2vh; left: 2vw; border-top-width: 1px; border-left-width: 1px; }
    .hud-corner.tr { top: 3.2vh; right: 2vw; border-top-width: 1px; border-right-width: 1px; }
    .hud-corner.bl { bottom: 3.2vh; left: 2vw; border-bottom-width: 1px; border-left-width: 1px; }
    .hud-corner.br { bottom: 3.2vh; right: 2vw; border-bottom-width: 1px; border-right-width: 1px; }
    @keyframes cornerPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.95; }
    }

    /* ---------- Baerenkopf: dominantes Zentralelement ---------- */
    .bear-wrap {
      position: relative;
      width: clamp(200px, 26vw, 560px);
      /* Echtes Seitenverhaeltnis des freigestellten Bildes (714x804) statt
         eines erzwungenen Quadrats - object-fit:contain wuerde sonst links/
         rechts Luft lassen und die Prozent-Positionierung des Augen-Glows
         unten aus dem Ruder laufen lassen. */
      aspect-ratio: 714 / 804;
      z-index: 3;
    }
    .bear-head {
      display: block;
      width: 100%;
      height: 100%;
      /* Folgt der echten Alpha-Silhouette des Bildes statt eines simplen
         Kreis-Glows dahinter - zwei gestapelte drop-shadows fuer einen
         weicheren, tieferen Rotschimmer. */
      filter:
        drop-shadow(0 0 calc(var(--vu) * 22) var(--blood-glow))
        drop-shadow(0 0 calc(var(--vu) * 55) rgba(255, 26, 26, 0.28));
      animation: bearBreathe 4.6s ease-in-out infinite;
    }
    @keyframes bearBreathe {
      0%, 100% {
        transform: scale(1);
        filter:
          drop-shadow(0 0 calc(var(--vu) * 22) var(--blood-glow))
          drop-shadow(0 0 calc(var(--vu) * 55) rgba(255, 26, 26, 0.28));
      }
      50% {
        transform: scale(1.018);
        filter:
          drop-shadow(0 0 calc(var(--vu) * 30) var(--blood-glow))
          drop-shadow(0 0 calc(var(--vu) * 75) rgba(255, 26, 26, 0.4));
      }
    }

    /* Eigener, schnellerer Glueh-Puls NUR ueber der Augen-Region (per
       Bildanalyse lokalisiert: ~66%/26% der Bildflaeche) - laeuft
       unabhaengig vom langsamen Gesamt-Atmen, damit die Augen wirken, als
       wuerden sie eigenstaendig aufflackern statt nur der ganze Kopf zu
       pulsieren. mix-blend-mode:screen addiert nur Licht, statt eine Flaeche
       zu ueberdecken. */
    .eye-glow {
      position: absolute;
      left: 66%;
      top: 26%;
      width: 46%;
      height: 26%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(255, 40, 40, 0.95), rgba(255, 20, 20, 0.35) 55%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      animation: eyeFlicker 2.3s ease-in-out infinite;
    }
    @keyframes eyeFlicker {
      0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
      45% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
      55% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      65% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.03); }
      75% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      85% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
    }

    /* Dezenter Glitch-Ausreisser, per JS in unregelmaessigen Abstaenden kurz
       (~180ms) auf .bear-wrap gezuendet (siehe triggerGlitch() im Script) -
       simuliert einen kurzen Signal-Aussetzer statt eines Dauereffekts. */
    .bear-wrap.is-glitching .bear-head {
      animation: none;
      filter:
        drop-shadow(2px 0 0 rgba(255, 26, 26, 0.85))
        drop-shadow(-2px 0 0 rgba(120, 200, 255, 0.55))
        drop-shadow(0 0 calc(var(--vu) * 30) var(--blood-glow));
    }
    .bear-wrap.is-glitching { animation: glitchJitter 0.18s steps(2, jump-none); }
    @keyframes glitchJitter {
      0% { clip-path: inset(0 0 0 0); transform: translateX(0); }
      25% { clip-path: inset(8% 0 62% 0); transform: translateX(-6px); }
      50% { clip-path: inset(48% 0 12% 0); transform: translateX(5px); }
      75% { clip-path: inset(20% 0 40% 0); transform: translateX(-3px); }
      100% { clip-path: inset(0 0 0 0); transform: translateX(0); }
    }

    /* Platzhalter, bis assets/images/bear_head_lowpoly.png hochgeladen ist -
       zeigt absichtlich KEIN kaputtes Bildsymbol, sondern einen klar
       beschrifteten, stilistisch passenden Hinweis. Wird per onerror auf dem
       <img> eingeblendet (siehe Script unten). Eigenes, quadratisches
       Seitenverhaeltnis statt des Bild-Verhaeltnisses, da hier kein Bild
       vorliegt, an das sich die Form anpassen koennte. */
    .bear-placeholder {
      display: none;
      position: absolute;
      inset: 8% 12%;
      border-radius: 50%;
      border: 1px dashed rgba(255, 26, 26, 0.5);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(var(--vu) * 16);
      animation: bearBreathe 4.6s ease-in-out infinite;
    }
    .bear-placeholder span {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: clamp(10px, 1vw, 14px);
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      line-height: 1.6;
    }
    .bear-placeholder code {
      display: block;
      color: var(--blood);
      font-family: 'Montserrat', monospace;
      font-size: clamp(9px, 0.85vw, 12px);
      margin-top: calc(var(--vu) * 4);
    }

    /* ---------- Text-/Countdown-Stapel ---------- */
    .info-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: clamp(14px, 2.4vh, 34px);
      z-index: 3;
    }

    .eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: clamp(11px, 1.05vw, 16px);
      letter-spacing: 3px;
      color: var(--blood);
      text-transform: uppercase;
      opacity: 0.85;
      /* Text wird per JS alle paar Sekunden ausgetauscht (rotierende Status-
         Meldungen, siehe cycleEyebrow() im Script) - weiche Ein-/Ausblendung
         statt hartem Text-Sprung. */
      transition: opacity 0.35s ease;
    }
    .eyebrow.is-swapping { opacity: 0; }
    .eyebrow::after {
      content: '_';
      animation: blink 1s steps(1) infinite;
    }

    /* ---------- Simulierter Audio-Visualizer ----------
       Rein dekorativ/prozedural (Noise-gesteuert) statt echt audio-reaktiv -
       fuer diese Start-Szene gibt es keine echte Audioquelle zum Analysieren
       (kein Mikro, kein Player), anders als der AudioAnalysisRig in
       goal.html. Sorgt trotzdem fuer durchgehende Bewegung waehrend der
       5-Minuten-Wartezeit. */
    #visualizer {
      position: fixed;
      left: 50%;
      bottom: 7.4vh;
      transform: translateX(-50%);
      width: min(64vw, 720px);
      height: clamp(22px, 3.4vh, 42px);
      z-index: 2;
      opacity: 0.55;
      pointer-events: none;
    }

    .headline {
      font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
      font-weight: 400;
      font-size: clamp(30px, 4.4vw, 76px);
      letter-spacing: 2px;
      color: var(--chrome-1);
      text-transform: uppercase;
      text-align: center;
      max-width: 90vw;
      text-wrap: balance;
      text-shadow: 0 0 calc(var(--vu) * 26) var(--blood-glow), 2px 2px 0 rgba(0, 0, 0, 0.85);
      margin-top: clamp(4px, 0.8vh, 10px);
    }

    .countdown {
      display: flex;
      align-items: baseline;
      gap: calc(var(--vu) * 2);
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      font-size: clamp(42px, 6.6vw, 122px);
      color: var(--chrome-1);
      text-shadow: 0 0 calc(var(--vu) * 30) var(--blood-glow), 2px 2px 0 rgba(0, 0, 0, 0.85);
      margin-top: clamp(8px, 1.6vh, 20px);
      line-height: 1;
    }
    .countdown .colon { animation: blink 1s steps(1) infinite; color: var(--blood); }
    .countdown.is-live { color: var(--blood); }

    .progress-track {
      width: min(46vw, 460px);
      max-width: 90vw;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin-top: clamp(14px, 2.2vh, 28px);
      position: relative;
      z-index: 3;
    }
    .progress-fill {
      height: 100%;
      width: 100%;
      background: var(--blood);
      box-shadow: 0 0 calc(var(--vu) * 6) 1px var(--blood-glow);
      transform-origin: left center;
    }

    /* ---------- Branding-Wasserzeichen ---------- */
    .watermark {
      position: fixed;
      bottom: 2.4vh;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
      font-size: clamp(11px, 1vw, 15px);
      letter-spacing: 3px;
      color: var(--chrome-2);
      opacity: 0.45;
      z-index: 3;
    }
  </style>
</head>
<body>

  <div id="stage">
    <div id="scan-sweep"></div>
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>

    <div class="bear-wrap" id="bearWrap">
      <img
        id="bearHead"
        class="bear-head"
        src="assets/images/bear_head_lowpoly.png"
        alt="DaN Low-Poly Baer"
        onerror="this.style.display='none'; document.getElementById('bearPlaceholder').style.display='flex';"
      >
      <div class="eye-glow"></div>
      <div class="bear-placeholder" id="bearPlaceholder">
        <span>BAER-BILD FEHLT NOCH<code>assets/images/bear_head_lowpoly.png</code></span>
      </div>
    </div>

    <div class="info-stack">
      <div class="eyebrow" id="eyebrowText">SYSTEM INITIALIZING</div>
      <div class="headline" id="headlineText">GLEICH GEHT ES LOS</div>
      <div class="countdown" id="countdown">
        <span id="cdMin">05</span><span class="colon">:</span><span id="cdSec">00</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <canvas id="visualizer"></canvas>
    <div class="watermark">DANGSXR1000</div>
  </div>

  <script>
    // Konfigurierbar per URL-Parameter, gleiches Prinzip wie ?channel=/
    // ?track= in chat.html/goal.html - ohne Parameter laeuft alles mit
    // sinnvollen Defaults (5 Minuten, deutscher Standard-Text).
    const params = new URLSearchParams(location.search);
    const durationMinutes = parseFloat(params.get('minutes')) || 5;
    const statusText = params.get('status');
    if (statusText) {
      document.getElementById('headlineText').innerText = statusText;
    }

    const totalMs = durationMinutes * 60 * 1000;
    const endAt = performance.now() + totalMs;

    const cdMin = document.getElementById('cdMin');
    const cdSec = document.getElementById('cdSec');
    const countdownEl = document.getElementById('countdown');
    const progressFill = document.getElementById('progressFill');
    const headlineEl = document.getElementById('headlineText');

    let lastRenderedSecond = -1;
    let wentLive = false;

    // rAF statt setInterval: die Fortschritts-Linie laeuft dadurch bei jedem
    // Frame (60fps) sichtbar fluessig leer, waehrend die MM:SS-Ziffern nur
    // beim tatsaechlichen Sekundenwechsel aktualisiert werden (kein
    // unnoetiges DOM-Geflacker, bleibt gestochen scharf statt weich
    // ueberzublenden).
    function tick(now) {
      const remainingMs = Math.max(0, endAt - now);
      const remainingSeconds = Math.ceil(remainingMs / 1000);

      if (remainingSeconds !== lastRenderedSecond) {
        lastRenderedSecond = remainingSeconds;
        const mm = Math.floor(remainingSeconds / 60);
        const ss = remainingSeconds % 60;
        cdMin.textContent = String(mm).padStart(2, '0');
        cdSec.textContent = String(ss).padStart(2, '0');
      }

      progressFill.style.width = (remainingMs / totalMs * 100).toFixed(3) + '%';

      if (remainingMs <= 0 && !wentLive) {
        wentLive = true;
        countdownEl.classList.add('is-live');
        // Bleibt bewusst NICHT bei "00:00" stehen (wirkt kaputt, falls die
        // Szene nach Ablauf noch kurz sichtbar ist, bevor manuell auf die
        // Gameplay-Szene umgeschaltet wird), sondern faellt auf einen
        // ruhigen "LIVE"-Zustand zurueck - kein harter Modus-Wechsel im JS
        // noetig, die Fortschritts-Linie bleibt einfach leer stehen.
        headlineEl.textContent = 'ON AIR';
      }

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // ---------- Rotierende Status-Meldungen ----------
    // Ersetzt das statische "SYSTEM INITIALIZING" durch mehrere kurze
    // Tech-Meldungen, die im Wechsel durchlaufen - sorgt dafuer, dass die
    // Szene ueber die vollen 5 Minuten hinweg nicht wie eingefroren wirkt.
    const EYEBROW_MESSAGES = [
      'SYSTEM INITIALIZING',
      'LOADING STREAM MODULES',
      'TWITCH CONNECTION: OK',
      'AUDIO ENGINE: STANDBY',
      'OVERLAY MODULES: READY',
      'STAND BY',
    ];
    let eyebrowIndex = 0;
    const eyebrowEl = document.getElementById('eyebrowText');
    setInterval(() => {
      eyebrowEl.classList.add('is-swapping');
      setTimeout(() => {
        eyebrowIndex = (eyebrowIndex + 1) % EYEBROW_MESSAGES.length;
        eyebrowEl.textContent = EYEBROW_MESSAGES[eyebrowIndex];
        eyebrowEl.classList.remove('is-swapping');
      }, 350);
    }, 3400);

    // ---------- Dezenter Glitch-Ausreisser ----------
    // Feuert in unregelmaessigen Abstaenden (6-11s) einen kurzen (~180ms)
    // Signal-Aussetzer auf dem Baerenkopf - simuliert einen kleinen
    // "Live-Feed"-Zucker statt eines Dauereffekts (siehe .is-glitching-CSS).
    const bearWrap = document.getElementById('bearWrap');
    function scheduleGlitch() {
      const delay = 6000 + Math.random() * 5000;
      setTimeout(() => {
        bearWrap.classList.add('is-glitching');
        setTimeout(() => bearWrap.classList.remove('is-glitching'), 180);
        scheduleGlitch();
      }, delay);
    }
    scheduleGlitch();

    // ---------- Simulierter Audio-Visualizer ----------
    // Rein dekorativ/prozedural: mehrschichtiges Sinus-Rauschen statt
    // echter Audioanalyse, da diese Szene keine Audioquelle hat (kein
    // Mikro, kein Player). Liefert trotzdem durchgehende, organisch
    // wirkende Bewegung fuer die 5-Minuten-Wartezeit.
    const vizCanvas = document.getElementById('visualizer');
    const vizCtx = vizCanvas.getContext('2d');
    const BAR_COUNT = 40;

    function resizeVisualizer() {
      const rect = vizCanvas.getBoundingClientRect();
      vizCanvas.width = Math.round(rect.width * devicePixelRatio);
      vizCanvas.height = Math.round(rect.height * devicePixelRatio);
    }
    resizeVisualizer();
    window.addEventListener('resize', resizeVisualizer);

    function barHeight(i, t) {
      // Ueberlagerte Sinus-Wellen mit leicht unterschiedlichen Frequenzen/
      // Phasen pro Balken statt echtem Noise-Modul - genuegt fuer einen
      // rein dekorativen "atmenden" Balken-Teppich, ohne eine zusaetzliche
      // Bibliothek/Klasse einzubinden.
      const a = Math.sin(t * 1.7 + i * 0.6) * 0.5 + 0.5;
      const b = Math.sin(t * 3.1 + i * 1.3 + 2.0) * 0.5 + 0.5;
      const c = Math.sin(t * 0.6 + i * 0.15) * 0.5 + 0.5;
      return 0.12 + (a * 0.5 + b * 0.3 + c * 0.2) * 0.88;
    }

    function drawVisualizer(now) {
      const t = now / 1000;
      const w = vizCanvas.width;
      const h = vizCanvas.height;
      vizCtx.clearRect(0, 0, w, h);
      const gap = w / BAR_COUNT;
      const barW = gap * 0.42;
      for (let i = 0; i < BAR_COUNT; i++) {
        const frac = barHeight(i, t);
        const barH = Math.max(2, frac * h);
        const x = i * gap + (gap - barW) / 2;
        const y = h - barH;
        vizCtx.fillStyle = 'rgba(255, 26, 26, ' + (0.35 + frac * 0.5).toFixed(2) + ')';
        vizCtx.fillRect(x, y, barW, barH);
      }
      requestAnimationFrame(drawVisualizer);
    }
    requestAnimationFrame(drawVisualizer);
  </script>

</body>
</html>
