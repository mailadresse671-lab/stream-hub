<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Vibes</title>
  <!-- Eigenstaendige "CHAT VIBES"-Chat-Panel-Quelle (TV/Boombox-Rahmen-
       Optik), aus in-game.html herausgeloest (siehe rl-stats.html fuer den
       vollen Kontext dieser Modularisierungs-Runde). Eigene tmi.js-
       Verbindung, XSS-sicheres Emote-Rendering 1:1 aus overlay.html/
       in-game.html uebernommen. Anders als chat.html (Urban-Blackout-Look,
       physik-basierte fallende Karten) - eigenstaendiger, simplerer Fade-
       In-Stil im Chrome/Gold-Bling-System, damit diese Quelle optisch zu
       start.html/in-game.html/rl-stats.html/event-cards.html passt. Fuellt
       die eigene Seite randlos aus - Streamlabs' Transform-Panel entscheidet
       ueber Endgroesse/Position.

       Runde 2: --vu von fest 1px auf eine vw-basierte clamp()-Formel
       umgestellt (kalibriert auf die natuerliche Design-Breite ~400px
       dieses Panels) - siehe rl-stats.html fuer die volle Begruendung
       (Streamlabs' Transform-Panel skaliert Inhalt NICHT proportional mit,
       sondern schneidet bei zu kleinem W/H schlicht ab). -->
  <script src="/assets/js/tmi-loader.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --blood: #ff2340; --tan: #d9b872; --cream: #f4f1ea; --vu: clamp(0.3px, 0.25vw, 3px); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: transparent; font-family: 'Share Tech Mono', monospace; color: var(--cream); overflow: hidden; width: 100%; height: 100%; }

    @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }

    .widget-position { position: fixed; inset: 0; padding: calc(var(--vu) * 9); box-sizing: border-box; background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 6px), linear-gradient(180deg, #3f3f3f 0%, #232323 45%, #2c2c2c 65%, #161616 100%); box-shadow: 0 10px 30px rgba(0,0,0,.6); }
    .chat-screw { position: absolute; width: calc(var(--vu) * 10); height: calc(var(--vu) * 10); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6b6b6b, #0d0d0d 70%); }
    .chat-screw.tl { top: calc(var(--vu) * 14); left: calc(var(--vu) * 14); }
    .chat-screw.tr { top: calc(var(--vu) * 14); right: calc(var(--vu) * 14); }
    .chat-screw.bl { bottom: calc(var(--vu) * 14); left: calc(var(--vu) * 14); }
    .chat-screw.br { bottom: calc(var(--vu) * 14); right: calc(var(--vu) * 14); }
    .chat-panel { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; background: rgba(10,9,8,.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,35,64,.3); }
    .chat-header { position: relative; flex: none; height: calc(var(--vu) * 50); display: flex; align-items: center; justify-content: space-between; padding: 0 calc(var(--vu) * 16); border-bottom: 1px solid rgba(255,35,64,.4); background: linear-gradient(180deg, rgba(0,0,0,.35), transparent); }
    .chat-header-left { display: flex; align-items: center; gap: calc(var(--vu) * 10); }
    .chat-knob { width: calc(var(--vu) * 13); height: calc(var(--vu) * 13); border-radius: 50%; background: radial-gradient(circle, #2a2a2a 0%, #0d0d0d 70%); border: 1px solid rgba(217,184,114,.5); flex: none; }
    .chat-title { font-family: 'Anton', sans-serif; font-size: calc(var(--vu) * 22); letter-spacing: 2px; background-image: linear-gradient(180deg, #fff6d9 0%, #f2c94c 20%, #b8860b 42%, #fff3c4 58%, #8a6410 75%, #f2c94c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; text-shadow: 0 1px 0 rgba(58,38,10,.7); }
    .chat-header-right { display: flex; align-items: center; gap: calc(var(--vu) * 6); }
    .chat-header-right .dot { width: calc(var(--vu) * 6); height: calc(var(--vu) * 6); border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.7); }
    .chat-header-right .dot.connecting { background: rgba(244,241,234,.35); box-shadow: none; }
    .chat-header-right .dot.error { background: var(--blood); box-shadow: 0 0 6px 2px rgba(255,35,64,.8); animation: blinkDot 1.2s ease-in-out infinite; }
    .chat-header-right span { font-size: calc(var(--vu) * 12); letter-spacing: 1.5px; color: rgba(244,241,234,.55); white-space: nowrap; }
    .chat-list { position: relative; flex: 1 1 auto; overflow: hidden; padding: calc(var(--vu) * 10) calc(var(--vu) * 8); display: flex; flex-direction: column; gap: 2px; -webkit-mask-image: linear-gradient(180deg, transparent 0, black 26px, black calc(100% - 8px), transparent 100%); mask-image: linear-gradient(180deg, transparent 0, black 26px, black calc(100% - 8px), transparent 100%); }
    .chat-msg { padding: calc(var(--vu) * 11) calc(var(--vu) * 10); font-size: calc(var(--vu) * 15); line-height: 1.3; word-break: break-word; opacity: 0; transform: translateY(6px); transition: opacity .3s ease, transform .3s ease; }
    .chat-msg.visible { opacity: 1; transform: translateY(0); }
    .chat-msg .u { font-weight: 700; }
    .chat-msg .sep { color: rgba(244,241,234,.5); }
    .chat-msg .t { color: #e9e4d8; }
    .chat-emote { height: calc(var(--vu) * 20); vertical-align: middle; }
    .chat-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--vu) * 10); }
    .chat-empty span:first-child { font-size: calc(var(--vu) * 13); letter-spacing: 3px; color: rgba(217,184,114,.6); }
    .chat-empty span:last-child { font-size: calc(var(--vu) * 20); color: rgba(255,35,64,.7); animation: blinkDot 1s steps(2,start) infinite; }
  </style>
</head>
<body>

  <div class="widget-position">
    <div class="chat-screw tl"></div><div class="chat-screw tr"></div><div class="chat-screw bl"></div><div class="chat-screw br"></div>
    <div class="chat-panel">
      <div class="chat-header">
        <div class="chat-header-left">
          <div class="chat-knob"></div>
          <span class="chat-title">CHAT VIBES</span>
          <div class="chat-knob"></div>
        </div>
        <div class="chat-header-right">
          <div class="dot connecting" id="chatStatusDot"></div>
          <span id="chatStatusText">Verbinde…</span>
        </div>
      </div>
      <div class="chat-list" id="chatList">
        <div class="chat-empty" id="chatEmpty">
          <span>WARTE AUF NACHRICHTEN</span>
          <span>_</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const OVERLAY_CHANNEL = 'dangsxr1000';
    const MAX_VISIBLE_MESSAGES = 8;
    const AUTO_HIDE_MS = 20000;
    const chatList = document.getElementById('chatList');
    const chatEmpty = document.getElementById('chatEmpty');
    const chatMsgs = [];

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function renderMessageHtml(message, emotesTag) {
      if (!emotesTag || Object.keys(emotesTag).length === 0) return escapeHtml(message);
      const ranges = [];
      for (const id in emotesTag) {
        emotesTag[id].forEach(pos => {
          const [start, end] = pos.split('-').map(Number);
          ranges.push({ id, start, end });
        });
      }
      ranges.sort((a, b) => a.start - b.start);
      let html = '';
      let cursor = 0;
      ranges.forEach(({ id, start, end }) => {
        if (start < cursor) return;
        if (start > cursor) html += escapeHtml(message.slice(cursor, start));
        const code = message.slice(start, end + 1);
        const src = `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(id)}/default/dark/2.0`;
        html += `<img class="chat-emote" src="${src}" alt="${escapeHtml(code)}" title="${escapeHtml(code)}" draggable="false">`;
        cursor = end + 1;
      });
      if (cursor < message.length) html += escapeHtml(message.slice(cursor));
      return html;
    }
    function removeChatMsg(msgDiv) {
      const idx = chatMsgs.indexOf(msgDiv);
      if (idx !== -1) chatMsgs.splice(idx, 1);
      if (msgDiv.parentNode === chatList) chatList.removeChild(msgDiv);
    }
    function addChatMessage(username, text, color, emotesTag) {
      if (chatEmpty.parentNode) chatEmpty.remove();
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg';
      msgDiv.innerHTML = `<span class="u" style="color:${color}">${username}</span><span class="sep">: </span><span class="t">${renderMessageHtml(text, emotesTag)}</span>`;
      chatList.appendChild(msgDiv);
      chatMsgs.push(msgDiv);
      requestAnimationFrame(() => msgDiv.classList.add('visible'));

      while (chatMsgs.length > MAX_VISIBLE_MESSAGES) removeChatMsg(chatMsgs[0]);
      setTimeout(() => removeChatMsg(msgDiv), AUTO_HIDE_MS);

    }

    // Sichtbarer Verbindungsstatus statt stillem console.warn - Nutzer
    // meldete, die Karte zeige seinen echten Chat nicht an, ohne dass aus
    // einem leeren "WARTE AUF NACHRICHTEN"-Zustand ersichtlich war, ob die
    // tmi.js-Verbindung ueberhaupt zustande kam. Ersetzt die vorherige
    // simulierte "Zuschauerzahl" (die ohnehin nur die Anzahl gerenderter
    // Chat-Nachrichten war, keine echte Twitch-Viewer-Zahl).
    // Runde 2: unterscheidet jetzt WO es scheitert - "CDN-Fehler" (tmi.js
    // selbst kam nie vom CDN an) vs. "Verbindungsfehler" (tmi.js ist da,
    // aber die IRC-WebSocket-Verbindung zu Twitch schlaegt fehl) - der
    // Nutzer sah nach der ersten Version nur ein generisches "Fehler" und
    // konnte damit nicht unterscheiden, welche der beiden Ursachen es ist -
    // das entscheidet aber komplett unterschiedliche Fixes (CDN wechseln/
    // selbst hosten vs. etwas ganz anderes).
    function setChatStatus(status) {
      const dot = document.getElementById('chatStatusDot');
      const text = document.getElementById('chatStatusText');
      const labels = { connecting: 'Verbinde…', connected: 'Verbunden', 'error-cdn': 'CDN-Fehler', 'error-connect': 'Verbindungsfehler' };
      dot.className = 'dot ' + (status.indexOf('error') === 0 ? 'error' : status);
      text.textContent = labels[status] || status;
    }

    loadTmiWithFallback(function () {
      try {
        const twitchChat = new tmi.Client({
          options: { debug: false },
          connection: { secure: true, reconnect: true },
          channels: [OVERLAY_CHANNEL]
        });
        twitchChat.on('connected', () => setChatStatus('connected'));
        twitchChat.on('disconnected', (reason) => {
          setChatStatus('error-connect');
          console.warn('[Chat] Verbindung getrennt:', reason);
        });
        twitchChat.connect().catch(err => {
          setChatStatus('error-connect');
          console.warn('[Chat] Verbindung fehlgeschlagen:', err.message || err);
        });
        twitchChat.on('message', (channel, tags, message, self) => {
          if (self) return;
          const userColor = tags.color || '#f2c94c';
          const displayName = tags['display-name'] || tags.username;
          addChatMessage(displayName, message, userColor, tags.emotes);
        });
      } catch (e) {
        setChatStatus('error-connect');
        console.warn('[Chat] tmi.js nicht verfuegbar, Chat-Feed deaktiviert:', e.message);
      }
    }, function () {
      setChatStatus('error-cdn');
      console.warn('[Chat] tmi.js konnte von keinem CDN geladen werden, Chat-Feed deaktiviert.');
    });
  </script>

</body>
</html>
