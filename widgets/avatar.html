<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Avatar</title>
  <!-- Modul 3: eigenes Bild statt CSS-Maske (assets/images/avatar_idle.png /
       avatar_action.png, vom Nutzer bereitgestellt, echte RGBA-Transparenz).
       Zwei Bild-Zustaende statt nur einem: IDLE (Dauerzustand, permanentes
       Wippen) wechselt bei jedem Event fuer ca. 3.5s auf ACTION (Bild-Swap +
       Punch-Bounce), dann fliessend (Opacity-Crossfade) zurueck auf IDLE.

       Runde 2: eigenstaendige, frei positionierbare Streamlabs-Browser-Quelle
       (siehe STREAMLABS_SETUP.md) - `.avatar-position` fuellt die eigene
       Seite randlos aus (`inset: 0`), Streamlabs' Transform-Panel entscheidet
       ueber Endgroesse/Platzierung. Permanenter Drop-Shadow-Glow
       (`--blood: #ff2340`) statt einer separaten Glow-Div, echte
       Twitch-EventSub-Anbindung (Follow/Sub/Cheer/Raid).

       Runde 3 (aktuell): Nutzer wollte "mehr Bewegung, mehr Interaktion,
       mehr Stil" - da nur zwei Bilder existieren (keine neuen Posen),
       komplett ueber CSS/JS geloest statt neuer Grafik-Assets:
       - Reaktionen sind jetzt nach Tier gestaffelt (light/medium/strong/epic
         fuer Chat/Follow/Sub-Cheer/Raid) mit unterschiedlicher Punch-Staerke,
         Glow-Farbe, Partikel-Burst und Text-Callout - vorher reagierte der
         Baer auf jedes Event identisch.
       - Permanente Idle-Wippe bekommt zusaetzlich alle ~25-40s eine groessere
         "Flex"-Geste, damit auch die langen Ruhephasen ohne Event lebendiger
         wirken (analog zum Idle-Ambient-Prinzip aus goal.html). -->
  <script src="/assets/js/tmi-loader.js"></script>
  <style>
    :root {
      --blood: #ff2340;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      overflow: hidden;
      height: 100vh;
    }

    /* Fuellt die eigene Seite randlos aus (statt einer festen Ecken-Position
       mit fester Breite) - dadurch entscheidet AUSSCHLIESSLICH Streamlabs'
       eigenes Transform-Panel (W/H/Position der Quelle) ueber Groesse und
       Platzierung auf dem Canvas, keine doppelte/verwirrende Kontrolle
       durch zusaetzliche CSS-Offsets hier im Code. */
    .avatar-position {
      position: fixed;
      inset: 0;
    }
    @keyframes avatarEpicShake {
      0%, 100% { translate: 0 0; }
      20% { translate: -5px 3px; }
      40% { translate: 5px -3px; }
      60% { translate: -4px -3px; }
      80% { translate: 4px 3px; }
    }
    .avatar-position.epic-shake {
      animation: avatarEpicShake 0.32s ease-in-out;
    }

    /* Aeussere Huelle traegt das dauerhafte Idle-Wippen (CSS-Animation) -
       getrennt vom Punch-Wrapper, der per JS fuer den Reaktions-Bounce
       skaliert/verschoben wird (gleiches Trennprinzip wie ueberall sonst
       im Projekt: zwei Transform-Quellen duerfen sich nicht gegenseitig
       ueberschreiben). Organischeres Schaukeln (statt reinem Auf-Ab)
       durch zusaetzliche horizontale Verschiebung + wechselnde
       Rotationsrichtung ueber 4 Punkte, damit der Baer auch in den
       >95% Sendezeit ohne Event lebendig wirkt statt nur simpel zu
       huepfen. */
    .avatar-bob {
      position: relative;
      width: 100%;
      height: 100%;
      animation: avatarIdleBounce 3.6s ease-in-out infinite;
      transform-origin: 50% 100%;
    }
    @keyframes avatarIdleBounce {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      25% { transform: translate(1.5px, -3px) rotate(-1.4deg) scale(1.005); }
      50% { transform: translate(0, -6px) rotate(0.6deg) scale(1.012); }
      75% { transform: translate(-1.5px, -2.5px) rotate(1.4deg) scale(1.005); }
    }
    /* Groesserer, einmaliger Bewegungs-Ausschlag alle ~25-40s (siehe
       scheduleIdleFlex() im Script) - zwei Klassen auf demselben Element,
       ".flexing" hat hoehere Spezifitaet und ersetzt die Dauerschleife
       fuer die kurze Dauer der Geste. */
    @keyframes avatarFlexPulse {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      30% { transform: translate(0, -16px) rotate(-7deg) scale(1.06); }
      55% { transform: translate(0, -11px) rotate(6deg) scale(1.035); }
      80% { transform: translate(0, -4px) rotate(-2deg) scale(1.01); }
    }
    .avatar-bob.flexing {
      animation: avatarFlexPulse 1.15s cubic-bezier(0.34, 1.2, 0.64, 1) 1;
    }

    /* Punch-Wrapper: kurzer Bounce-Impuls bei jedem Trigger, unabhaengig
       vom darunterliegenden Idle-Wippen. Haelt die beiden gestapelten
       Bild-Layer, die per Opacity ueberblendet werden (fliessender
       Uebergang statt hartem src-Swap). Vier Staerke-Stufen (Tier) statt
       eines einzelnen Ausschlags - Chat/Follow/Sub-Cheer/Raid fuehlen sich
       dadurch spuerbar unterschiedlich "wichtig" an. */
    .avatar-punch {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: 50% 100%;
    }
    .avatar-punch.punch-light {
      transform: translateY(-8px) scale(1.04) rotate(-2deg);
    }
    .avatar-punch.punch-medium {
      transform: translateY(-13px) scale(1.09) rotate(-4deg);
    }
    .avatar-punch.punch-strong {
      transform: translateY(-18px) scale(1.14) rotate(-6deg);
    }
    .avatar-punch.punch-epic {
      transform: translateY(-25px) scale(1.2) rotate(-8deg);
    }

    .avatar-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 5px var(--blood)) drop-shadow(0 0 20px var(--blood)) drop-shadow(0 0 46px var(--blood));
      transition: opacity 0.4s ease;
    }
    .avatar-layer-idle { opacity: 1; }
    .avatar-layer-action { opacity: 0; pointer-events: none; }
    .avatar-punch.action .avatar-layer-idle { opacity: 0; }
    .avatar-punch.action .avatar-layer-action { opacity: 1; }

    /* Regenbogen-Farbwechsel exklusiv fuer Raids (groesstes Event) - direkt
       auf "filter" animiert statt ueber die --blood-Variable, da animierte
       CSS-Custom-Properties fuer Farbwerte ohne @property-Registrierung
       (Browser-Support-Risiko) nicht zuverlaessig interpoliert werden. */
    @keyframes avatarEpicGlow {
      0%   { filter: drop-shadow(0 0 5px #ff2340) drop-shadow(0 0 22px #ff2340) drop-shadow(0 0 50px rgba(255,35,64,.65)); }
      33%  { filter: drop-shadow(0 0 5px #ffd700) drop-shadow(0 0 22px #ffd700) drop-shadow(0 0 50px rgba(255,215,0,.65)); }
      66%  { filter: drop-shadow(0 0 5px #38bdf8) drop-shadow(0 0 22px #38bdf8) drop-shadow(0 0 50px rgba(56,189,248,.65)); }
      100% { filter: drop-shadow(0 0 5px #ff2340) drop-shadow(0 0 22px #ff2340) drop-shadow(0 0 50px rgba(255,35,64,.65)); }
    }
    .avatar-layer.epic-pulse {
      animation: avatarEpicGlow 0.6s linear 3;
    }

    /* Partikel-Burst-Canvas - liegt ueber dem Baeren, faengt beim Zeichnen
       nichts vom Klick/Zeiger ab. Bewusst simpler als goal.html's
       SpraySystem (keine Noise-/Audio-Reaktivitaet noetig fuer einen
       kurzen Konfetti-Ausbruch bei Follow/Sub/Cheer/Raid). */
    .avatar-particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    /* Kurzer Text-Callout ueber dem Baeren bei Follow/Sub/Cheer/Raid - bei
       Chat-Nachrichten (Tier "light") bewusst NICHT gezeigt, da dort viel
       zu haeufig ausgeloest fuer eine Textanzeige. */
    .avatar-callout {
      position: absolute;
      left: 50%;
      bottom: 2%;
      transform: translate(-50%, 14px);
      padding: 0.35em 0.9em;
      background: rgba(10, 9, 8, 0.85);
      border: 2px solid var(--blood);
      border-radius: 10px;
      color: #f4f1ea;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      letter-spacing: 1px;
      font-size: clamp(11px, 3.2vw, 20px);
      white-space: nowrap;
      text-shadow: 0 0 8px var(--blood);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 5;
    }
    .avatar-callout.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>

  <div class="avatar-position" id="avatarPosition">
    <div class="avatar-bob" id="avatarBob">
      <div class="avatar-punch" id="avatarPunch">
        <img class="avatar-layer avatar-layer-idle" src="/assets/images/avatar_idle.png" alt="DaN Avatar">
        <img class="avatar-layer avatar-layer-action" src="/assets/images/avatar_action.png" alt="DaN Avatar (Action)">
      </div>
    </div>
    <canvas class="avatar-particles" id="avatarParticles"></canvas>
    <div class="avatar-callout" id="avatarCallout"></div>
  </div>

  <script>
    const VERCEL_URL = "https://stream-hub-three-gold.vercel.app";
    const params = new URLSearchParams(location.search);

    // ?test=speak simuliert einen Reaktions-Puls ohne echtes Mikro/Chat,
    // ?test=follow|sub|resub|bits|raid simuliert ein EventSub-Event,
    // ?test=idle loest sofort die Idle-Flex-Geste aus - gleiches Prinzip
    // wie in-game.html/goal.html's ?test=.
    const MIC_SPEAK_THRESHOLD = 0.08;

    const avatarPosition = document.getElementById('avatarPosition');
    const avatarBob = document.getElementById('avatarBob');
    const avatarPunch = document.getElementById('avatarPunch');
    const avatarLayers = document.querySelectorAll('.avatar-layer');
    const calloutEl = document.getElementById('avatarCallout');
    const particleCanvas = document.getElementById('avatarParticles');
    const particleCtx = particleCanvas.getContext('2d');

    const ACTION_DURATION_MS = 3500;
    const DEFAULT_GLOW = 'rgba(255,35,64,.85)';
    let actionResetTimer = null;
    let glowResetTimer = null;
    let calloutHideTimer = null;

    // -Infinity statt 0: performance.now() liegt beim allerersten Aufruf
    // kurz nach dem Laden der Seite oft noch UNTER PUNCH_COOLDOWN_MS - mit
    // 0 als Start wuerde die allererste Reaktion (Punch/Glow/Partikel/
    // Callout) dadurch faelschlich vom Cooldown blockiert.
    let lastPunchAt = -Infinity;
    const PUNCH_COOLDOWN_MS = 350;

    // ---------- Reaktions-Tiers: Chat < Follow < Sub/Cheer < Raid ----------
    const PUNCH_CLASSES = ['punch-light', 'punch-medium', 'punch-strong', 'punch-epic'];
    const REACTION_TIERS = {
      light:  { punchClass: 'punch-light',  glow: DEFAULT_GLOW,           particleColor: '#ff2340', particleCount: 0 },
      medium: { punchClass: 'punch-medium', glow: 'rgba(56,189,248,.9)',  particleColor: '#38bdf8', particleCount: 16 },
      strong: { punchClass: 'punch-strong', glow: 'rgba(255,215,0,.9)',   particleColor: '#ffd700', particleCount: 24 },
      epic:   { punchClass: 'punch-epic',   glow: DEFAULT_GLOW,           particleColor: '#ff2340', particleCount: 36 }
    };

    function resizeParticleCanvas() {
      particleCanvas.width = particleCanvas.clientWidth;
      particleCanvas.height = particleCanvas.clientHeight;
    }
    window.addEventListener('resize', resizeParticleCanvas);
    resizeParticleCanvas();

    let particles = [];
    let particleAnimHandle = null;

    function stepParticles() {
      particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.life -= p.decay;
        particleCtx.globalAlpha = Math.max(0, p.life);
        particleCtx.fillStyle = p.color;
        particleCtx.beginPath();
        particleCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        particleCtx.fill();
      });
      particleCtx.globalAlpha = 1;
      particleAnimHandle = particles.length > 0 ? requestAnimationFrame(stepParticles) : null;
    }

    function burstParticles(color, count) {
      if (particleCanvas.width === 0) resizeParticleCanvas();
      const cx = particleCanvas.width / 2;
      const cy = particleCanvas.height * 0.4;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 3.5;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          life: 1,
          decay: 0.014 + Math.random() * 0.014,
          size: 2 + Math.random() * 3,
          color
        });
      }
      if (!particleAnimHandle) particleAnimHandle = requestAnimationFrame(stepParticles);
    }

    function showCallout(text) {
      calloutEl.textContent = text;
      calloutEl.classList.add('visible');
      clearTimeout(calloutHideTimer);
      calloutHideTimer = setTimeout(() => calloutEl.classList.remove('visible'), 2200);
    }

    function triggerReaction(tier, calloutText) {
      const cfg = REACTION_TIERS[tier] || REACTION_TIERS.light;
      const now = performance.now();

      // Kurzer Bounce-Impuls - per Cooldown gegen Nachrichten-Spam gedrosselt.
      // Glow/Partikel/Callout/Shake haengen am selben Cooldown, da sie
      // visuell zum selben "Impuls" gehoeren.
      if (now - lastPunchAt >= PUNCH_COOLDOWN_MS) {
        lastPunchAt = now;
        avatarPunch.classList.remove(...PUNCH_CLASSES);
        void avatarPunch.offsetWidth;
        avatarPunch.classList.add(cfg.punchClass);
        setTimeout(() => avatarPunch.classList.remove(cfg.punchClass), 280);

        avatarPosition.style.setProperty('--blood', cfg.glow);
        clearTimeout(glowResetTimer);
        glowResetTimer = setTimeout(() => avatarPosition.style.setProperty('--blood', DEFAULT_GLOW), ACTION_DURATION_MS);

        if (tier === 'epic') {
          avatarPosition.classList.remove('epic-shake');
          void avatarPosition.offsetWidth;
          avatarPosition.classList.add('epic-shake');
          setTimeout(() => avatarPosition.classList.remove('epic-shake'), 320);

          avatarLayers.forEach(el => {
            el.classList.remove('epic-pulse');
            void el.offsetWidth;
            el.classList.add('epic-pulse');
          });
          setTimeout(() => avatarLayers.forEach(el => el.classList.remove('epic-pulse')), 1800);
        }

        if (cfg.particleCount > 0) burstParticles(cfg.particleColor, cfg.particleCount);
        if (calloutText) showCallout(calloutText);
      }

      // Action-Bild haelt ca. 3.5s; jedes weitere Event waehrenddessen
      // verlaengert die Anzeigedauer (Baer bleibt "hyped", solange staendig
      // Events reinkommen), statt hart abzuschneiden.
      avatarPunch.classList.add('action');
      clearTimeout(actionResetTimer);
      actionResetTimer = setTimeout(() => {
        avatarPunch.classList.remove('action');
      }, ACTION_DURATION_MS);
    }

    // ---------- Idle-Flex: groesserer Ausschlag alle ~25-40s ----------
    const IDLE_FLEX_MIN_MS = 25000;
    const IDLE_FLEX_MAX_MS = 40000;
    let idleFlexTimer = null;

    function triggerIdleFlex() {
      avatarBob.classList.remove('flexing');
      void avatarBob.offsetWidth;
      avatarBob.classList.add('flexing');
      setTimeout(() => avatarBob.classList.remove('flexing'), 1150);
    }

    function scheduleIdleFlex() {
      const delay = IDLE_FLEX_MIN_MS + Math.random() * (IDLE_FLEX_MAX_MS - IDLE_FLEX_MIN_MS);
      idleFlexTimer = setTimeout(() => {
        triggerIdleFlex();
        scheduleIdleFlex();
      }, delay);
    }
    scheduleIdleFlex();

    // ---------- Chat-reaktiv: "Chat ist meine Stimme" ----------
    // Eigene tmi.js-Verbindung (in try/catch gekapselt, damit ein CDN-
    // Ausfall die Idle-Animation nicht mitreisst). Jede eingehende
    // Nachricht loest die dezente "light"-Reaktion aus.
    const CHAT_REACT_CHANNEL = 'dangsxr1000';
    loadTmiWithFallback(function () {
      try {
        const reactChatClient = new tmi.Client({
          options: { debug: false },
          connection: { secure: true, reconnect: true },
          channels: [CHAT_REACT_CHANNEL]
        });
        reactChatClient.connect().catch(err => {
          console.warn('[Avatar] Chat-Reaktivitaet: Verbindung fehlgeschlagen:', err.message || err);
        });
        reactChatClient.on('message', (channel, tags, message, self) => {
          if (self) return;
          triggerReaction('light');
        });
      } catch (e) {
        console.warn('[Avatar] tmi.js nicht verfuegbar, Chat-Reaktivitaet deaktiviert (Idle-Animation laeuft unabhaengig davon weiter):', e.message);
      }
    }, function () {
      console.warn('[Avatar] tmi.js konnte von keinem CDN geladen werden, Chat-Reaktivitaet deaktiviert (Idle-Animation laeuft unabhaengig davon weiter).');
    });

    // =====================================================================
    // Twitch EventSub (natives WebSocket, 1:1 Verbindungs-/Reconnect-Logik
    // aus overlay.html/in-game.html uebernommen).
    // =====================================================================
    const TWITCH_EVENTSUB_URL = 'wss://eventsub.wss.twitch.tv/ws';
    let reconnectAttempts = 0;
    let reconnectTimer = null;

    function scheduleReconnect(reason) {
      reconnectAttempts += 1;
      const delay = Math.min(30000, 2000 * reconnectAttempts);
      console.log('[Avatar/EventSub] verbinde neu in ' + (delay / 1000) + 's (' + reason + ')');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => connectTwitchEventSub(), delay);
    }

    async function subscribeToTwitchEvents(sessionId) {
      try {
        const cleanUrl = VERCEL_URL.replace(/\/$/, "");
        const res = await fetch(`${cleanUrl}/api/twitch-eventsub`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });
        const data = await res.json();
        if (!data || !data.success) {
          console.warn('[Avatar/EventSub] Subscription fehlgeschlagen:', (data && data.message) || 'unbekannt');
          return;
        }
        console.log('[Avatar/EventSub] verbunden, Events angemeldet.');
      } catch (e) {
        console.warn('[Avatar/EventSub] Fehler:', e.message || e);
      }
    }

    // Ordnet jeden EventSub-Typ einem Reaktions-Tier + Callout-Text zu -
    // Follow ist "medium", Sub/Resub/Cheer sind "strong" (gleiche
    // Intensitaet, unterschiedlicher Text), Raid ist "epic" (seltenstes,
    // groesstes Event).
    const EVENT_TYPE_MAP = {
      'channel.follow': { tier: 'medium', callout: 'NEUER FOLLOWER!' },
      'channel.subscribe': { tier: 'strong', callout: 'NEUER SUB!' },
      'channel.subscription.message': { tier: 'strong', callout: 'RESUB!' },
      'channel.cheer': { tier: 'strong', callout: 'CHEER!' },
      'channel.raid': { tier: 'epic', callout: 'RAID!' }
    };

    function handleTwitchNotification(payload) {
      const mapped = EVENT_TYPE_MAP[payload.subscription.type];
      if (mapped) triggerReaction(mapped.tier, mapped.callout);
    }

    function connectTwitchEventSub(url, isReconnectHandoff) {
      url = url || TWITCH_EVENTSUB_URL;
      const ws = new WebSocket(url);
      let handoffInProgress = false;

      ws.onopen = () => {};
      ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch (e) { return; }
        const messageType = data.metadata && data.metadata.message_type;

        if (messageType === 'session_welcome') {
          reconnectAttempts = 0;
          if (isReconnectHandoff) return;
          subscribeToTwitchEvents(data.payload.session.id);
          return;
        }
        if (messageType === 'session_keepalive') return;
        if (messageType === 'notification') { handleTwitchNotification(data.payload); return; }
        if (messageType === 'session_reconnect') {
          handoffInProgress = true;
          connectTwitchEventSub(data.payload.session.reconnect_url, true);
          return;
        }
        if (messageType === 'revocation') {
          console.warn('[Avatar/EventSub] Subscription widerrufen:', data.payload.subscription.type);
          return;
        }
      };
      ws.onerror = () => {};
      ws.onclose = (event) => {
        if (handoffInProgress) return;
        scheduleReconnect(event.reason || `Code ${event.code}`);
      };
    }
    connectTwitchEventSub();

    // ---------- Mikro-Reaktivitaet (kostenloser Bonus-Pfad) ----------
    // In der Streamlabs-Mobile-WebView bestaetigt blockiert - bleibt im
    // Code, falls die Seite je in einem weniger restriktiven Kontext
    // laeuft; schlaegt es fehl, laeuft die Chat-/Idle-Animation unveraendert
    // weiter. Loest wie Chat-Nachrichten nur die dezente "light"-Reaktion aus.
    function startMicVisualLoop(getLevel) {
      function step() {
        const level = getLevel();
        if (level > MIC_SPEAK_THRESHOLD) triggerReaction('light');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function startMicTestMode() {
      let t = 0;
      startMicVisualLoop(() => {
        t += 0.05;
        return Math.max(0, Math.sin(t) * 0.5 + 0.5) * (0.6 + Math.random() * 0.4);
      });
    }

    async function tryStartMic() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        // Bewusst NICHT mit audioCtx.destination verbunden - sonst waere
        // das eigene Mikrofon im Stream als Echo/Feedback zu hoeren.
        source.connect(analyser);

        startMicVisualLoop(() => {
          analyser.getByteTimeDomainData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += Math.abs(dataArray[i] - 128);
          return Math.min(1, (sum / dataArray.length) / 40);
        });
        console.log('[Avatar] Mikrofon-Bonus aktiv - Reaktionen jetzt zusaetzlich stimmgesteuert.');
      } catch (err) {
        console.log('[Avatar] Mikrofon-Bonus nicht verfuegbar (' + (err.name || 'Fehler') + ') - Idle-/Chat-Animation laeuft normal weiter.');
      }
    }

    // ---------- Test-Modus (?test=follow|sub|resub|bits|raid|speak|idle) ----------
    function runTestMode() {
      const testParam = params.get('test');
      if (!testParam) return false;
      if (testParam === 'speak') { startMicTestMode(); return true; }
      if (testParam === 'idle') { triggerIdleFlex(); return true; }
      const typeMap = { follow: 'channel.follow', sub: 'channel.subscribe', resub: 'channel.subscription.message', bits: 'channel.cheer', cheer: 'channel.cheer', raid: 'channel.raid' };
      const type = typeMap[testParam.toLowerCase()];
      if (!type) return false;
      handleTwitchNotification({ subscription: { type }, event: {} });
      return true;
    }

    if (!runTestMode()) {
      tryStartMic();
    }
  </script>

</body>
</html>
