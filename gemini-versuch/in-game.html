<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>DaN - In-Game HUD (Live)</title>
  
  <!-- ECHTE TWITCH CHAT VERBINDUNG -->
  <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Courier+Prime:wght@400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: 'Courier Prime', monospace;
      color: #f4e8d0;
    }

    /* --- DER ECHTE SCHARFE BÄR IM GOLDRAHMEN --- */
    .bear-frame {
      position: absolute;
      top: 5vh;
      left: 1.5vw;
      width: 280px;
      height: 320px;
      background: rgba(10, 5, 5, 0.9);
      border: 3px solid #ffd45e;
      box-shadow: 0 0 20px rgba(255, 212, 94, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .live-dot {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ff2340;
      font-family: 'Bungee', cursive;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 10;
    }

    .live-dot::before {
      content: '';
      width: 10px;
      height: 10px;
      background: #ff2340;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff2340;
      animation: pulse 2s infinite;
    }

    .bear-avatar {
      width: 90%;
      height: 90%;
      /* Hier greifen wir auf dein echtes, hochauflösendes Bild im Repo zu */
      background-image: url('../bear_avatar.png'); 
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* --- DER ECHTE LIVE CHAT --- */
    .chat-position {
      position: absolute;
      top: 30vh;
      right: 1.5vw;
      width: 350px;
      height: 45vh;
      background: rgba(36, 18, 9, 0.85);
      border: 2px solid #8c6a2f;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      font-family: 'Bungee', cursive;
      font-size: 16px;
      color: #d4a24c;
      margin-bottom: 10px;
      text-align: right;
      border-bottom: 1px solid #8c6a2f;
      padding-bottom: 5px;
    }

    #chat-container {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
    }

    .chat-msg {
      background: rgba(20, 16, 12, 0.8);
      border-left: 3px solid #ffd45e;
      padding: 8px;
      font-size: 14px;
      animation: slideIn 0.3s ease-out forwards;
    }

    .chat-user { color: #d4a24c; font-weight: bold; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>

  <div class="bear-frame">
    <div class="live-dot">LIVE</div>
    <div class="bear-avatar" id="bear"></div>
  </div>

  <div class="chat-position">
    <div class="chat-header">LIVE CHAT VIBES</div>
    <div id="chat-container"></div>
  </div>

<script>
  // --- ECHTE TWITCH CHAT LOGIK ---
  const chatContainer = document.getElementById('chat-container');
  const bearAvatar = document.getElementById('bear');
  
  // Verbindet sich mit DEINEM Kanal
  const client = new tmi.Client({ channels: [ 'dangsxr1000' ] });
  client.connect();

  client.on('message', (channel, tags, message, self) => {
    // Bär wackelt minimal, wenn jemand im Chat schreibt
    bearAvatar.style.transform = `scale(1.02) rotate(${Math.random() > 0.5 ? 1 : -1}deg)`;
    setTimeout(() => bearAvatar.style.transform = 'scale(1) rotate(0deg)', 150);

    const msgEl = document.createElement('div');
    msgEl.className = 'chat-msg';
    msgEl.innerHTML = `<span class="chat-user">${tags['display-name']}:</span> ${message}`;
    chatContainer.appendChild(msgEl);

    // Behält maximal die letzten 7 Nachrichten im Bild
    if (chatContainer.children.length > 7) {
      chatContainer.removeChild(chatContainer.firstChild);
    }
  });
</script>
</body>
</html>
