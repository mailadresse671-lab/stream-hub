<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Cards</title>
  <!-- Eigenstaendige "letztes Event"-Kartenstapel-Quelle (Follower/Sub/Bits),
       aus in-game.html herausgeloest (siehe rl-stats.html fuer den vollen
       Kontext dieser Modularisierungs-Runde). Eigene Twitch-EventSub-
       Verbindung (1:1 Logik aus overlay.html/in-game.html), zeigt echte
       "letztes Event"-Daten statt Demo-Werten, "Warte auf..."-Platzhalter
       vor dem ersten echten Event. Fuellt die eigene Seite randlos aus -
       Streamlabs' Transform-Panel entscheidet ueber Endgroesse/Position. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --blood: #ff2340; --tan: #d9b872; --cream: #f4f1ea; --vu: 1px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: transparent; font-family: 'Share Tech Mono', monospace; color: var(--cream); overflow: hidden; width: 100%; height: 100%; }

    @keyframes chromeShine { 0% { background-position: -160% 0, 0 0; } 45% { background-position: 160% 0, 0 0; } 100% { background-position: 160% 0, 0 0; } }

    .chrome-frame {
      padding: 1.5px;
      background-image: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.9) 50%, transparent 65%),
        linear-gradient(180deg, #f2c94c, #8a6410 50%, #f6df9e 100%);
      background-size: 260% 100%, 100% 100%; background-position: -160% 0, 0 0;
      animation: chromeShine 6s ease-in-out infinite;
      box-shadow: 0 4px 14px rgba(0,0,0,.5);
    }

    .widget-position { position: fixed; inset: 0; padding: calc(var(--vu) * 6); display: flex; flex-direction: column; justify-content: center; }
    .event-stack { width: 100%; display: flex; flex-direction: column; gap: calc(var(--vu) * 16); }
    .event-card { height: calc(var(--vu) * 84); }
    .event-card-inner { position: relative; width: 100%; height: 100%; background: linear-gradient(160deg, #1c1a17 0%, #100e0c 100%); display: flex; align-items: center; gap: calc(var(--vu) * 14); padding: 0 calc(var(--vu) * 16); overflow: hidden; }
    .event-card-inner::before { content: ''; position: absolute; inset: 5px; border: 1px dashed rgba(217,184,114,.22); pointer-events: none; }
    .event-icon { width: calc(var(--vu) * 56); height: calc(var(--vu) * 56); border-radius: 50%; flex: none; background: repeating-radial-gradient(circle, #1a1a1c 0 3px, #0d0d0e 3px 6px); display: flex; align-items: center; justify-content: center; }
    .event-icon.follow { border: 2px solid rgba(255,35,64,.6); box-shadow: 0 0 10px rgba(255,35,64,.35); }
    .event-icon.sub { border: 2px solid rgba(217,184,114,.65); box-shadow: 0 0 10px rgba(217,184,114,.4); }
    .event-icon.bits { border: 2px solid rgba(217,184,114,.65); box-shadow: 0 0 10px rgba(217,184,114,.4); }
    .event-icon span { font-family: 'Anton', sans-serif; }
    .event-icon.follow span { font-size: calc(var(--vu) * 24); color: var(--blood); text-shadow: 0 0 8px rgba(255,35,64,.7); }
    .event-icon.sub span { font-size: calc(var(--vu) * 22); color: #f2c94c; text-shadow: 0 0 8px rgba(242,201,76,.6); }
    .event-icon.bits span { font-size: calc(var(--vu) * 20); color: #f2c94c; text-shadow: 0 0 8px rgba(242,201,76,.6); }
    .event-text { display: flex; flex-direction: column; gap: calc(var(--vu) * 3); min-width: 0; }
    .event-label { font-size: calc(var(--vu) * 11); letter-spacing: 2.5px; color: var(--tan); text-shadow: .5px .5px 0 rgba(255,35,64,.4); }
    .event-value { font-size: calc(var(--vu) * 19); font-weight: 700; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-detail { font-size: calc(var(--vu) * 12); color: rgba(244,241,234,.5); letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

  <div class="widget-position">
    <div class="event-stack">
      <div class="event-card chrome-frame">
        <div class="event-card-inner">
          <div class="event-icon follow"><span>+</span></div>
          <div class="event-text">
            <span class="event-label">LETZTER FOLLOWER</span>
            <span class="event-value" id="followerValue">–</span>
            <span class="event-detail" id="followerDetail">Warte auf ersten Follower...</span>
          </div>
        </div>
      </div>
      <div class="event-card chrome-frame">
        <div class="event-card-inner">
          <div class="event-icon sub"><span>★</span></div>
          <div class="event-text">
            <span class="event-label">LETZTE SUBSPRÜCHE</span>
            <span class="event-value" id="subValue">–</span>
            <span class="event-detail" id="subDetail">Warte auf ersten Sub...</span>
          </div>
        </div>
      </div>
      <div class="event-card chrome-frame">
        <div class="event-card-inner">
          <div class="event-icon bits"><span>€</span></div>
          <div class="event-text">
            <span class="event-label">LETZTE SPENDE</span>
            <span class="event-value" id="bitsValue">–</span>
            <span class="event-detail" id="bitsDetail">Warte auf erste Bits...</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const VERCEL_URL = "https://stream-hub-three-gold.vercel.app";
    const params = new URLSearchParams(location.search);

    function relativeTimeText(ts) {
      const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (diffSec < 60) return 'gerade eben';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return 'vor ' + diffMin + ' Minute' + (diffMin === 1 ? '' : 'n');
      const diffH = Math.floor(diffMin / 60);
      return 'vor ' + diffH + ' Stunde' + (diffH === 1 ? '' : 'n');
    }
    let latestFollowerAt = null;
    function renderFollowerDetail() {
      if (latestFollowerAt) document.getElementById('followerDetail').textContent = relativeTimeText(latestFollowerAt);
    }
    setInterval(renderFollowerDetail, 30000);

    function showLatestFollower(name) {
      document.getElementById('followerValue').textContent = name;
      latestFollowerAt = Date.now();
      renderFollowerDetail();
    }
    function showLatestSub(name, months) {
      document.getElementById('subValue').textContent = name + (months ? ' — Monat ' + months : '');
      document.getElementById('subDetail').textContent = 'Danke fuers Abo!';
    }
    function showLatestBits(name, amount, message) {
      document.getElementById('bitsValue').textContent = name + ' — ' + amount + ' Bits';
      document.getElementById('bitsDetail').textContent = message ? '„' + message + '“' : 'Danke fuer die Bits!';
    }

    // =====================================================================
    // Twitch EventSub (natives WebSocket, 1:1 Verbindungs-/Reconnect-Logik
    // aus overlay.html/in-game.html uebernommen).
    // =====================================================================
    const TWITCH_EVENTSUB_URL = 'wss://eventsub.wss.twitch.tv/ws';
    let reconnectAttempts = 0;
    let reconnectTimer = null;

    function scheduleReconnect(reason) {
      reconnectAttempts += 1;
      const delay = Math.min(30000, 2000 * reconnectAttempts);
      console.log('[EventSub] verbinde neu in ' + (delay / 1000) + 's (' + reason + ')');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => connectTwitchEventSub(), delay);
    }

    async function subscribeToTwitchEvents(sessionId) {
      try {
        const cleanUrl = VERCEL_URL.replace(/\/$/, "");
        const res = await fetch(`${cleanUrl}/api/twitch-eventsub`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });
        const data = await res.json();
        if (!data || !data.success) {
          console.warn('[EventSub] Subscription fehlgeschlagen:', (data && data.message) || 'unbekannt');
          return;
        }
        console.log('[EventSub] verbunden, Events angemeldet.');
      } catch (e) {
        console.warn('[EventSub] Fehler:', e.message || e);
      }
    }

    function handleTwitchNotification(payload) {
      const type = payload.subscription.type;
      const event = payload.event;

      if (type === 'channel.follow') {
        showLatestFollower(event.user_name || 'Zuschauer');
        return;
      }
      if (type === 'channel.subscribe' || type === 'channel.subscription.message') {
        showLatestSub(event.user_name || 'Zuschauer', event.cumulative_months || event.streak_months || null);
        return;
      }
      if (type === 'channel.cheer') {
        showLatestBits(event.is_anonymous ? 'Anonym' : (event.user_name || 'Zuschauer'), event.bits || 0, event.message || '');
        return;
      }
    }

    function connectTwitchEventSub(url, isReconnectHandoff) {
      url = url || TWITCH_EVENTSUB_URL;
      const ws = new WebSocket(url);
      let handoffInProgress = false;

      ws.onopen = () => {};
      ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch (e) { return; }
        const messageType = data.metadata && data.metadata.message_type;

        if (messageType === 'session_welcome') {
          reconnectAttempts = 0;
          if (isReconnectHandoff) return;
          subscribeToTwitchEvents(data.payload.session.id);
          return;
        }
        if (messageType === 'session_keepalive') return;
        if (messageType === 'notification') { handleTwitchNotification(data.payload); return; }
        if (messageType === 'session_reconnect') {
          handoffInProgress = true;
          connectTwitchEventSub(data.payload.session.reconnect_url, true);
          return;
        }
        if (messageType === 'revocation') {
          console.warn('[EventSub] Subscription widerrufen:', data.payload.subscription.type);
          return;
        }
      };
      ws.onerror = () => {};
      ws.onclose = (event) => {
        if (handoffInProgress) return;
        scheduleReconnect(event.reason || `Code ${event.code}`);
      };
    }

    // ---------- Test-Modus (?test=follow|sub|resub|bits) ----------
    function runTestMode() {
      const testParam = params.get('test');
      if (!testParam) return;
      const typeMap = { follow: 'channel.follow', sub: 'channel.subscribe', resub: 'channel.subscription.message', bits: 'channel.cheer', cheer: 'channel.cheer' };
      const type = typeMap[testParam.toLowerCase()];
      if (!type) return;
      const fakeEvent = type === 'channel.cheer' ? { bits: 100, user_name: 'TestCheerer', message: 'Feuer Stream!' } : (type.indexOf('sub') !== -1 ? { user_name: 'TestSubscriber', cumulative_months: 6 } : { user_name: 'TestFollower' });
      handleTwitchNotification({ subscription: { type }, event: fakeEvent });
    }

    connectTwitchEventSub();
    runTestMode();
  </script>

</body>
</html>
