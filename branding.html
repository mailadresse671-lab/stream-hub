<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Branding</title>
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.88);
      --neon-blue: #38bdf8;
      --accent-orange: #f97316;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      /* Fluid-Unit: identische Formel wie goal.html/chat.html/overlay.html/
         in-game.html/start.html - siehe dortigen Kommentar bzw.
         STREAMLABS_SETUP.md fuer die volle Begruendung. */
      --vu: clamp(0.5px, 0.0521vw, 1px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text-primary);
    }

    body { padding: calc(var(--vu) * 18); }

    .brand-position {
      position: fixed;
      bottom: calc(var(--vu) * 18);
      right: calc(var(--vu) * 18);
    }

    .shimmer-frame {
      position: relative;
      border-radius: calc(var(--vu) * 16);
      padding: calc(var(--vu) * 1.5);
      background: linear-gradient(120deg,
        rgba(56, 189, 248, 0.15),
        rgba(56, 189, 248, 0.95),
        rgba(249, 115, 22, 0.65),
        rgba(56, 189, 248, 0.15));
      background-size: 300% 300%;
      animation: shimmer 7s ease-in-out infinite;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .brand-card {
      display: flex;
      align-items: center;
      gap: calc(var(--vu) * 12);
      background: var(--bg-glass);
      backdrop-filter: blur(calc(var(--vu) * 10));
      -webkit-backdrop-filter: blur(calc(var(--vu) * 10));
      border-radius: calc(var(--vu) * 14.5);
      padding: calc(var(--vu) * 10) calc(var(--vu) * 20) calc(var(--vu) * 10) calc(var(--vu) * 12);
    }

    .logo-mark {
      width: calc(var(--vu) * 34);
      height: calc(var(--vu) * 34);
      border-radius: calc(var(--vu) * 10);
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--neon-blue), var(--accent-orange));
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
      flex-shrink: 0;
    }

    .logo-mark span {
      font-size: calc(var(--vu) * 16);
      font-weight: 900;
      color: #0f172a;
      letter-spacing: calc(var(--vu) * -0.5);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-name {
      font-size: calc(var(--vu) * 15);
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: calc(var(--vu) * 0.3);
      white-space: nowrap;
    }

    .brand-name .pipe {
      color: var(--text-muted);
      margin: 0 calc(var(--vu) * 6);
      font-weight: 400;
    }

    .brand-name .live-word {
      color: var(--accent-orange);
    }

    .brand-sub {
      display: flex;
      align-items: center;
      gap: calc(var(--vu) * 5);
      margin-top: calc(var(--vu) * 2);
    }

    .live-dot {
      width: calc(var(--vu) * 6);
      height: calc(var(--vu) * 6);
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 7px var(--danger);
      animation: pulse 1.8s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.75); }
    }

    .brand-sub-text {
      font-size: calc(var(--vu) * 8.5);
      font-weight: 800;
      letter-spacing: calc(var(--vu) * 1.4);
      color: var(--neon-blue);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="brand-position">
    <div class="shimmer-frame">
      <div class="brand-card">
        <div class="logo-mark"><span>D</span></div>
        <div class="brand-text">
          <span class="brand-name">DaN<span class="pipe">|</span><span class="live-word">LIVE STREAM</span></span>
          <span class="brand-sub">
            <span class="live-dot"></span>
            <span class="brand-sub-text">On Air</span>
          </span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
