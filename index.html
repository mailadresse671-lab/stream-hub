<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL Session Stats</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      padding: 10px;
    }

    .rl-container {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 4px solid #f97316;
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }

    .brand-section {
      display: flex;
      flex-direction: column;
    }

    .tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #22c55e;
      text-transform: uppercase;
    }

    .title {
      font-size: 17px;
      font-weight: 900;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .divider {
      width: 1px;
      height: 32px;
      background: rgba(255, 255, 255, 0.2);
    }

    .stats-group {
      display: flex;
      gap: 16px;
    }

    .stat-box {
      text-align: center;
      min-width: 45px;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .stat-lbl {
      font-size: 9px;
      margin-top: 4px;
      color: #cbd5e1;
      text-transform: uppercase;
      font-weight: 700;
    }

    .val-win { color: #22c55e; }
    .val-loss { color: #ef4444; }
    .val-rate { color: #fbbf24; }
  </style>
</head>
<body>

  <div class="rl-container">
    <div class="brand-section">
      <span class="tag">Live Steuerung 🟢</span>
      <span class="title">Session Stats</span>
    </div>

    <div class="divider"></div>

    <div class="stats-group">
      <div class="stat-box">
        <div class="stat-val val-win" id="wins">0</div>
        <div class="stat-lbl">Wins</div>
      </div>
      <div class="stat-box">
        <div class="stat-val val-loss" id="losses">0</div>
        <div class="stat-lbl">Losses</div>
      </div>
      <div class="stat-box">
        <div class="stat-val val-rate" id="winrate">0%</div>
        <div class="stat-lbl">Win Rate</div>
      </div>
    </div>
  </div>

  <script>
    // STREAMLABS SOCKET TOKEN (FEST EINGEBAUT)
    const STREAMLABS_SOCKET_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ0b2tlbiI6IjIxQTMzN0NEMzEzQkNEQTE5MzU4MzVDNDIzM0EzMDQ0ODJEQzY5MjFDQzgwMTU4OUVDMzgzRUEwMzMwM0M2NTMyODVDOEI3MTIxQzQ0MEVGQkMwMjM3N0Y1Q0Q1QUUxRDRFQ0FBRjQ5QzFERkU4OUQyOTk0OUVDNDU5NjQxODA4RTRFNkNBMzQ1MkIwNkQwMzFFMDZEOThGQkEzRjZEMUI2MDBEOEI1NDBDRjlBNEMzNTRFQ0ZGQUJFQ0Y1RTkwRTdCMEI3MjFFRkJEQkU4REUxNDZBNkE2NURCNDc0ODQyMjhGRDcxQzIzNkYxRTAxQkFFRDJEQTlENUQiLCJyZWFkX29ubHkiOnRydWUsInByZXZlbnRfbWFzdGVyIjp0cnVlLCJ0d2l0Y2hfaWQiOiI3ODU4ODc3MzUifQ.TnmJmgYgJ3RxNuxibF2SsTGkeChRxbTxfYsiZGbc9gk";

    let sessionWins = 0;
    let sessionLosses = 0;

    function updateUI() {
      document.getElementById('wins').innerText = sessionWins;
      document.getElementById('losses').innerText = sessionLosses;

      let rate = 0;
      const total = sessionWins + sessionLosses;
      if (total > 0) {
        rate = Math.round((sessionWins / total) * 100);
      }
      document.getElementById('winrate').innerText = rate + '%';
    }

    updateUI();

    if (STREAMLABS_SOCKET_TOKEN) {
      const socket = io(`https://sockets.streamlabs.com?token=${STREAMLABS_SOCKET_TOKEN}`, { transports: ['websocket'] });

      socket.on('event', (eventData) => {
        // Dashboard "Subscription testen" -> Win +1
        if (eventData.type === 'subscription') {
          sessionWins++;
          updateUI();
        }
        // Dashboard "Donation testen" -> Loss +1
        else if (eventData.type === 'donation') {
          sessionLosses++;
          updateUI();
        }
        // Dashboard "Bits testen" -> Reset (0/0)
        else if (eventData.type === 'bits') {
          sessionWins = 0;
          sessionLosses = 0;
          updateUI();
        }
      });
    }
  </script>

</body>
</html>
