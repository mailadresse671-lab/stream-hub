<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL Session Stats</title>
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.88);
      --neon-blue: #38bdf8;
      --accent-orange: #f97316;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text-primary);
    }

    body {
      padding: 18px;
    }

    .widget-position {
      position: fixed;
      top: 18px;
      left: 18px;
    }

    .shimmer-frame {
      position: relative;
      border-radius: 16px;
      padding: 1.5px;
      background: linear-gradient(120deg,
        rgba(56, 189, 248, 0.15),
        rgba(56, 189, 248, 0.95),
        rgba(249, 115, 22, 0.65),
        rgba(56, 189, 248, 0.15));
      background-size: 300% 300%;
      animation: shimmer 7s ease-in-out infinite;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 14.5px;
      padding: 12px 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }

    .live-dot.status-live {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .live-dot.status-cached {
      background: var(--warning);
      box-shadow: 0 0 8px var(--warning);
    }

    .live-dot.status-offline {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.75); }
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .eyebrow {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.6px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .eyebrow.status-live { color: var(--success); }
    .eyebrow.status-cached { color: var(--warning); }
    .eyebrow.status-offline { color: var(--danger); }

    .title {
      font-size: 16px;
      font-weight: 900;
      color: var(--neon-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 30px;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.22), transparent);
    }

    .stats {
      display: flex;
      gap: 18px;
    }

    .stat {
      text-align: center;
      min-width: 44px;
    }

    .stat .value {
      display: block;
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat .label {
      display: block;
      font-size: 8.5px;
      margin-top: 5px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    .val-win { color: var(--success); }
    .val-loss { color: var(--danger); }
    .val-rate { color: var(--warning); }

    /* Rang/MMR-HUD - nur sichtbar, wenn api/stats.js verwertbare Rang-
       Daten liefert (siehe fetchStats), sonst bleibt es einfach versteckt
       statt kaputte Werte zu zeigen. */
    .rank {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rank-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .rank-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .rank-tier {
      font-size: 12px;
      font-weight: 800;
      color: var(--neon-blue);
      white-space: nowrap;
    }

    .rank-mmr {
      font-size: 8.5px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>

  <div class="widget-position">
    <div class="shimmer-frame">
      <div class="card">
        <div class="brand">
          <span class="live-dot" id="statusDot"></span>
          <div class="brand-text">
            <span class="eyebrow" id="statusLabel">Connecting…</span>
            <span class="title">Session Stats</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="stats">
          <div class="stat">
            <span class="value val-win" id="wins">0</span>
            <span class="label">Wins</span>
          </div>
          <div class="stat">
            <span class="value val-loss" id="losses">0</span>
            <span class="label">Losses</span>
          </div>
          <div class="stat">
            <span class="value val-rate" id="winrate">0%</span>
            <span class="label">Win Rate</span>
          </div>
        </div>

        <div class="divider" id="rankDivider" style="display: none;"></div>

        <div class="rank" id="rankBlock" style="display: none;">
          <img class="rank-icon" id="rankIcon" src="" alt="" onerror="this.style.display='none';">
          <div class="rank-text">
            <span class="rank-tier" id="rankTier">-</span>
            <span class="rank-mmr" id="rankMmr">-</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DEINE FESTE VERCEL-CLOUD ADRESSE
    const VERCEL_URL = "https://stream-hub-three-gold.vercel.app";
    const STATS_URL_PARAMS = new URLSearchParams(location.search);
    const RL_MODE = (STATS_URL_PARAMS.get('rlMode') || 'auto').trim().toLowerCase();
    const RL_PLAYLIST = (STATS_URL_PARAMS.get('rlPlaylist') || '').trim();

    let startWins = null;
    let startMatches = null;
    let sessionWins = 0;
    let sessionLosses = 0;

    function updateUI() {
      document.getElementById('wins').innerText = sessionWins;
      document.getElementById('losses').innerText = sessionLosses;

      let rate = 0;
      const total = sessionWins + sessionLosses;
      if (total > 0) {
        rate = Math.round((sessionWins / total) * 100);
      }
      document.getElementById('winrate').innerText = rate + '%';
    }

    function updateRankDisplay(rank) {
      const divider = document.getElementById('rankDivider');
      const block = document.getElementById('rankBlock');

      if (!rank) {
        divider.style.display = 'none';
        block.style.display = 'none';
        return;
      }

      document.getElementById('rankIcon').style.display = '';
      document.getElementById('rankIcon').src = rank.tierIconUrl || '';
      document.getElementById('rankIcon').alt = rank.tierName;
      document.getElementById('rankTier').innerText = rank.tierName;
      document.getElementById('rankMmr').innerText = rank.mmr != null ? `${rank.mmr} MMR` : rank.playlist;
      divider.style.display = '';
      block.style.display = '';
    }

    function setStatus(status) {
      // status: 'live' | 'cached' | 'offline'
      const dot = document.getElementById('statusDot');
      const label = document.getElementById('statusLabel');
      const labels = { live: 'Live', cached: 'Cached', offline: 'Offline' };

      dot.className = 'live-dot status-' + status;
      label.className = 'eyebrow status-' + status;
      label.innerText = labels[status] || 'Connecting…';
    }

    async function fetchStats() {
      try {
        const cleanUrl = VERCEL_URL.replace(/\/$/, "");
        const apiParams = new URLSearchParams();
        if (RL_MODE) apiParams.set('mode', RL_MODE);
        if (RL_PLAYLIST) apiParams.set('playlist', RL_PLAYLIST);
        const apiUrl = `${cleanUrl}/api/stats${apiParams.toString() ? `?${apiParams.toString()}` : ''}`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (data && data.success) {
          setStatus(data.stale ? 'cached' : 'live');
          updateRankDisplay(data.rank);

          const currentWins = data.wins;
          const currentMatches = data.matches;

          // Erste Abfrage beim Laden als Basiswert festlegen
          if (startWins === null) {
            startWins = currentWins;
            startMatches = currentMatches;
          } else {
            sessionWins = Math.max(0, currentWins - startWins);
            const totalSessionMatches = Math.max(0, currentMatches - startMatches);
            sessionLosses = Math.max(0, totalSessionMatches - sessionWins);
            updateUI();
          }
        } else {
          setStatus('offline');
        }
      } catch (e) {
        setStatus('offline');
        console.log("Cloud Fetch aktiv...");
      }
    }

    // Sofort abfragen
    fetchStats();

    // Alle 20 Sekunden vollautomatisch aktualisieren
    setInterval(fetchStats, 20000);
  </script>

</body>
</html>
