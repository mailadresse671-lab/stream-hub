<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL Session Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      padding: 10px;
    }

    .rl-container {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 4px solid #f97316;
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }

    .brand-section {
      display: flex;
      flex-direction: column;
    }

    .tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .title {
      font-size: 17px;
      font-weight: 900;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .divider {
      width: 1px;
      height: 32px;
      background: rgba(255, 255, 255, 0.2);
    }

    .stats-group {
      display: flex;
      gap: 16px;
    }

    .stat-box {
      text-align: center;
      min-width: 45px;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .stat-lbl {
      font-size: 9px;
      margin-top: 4px;
      color: #cbd5e1;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .val-win { color: #22c55e; }
    .val-loss { color: #ef4444; }
    .val-rate { color: #fbbf24; }
  </style>
</head>
<body>

  <div class="rl-container">
    <div class="brand-section">
      <span class="tag">Live Stream</span>
      <span class="title">Session Stats</span>
    </div>

    <div class="divider"></div>

    <div class="stats-group">
      <div class="stat-box">
        <div class="stat-val val-win" id="wins">0</div>
        <div class="stat-lbl">Wins</div>
      </div>
      <div class="stat-box">
        <div class="stat-val val-loss" id="losses">0</div>
        <div class="stat-lbl">Losses</div>
      </div>
      <div class="stat-box">
        <div class="stat-val val-rate" id="winrate">0%</div>
        <div class="stat-lbl">Win Rate</div>
      </div>
    </div>

  </div>

</body>
</html>
