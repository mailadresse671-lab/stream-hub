<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL Session Overlay</title>
  <!-- Korrigierter & zuverlässiger CDN-Link für tmi.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tmi.js/1.8.5/tmi.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      padding: 10px;
      user-select: none;
    }

    .rl-container {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 4px solid #f97316;
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    .brand-section {
      display: flex;
      flex-direction: column;
    }

    .tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .title {
      font-size: 17px;
      font-weight: 900;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .divider {
      width: 1px;
      height: 32px;
      background: rgba(255, 255, 255, 0.2);
    }

    .stats-group {
      display: flex;
      gap: 16px;
    }

    .stat-box {
      text-align: center;
      min-width: 45px;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .stat-lbl {
      font-size: 9px;
      margin-top: 4px;
      color: #cbd5e1;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .val-win { color: #22c55e; }
    .val-loss { color: #ef4444; }
    .val-rate { color: #fbbf24; }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="rl-container" onclick="testClick()">
    <div class="brand-section">
      <span class="tag">Live Stream <span class="status-dot" id="statusDot"></span></span>
      <span class="title">Session Stats</span>
    </div>

    <div class="divider"></div>

    <div class="stats-group">
      <div class="stat-box">
        <div class="stat-val val-win" id="wins">0</div>
        <div class="stat-lbl">Wins</div>
      </div>
      <div class="stat-box">
        <div class="stat-val val-loss" id="losses">0</div>
        <div class="stat-lbl">Losses</div>
      </div>
      <div class="stat-box">
        <div class="stat-val val-rate" id="winrate">0%</div>
        <div class="stat-lbl">Win Rate</div>
      </div>
    </div>
  </div>

  <script>
    const CHANNEL_NAME = "dangsxr1000"; 
    const PLAYER_NAME = "DaNgsxR"; 

    let sessionWins = 0;
    let sessionLosses = 0;

    function updateUI() {
      document.getElementById('wins').innerText = sessionWins;
      document.getElementById('losses').innerText = sessionLosses;

      let rate = 0;
      const total = sessionWins + sessionLosses;
      if (total > 0) {
        rate = Math.round((sessionWins / total) * 100);
      }
      document.getElementById('winrate').innerText = rate + '%';
    }

    // Touch/Klick Test-Funktion für Streamlabs Editor
    function testClick() {
      sessionWins++;
      updateUI();
    }

    // TWITCH CHAT ANBINDUNG
    try {
      if (window.tmi) {
        const client = new tmi.Client({
          connection: { secure: true, reconnect: true },
          channels: [ CHANNEL_NAME.toLowerCase().trim() ]
        });

        client.connect().catch(console.error);

        client.on('message', (channel, tags, message, self) => {
          const cmd = message.trim().toLowerCase();

          if (cmd === '!win' || cmd === '!w') {
            sessionWins++;
            updateUI();
          } 
          if (cmd === '!loss' || cmd === '!l') {
            sessionLosses++;
            updateUI();
          } 
          if (cmd === '!reset') {
            sessionWins = 0;
            sessionLosses = 0;
            updateUI();
          }
        });
      }
    } catch (e) {
      console.log("Chat-Verbindung Standby", e);
    }

    // TRACKER.GG AUTOMATISCHER FETCH
    let startWins = null;
    let startMatches = null;

    async function fetchStats() {
      try {
        const url = `https://corsproxy.io/?https://api.tracker.gg/api/v2/rocket-league/standard/profile/epic/${encodeURIComponent(PLAYER_NAME)}`;
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();

        if (data && data.data && data.data.segments) {
          const overview = data.data.segments.find(s => s.type === 'overview');
          if (overview && overview.stats) {
            const currentWins = overview.stats.wins ? overview.stats.wins.value : 0;
            const currentMatches = overview.stats.matchesPlayed ? overview.stats.matchesPlayed.value : 0;

            if (startWins === null) {
              startWins = currentWins;
              startMatches = currentMatches;
            } else {
              const apiWins = Math.max(0, currentWins - startWins);
              const apiMatches = Math.max(0, currentMatches - startMatches);
              const apiLosses = Math.max(0, apiMatches - apiWins);

              if (apiWins > sessionWins || apiLosses > sessionLosses) {
                sessionWins = apiWins;
                sessionLosses = apiLosses;
                updateUI();
              }
            }
          }
        }
      } catch (err) {
        // Stille Fehlertoleranz
      }
    }

    fetchStats();
    setInterval(fetchStats, 30000);
  </script>

</body>
</html>
