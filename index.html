<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL Session Overlay</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tmi.js/1.8.5/tmi.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      padding: 10px;
    }

    .rl-container {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 4px solid #f97316;
      border-radius: 12px;
      padding: 12px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }

    .brand-section {
      display: flex;
      flex-direction: column;
    }

    .tag {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .title {
      font-size: 16px;
      font-weight: 900;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .status-text {
      font-size: 8px;
      color: #e2e8f0;
      margin-top: 2px;
      font-weight: 700;
    }

    .divider {
      width: 1px;
      height: 32px;
      background: rgba(255, 255, 255, 0.2);
    }

    .stats-group {
      display: flex;
      gap: 14px;
    }

    .stat-box {
      text-align: center;
      min-width: 40px;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .stat-lbl {
      font-size: 9px;
      margin-top: 4px;
      color: #cbd5e1;
      text-transform: uppercase;
      font-weight: 700;
    }

    .val-win { color: #22c55e; }
    .val-loss { color: #ef4444; }
    .val-rate { color: #fbbf24; }
  </style>
</head>
<body>

  <div class="rl-container">
    <div class="brand-section">
      <span class="tag">Live Stream</span>
      <span class="title">Session Stats</span>
      <span class="status-text" id="statusLabel">Chat: Verbinde...</span>
    </div>

    <div class="divider"></div>

    <div class="stats-group">
      <div class="stat-box">
        <div class="stat-val val-win" id="wins">0</div>
        <div class="stat-lbl">Wins</div>
      </div>
      <div class="stat-box">
        <div class="stat-val val-loss" id="losses">0</div>
        <div class="stat-lbl">Losses</div>
      </div>
      <div class="stat-box">
        <div class="stat-val val-rate" id="winrate">0%</div>
        <div class="stat-lbl">Win Rate</div>
      </div>
    </div>
  </div>

  <script>
    const CHANNEL_NAME = "dangsxr1000"; 

    let sessionWins = 0;
    let sessionLosses = 0;

    function updateUI() {
      document.getElementById('wins').innerText = sessionWins;
      document.getElementById('losses').innerText = sessionLosses;

      let rate = 0;
      const total = sessionWins + sessionLosses;
      if (total > 0) {
        rate = Math.round((sessionWins / total) * 100);
      }
      document.getElementById('winrate').innerText = rate + '%';
    }

    const statusLbl = document.getElementById('statusLabel');

    // TWITCH CHAT ANBINDUNG (Verlässlich & Leichtgewichtig)
    const client = new tmi.Client({
      options: { debug: false },
      connection: { secure: true, reconnect: true },
      channels: [ CHANNEL_NAME.toLowerCase().trim() ]
    });

    client.connect().then(() => {
      statusLbl.innerText = "Chat: Online 🟢";
      statusLbl.style.color = "#22c55e";
    }).catch((err) => {
      statusLbl.innerText = "Chat: Fehler 🔴";
      statusLbl.style.color = "#ef4444";
    });

    client.on('message', (channel, tags, message, self) => {
      const cmd = message.trim().toLowerCase();

      if (cmd === '!win' || cmd === '!w') {
        sessionWins++;
        updateUI();
      } 
      else if (cmd === '!loss' || cmd === '!l') {
        sessionLosses++;
        updateUI();
      } 
      else if (cmd === '!reset') {
        sessionWins = 0;
        sessionLosses = 0;
        updateUI();
      }
    });
  </script>

</body>
</html>
