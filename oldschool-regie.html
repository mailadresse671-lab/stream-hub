<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Oldschool Regie</title>
  <style>
    :root {
      --bg: #070709;
      --fg: #f4f4f6;
      --muted: #b4b6bf;
      --blood: #c8102e;
      --line: rgba(255,255,255,.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      color: var(--fg);
      font-family: Arial, sans-serif;
      background:
        radial-gradient(900px 600px at 12% -10%, rgba(200,16,46,.2), transparent 60%),
        radial-gradient(1000px 700px at 90% 120%, rgba(255,255,255,.08), transparent 60%),
        var(--bg);
    }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .card {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(18,18,24,.95), rgba(9,9,13,.95));
      box-shadow: 0 10px 34px rgba(0,0,0,.35), inset 0 0 0 1px rgba(200,16,46,.18);
      padding: 18px;
      text-align: center;
    }
    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }
    p {
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 14px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      width: 100%;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 12px;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(180deg, rgba(200,16,46,.85), rgba(143,12,34,.95));
      margin-bottom: 10px;
    }
    .link {
      color: var(--muted);
      font-size: 14px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Regie wird geladen</h1>
    <p>Du wirst automatisch auf das Live Deck weitergeleitet, damit du nur noch eine zentrale Steuerseite auf dem Handy hast.</p>
    <a class="btn" href="/oldschool-live.html">Jetzt zum Live Deck</a>
    <a class="link" href="/oldschool-studio.html">Studio Console oeffnen</a>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get('studio') === '1' ? '/oldschool-studio.html' : '/oldschool-live.html';
    location.replace(target);
  </script>
</body>
</html>
