<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>90s Old School — Just Chatting</title>
  <!-- F2 aus der "DaNgsxr1000 Stream Overlay Suite" (siehe oldschool-starting.html
       fuer die volle Herkunfts-/Format-/Styleguide-Dokumentation - identisches
       Vorgehen, hier nicht wiederholt).

       Transparentes Overlay (anders als oldschool-starting.html/-brb.html/
       -outro.html, die als Ersatz-Szenen einen echten Hintergrund haben) -
       liegt ueber Facecam + Rocket-League-Ausschnitt, die als GETRENNTE
       Streamlabs-Quellen UNTER dieser Browser-Quelle liegen. Die Rahmen um
       Facecam/RL-Box sind reine Deko-Umrandung, der Innenbereich bleibt
       bewusst komplett transparent (kein Platzhalter-Fill), damit die
       echte Kamera/Spielaufnahme darunter unverfaelscht durchscheint - exakt
       das Prinzip, das im Bundle selbst erklaert wird ("Match the visual
       output; don't copy the prototype's internal structure" - die
       <image-slot>-Platzhalter sind keine Dinge, die dieses HTML zeichnet).

       Was echt ist: "LATEST FOLLOWER" (api/twitch-followers.js, bereits
       vorhandenes latestFollower-Feld, kein neuer Server-Code), Sub-Ziel-
       Fortschrittsbalken (neue api/twitch-subs.js, Zielwert per ?subgoal=,
       Default 100), Chat-Box (eigene tmi.js-Verbindung, XSS-sicheres
       Escaping + Emote-Rendering nach dem etablierten Muster aus chat.html),
       Alert-Popup (echte EventSub-Verbindung). Facecam-/RL-Rahmen + LIVE/
       FRESH-Sticker sind reine Deko. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&family=Permanent+Marker&family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/assets/js/tmi-loader.js"></script>
  <style>
    :root {
      --ink: #000000;
      --paper: #FFFFFF;
      --cream: #E5E5E5;
      --crimson: #C8102E;
      --crimson-dark: #8C0A1F;
      --vu: clamp(0.5px, 0.0521vw, 1px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Barlow Condensed', sans-serif; color: var(--cream); background: transparent; }

    @keyframes flicker { 0%, 100% { opacity: .04; } 50% { opacity: .09; } }
    @keyframes alertPop { 0% { transform: translateY(calc(var(--vu) * -30)) scale(.9); opacity: 0; } 60% { transform: translateY(calc(var(--vu) * 4)) scale(1.03); opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes chatSlideIn { 0% { transform: translateY(calc(var(--vu) * 16)); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    #stage { position: fixed; inset: 0; overflow: hidden; }

    .scanline-overlay { position: absolute; inset: 0; z-index: 90; pointer-events: none; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0px, rgba(0,0,0,.16) 1px, transparent 2px, transparent 4px); mix-blend-mode: multiply; }
    .flicker-overlay { position: absolute; inset: 0; z-index: 91; pointer-events: none; background: #fff; animation: flicker 5s ease-in-out infinite; mix-blend-mode: overlay; }

    .follower-badge { position: absolute; left: calc(var(--vu) * 110); top: calc(var(--vu) * 80); font-weight: 700; font-size: calc(var(--vu) * 22); color: var(--ink); background: var(--cream); padding: calc(var(--vu) * 10) calc(var(--vu) * 20); border-radius: calc(var(--vu) * 8); white-space: nowrap; z-index: 6; }
    .follower-badge .name { color: var(--crimson-dark); }

    .subgoal-box { position: absolute; left: calc(var(--vu) * 110); top: calc(var(--vu) * 150); width: calc(var(--vu) * 760); z-index: 6; }
    .subgoal-row { display: flex; justify-content: space-between; font-weight: 700; font-size: calc(var(--vu) * 20); color: var(--paper); letter-spacing: 2px; margin-bottom: calc(var(--vu) * 6); white-space: nowrap; }
    .subgoal-track { width: 100%; height: calc(var(--vu) * 26); background: rgba(0,0,0,.5); border-radius: 999px; overflow: hidden; border: calc(var(--vu) * 2) solid var(--paper); }
    .subgoal-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--crimson), var(--paper)); border-radius: 999px; transition: width .4s ease; }

    .facecam-box { position: absolute; left: calc(var(--vu) * 110); top: calc(var(--vu) * 230); width: calc(var(--vu) * 680); height: calc(var(--vu) * 560); z-index: 5; }
    .facecam-frame { position: absolute; inset: 0; border-radius: calc(var(--vu) * 18); padding: calc(var(--vu) * 10); background: linear-gradient(135deg, var(--paper), var(--crimson)); box-shadow: 0 calc(var(--vu) * 24) calc(var(--vu) * 60) rgba(0,0,0,.55); }
    .facecam-slot { position: relative; width: 100%; height: 100%; border-radius: calc(var(--vu) * 12); overflow: hidden; background: transparent; }
    .sticker-live { position: absolute; top: calc(var(--vu) * -18); left: calc(var(--vu) * -22); transform: rotate(-12deg); font-family: 'Permanent Marker', cursive; font-size: calc(var(--vu) * 24); color: var(--ink); background: var(--paper); padding: calc(var(--vu) * 6) calc(var(--vu) * 16); border-radius: calc(var(--vu) * 6); box-shadow: calc(var(--vu) * 4) calc(var(--vu) * 4) 0 rgba(0,0,0,.4); }
    .sticker-fresh { position: absolute; bottom: calc(var(--vu) * -16); right: calc(var(--vu) * -18); transform: rotate(8deg); font-family: 'Permanent Marker', cursive; font-size: calc(var(--vu) * 19); color: var(--cream); background: var(--crimson-dark); padding: calc(var(--vu) * 6) calc(var(--vu) * 14); border-radius: calc(var(--vu) * 6); box-shadow: calc(var(--vu) * 4) calc(var(--vu) * 4) 0 rgba(0,0,0,.4); }

    .rl-box { position: absolute; left: calc(var(--vu) * 110); top: calc(var(--vu) * 812); width: calc(var(--vu) * 340); z-index: 5; }
    .rl-label { font-weight: 700; font-size: calc(var(--vu) * 18); color: var(--ink); background: var(--paper); display: inline-block; padding: calc(var(--vu) * 4) calc(var(--vu) * 14); border-radius: calc(var(--vu) * 6) calc(var(--vu) * 6) 0 0; white-space: nowrap; }
    .rl-slot { width: calc(var(--vu) * 340); height: calc(var(--vu) * 190); border-radius: 0 calc(var(--vu) * 12) calc(var(--vu) * 12) calc(var(--vu) * 12); overflow: hidden; border: calc(var(--vu) * 3) solid var(--paper); background: transparent; }

    .chat-box { position: absolute; left: calc(var(--vu) * 1300); top: calc(var(--vu) * 70); width: calc(var(--vu) * 560); height: calc(var(--vu) * 760); display: flex; flex-direction: column; border-radius: calc(var(--vu) * 16); overflow: hidden; box-shadow: 0 calc(var(--vu) * 24) calc(var(--vu) * 60) rgba(0,0,0,.5); border: calc(var(--vu) * 3) solid var(--paper); z-index: 6; }
    .chat-header { background: var(--paper); color: var(--ink); font-family: 'Rubik Spray Paint', cursive; font-size: calc(var(--vu) * 22); padding: calc(var(--vu) * 16) calc(var(--vu) * 24); white-space: nowrap; }
    .chat-body { flex: 1; background: rgba(0,0,0,.86); padding: calc(var(--vu) * 20); display: flex; flex-direction: column; gap: calc(var(--vu) * 14); overflow: hidden; }
    .chat-msg { display: flex; gap: calc(var(--vu) * 10); align-items: baseline; font-size: calc(var(--vu) * 24); animation: chatSlideIn .35s ease-out; }
    .chat-msg .user { font-weight: 700; white-space: nowrap; }
    .chat-msg .text { color: var(--cream); word-break: break-word; }
    .chat-emote { height: calc(var(--vu) * 24); vertical-align: middle; }
    .u-gold { color: #FFFFFF; }
    .u-crimson { color: #E24444; }
    .u-cream { color: #E5E5E5; }
    .u-teal { color: #AFAFAF; }

    .alert-card { position: absolute; top: calc(var(--vu) * 70); right: calc(var(--vu) * 70); width: calc(var(--vu) * 520); background: #000000; border-radius: calc(var(--vu) * 16); padding: calc(var(--vu) * 26) calc(var(--vu) * 30); display: none; align-items: center; gap: calc(var(--vu) * 20); border: calc(var(--vu) * 3) solid var(--alert-accent, #FFFFFF); box-shadow: 0 0 0 calc(var(--vu) * 6) rgba(0,0,0,.35), 0 calc(var(--vu) * 18) calc(var(--vu) * 40) rgba(0,0,0,.5), 0 0 calc(var(--vu) * 46) var(--alert-accent, #FFFFFF); z-index: 80; }
    .alert-card.visible { display: flex; animation: alertPop .5s cubic-bezier(.2,1.4,.4,1); }
    .alert-card.alert-follow { --alert-accent: #FFFFFF; }
    .alert-card.alert-sub { --alert-accent: #C8102E; }
    .alert-card.alert-donation { --alert-accent: #AFAFAF; }
    .alert-icon { font-size: calc(var(--vu) * 52); }
    .alert-title { font-family: 'Rubik Spray Paint', cursive; font-size: calc(var(--vu) * 22); color: #E5E5E5; }
    .alert-subtext { font-weight: 600; font-size: calc(var(--vu) * 22); color: #FFFFFF; margin-top: calc(var(--vu) * 4); }
  </style>
</head>
<body>

  <div id="stage">
    <div class="follower-badge">🎤 LATEST FOLLOWER: <span class="name" id="followerName">…</span></div>

    <div class="subgoal-box">
      <div class="subgoal-row"><span>SUB GOAL</span><span id="subgoalCounter">– / –</span></div>
      <div class="subgoal-track"><div class="subgoal-fill" id="subgoalFill"></div></div>
    </div>

    <div class="facecam-box">
      <div class="facecam-frame">
        <div class="facecam-slot"></div>
      </div>
      <div class="sticker-live">LIVE</div>
      <div class="sticker-fresh">FRESH ✓</div>
    </div>

    <div class="rl-box">
      <div class="rl-label">🎮 ROCKET LEAGUE</div>
      <div class="rl-slot"></div>
    </div>

    <div class="chat-box">
      <div class="chat-header">💬 LIVE CHAT</div>
      <div class="chat-body" id="chatBody"></div>
    </div>

    <div class="scanline-overlay"></div>
    <div class="flicker-overlay"></div>

    <div class="alert-card" id="alertCard">
      <div class="alert-icon" id="alertIcon"></div>
      <div>
        <div class="alert-title" id="alertTitle"></div>
        <div class="alert-subtext" id="alertSubtext"></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const VERCEL_URL = "https://stream-hub-three-gold.vercel.app";
    const CHANNEL_LOGIN = 'dangsxr1000';

    // ---------- Latest Follower (echt, api/twitch-followers.js) ----------
    const followerNameEl = document.getElementById('followerName');
    async function loadLatestFollower() {
      try {
        const res = await fetch(`${VERCEL_URL}/api/twitch-followers`);
        const data = await res.json();
        if (data && data.success && data.latestFollower && data.latestFollower.name) {
          followerNameEl.textContent = data.latestFollower.name;
        } else {
          followerNameEl.textContent = '–';
        }
      } catch (e) {
        followerNameEl.textContent = '–';
      }
    }
    loadLatestFollower();

    // ---------- Sub-Ziel-Fortschrittsbalken (echt, neue api/twitch-subs.js, Ziel per ?subgoal=) ----------
    const subgoalParam = parseInt(params.get('subgoal'), 10);
    const subGoal = (isFinite(subgoalParam) && subgoalParam > 0) ? subgoalParam : 100;
    const subgoalCounterEl = document.getElementById('subgoalCounter');
    const subgoalFillEl = document.getElementById('subgoalFill');
    async function loadSubTotal() {
      try {
        const res = await fetch(`${VERCEL_URL}/api/twitch-subs`);
        const data = await res.json();
        if (data && data.success && typeof data.total === 'number') {
          const pct = Math.max(0, Math.min(100, Math.round((data.total / subGoal) * 100)));
          subgoalCounterEl.textContent = data.total + ' / ' + subGoal;
          subgoalFillEl.style.width = pct + '%';
        } else {
          subgoalCounterEl.textContent = '– / ' + subGoal;
        }
      } catch (e) {
        subgoalCounterEl.textContent = '– / ' + subGoal;
      }
    }
    loadSubTotal();
    setInterval(loadSubTotal, 60000);

    // ---------- Chat (echt, eigene tmi.js-Verbindung, XSS-sicheres Escaping + Emotes) ----------
    const chatBody = document.getElementById('chatBody');
    const MAX_CHAT_MESSAGES = 8;
    const CHAT_MSG_LIFETIME_MS = 15000;
    const CHAT_USER_COLORS = ['u-gold', 'u-crimson', 'u-cream', 'u-teal'];
    let chatColorIdx = 0;

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMessageHtml(message, emotesTag) {
      if (!emotesTag || Object.keys(emotesTag).length === 0) {
        return escapeHtml(message);
      }
      const ranges = [];
      for (const id in emotesTag) {
        emotesTag[id].forEach(pos => {
          const [start, end] = pos.split('-').map(Number);
          ranges.push({ id, start, end });
        });
      }
      ranges.sort((a, b) => a.start - b.start);
      let html = '';
      let cursor = 0;
      ranges.forEach(({ id, start, end }) => {
        if (start < cursor) return;
        if (start > cursor) html += escapeHtml(message.slice(cursor, start));
        const code = message.slice(start, end + 1);
        const src = `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(id)}/default/dark/2.0`;
        html += `<img class="chat-emote" src="${src}" alt="${escapeHtml(code)}" title="${escapeHtml(code)}" draggable="false">`;
        cursor = end + 1;
      });
      if (cursor < message.length) html += escapeHtml(message.slice(cursor));
      return html;
    }

    function addChatMessage(username, text, colorClass, emotesTag) {
      const row = document.createElement('div');
      row.className = 'chat-msg';
      row.innerHTML = `<span class="user ${colorClass}">${escapeHtml(username)}:</span><span class="text">${renderMessageHtml(text, emotesTag)}</span>`;
      chatBody.appendChild(row);
      while (chatBody.children.length > MAX_CHAT_MESSAGES) {
        chatBody.removeChild(chatBody.firstChild);
      }
      setTimeout(() => { if (row.parentNode === chatBody) chatBody.removeChild(row); }, CHAT_MSG_LIFETIME_MS);
    }

    loadTmiWithFallback(function () {
      try {
        const client = new tmi.Client({
          options: { debug: false },
          connection: { secure: true, reconnect: true },
          channels: [CHANNEL_LOGIN]
        });
        client.connect().catch(err => console.warn('[Chat] Verbindungsfehler:', err));
        client.on('message', (channel, tags, message, self) => {
          const colorClass = CHAT_USER_COLORS[chatColorIdx % CHAT_USER_COLORS.length];
          chatColorIdx++;
          addChatMessage(tags['display-name'] || tags.username, message, colorClass, tags.emotes);
        });
      } catch (e) {
        console.warn('[Chat] tmi.js nicht verfuegbar:', e.message);
      }
    }, function () {
      console.warn('[Chat] tmi.js konnte von keiner Quelle geladen werden.');
    });

    // ---------- Alert-Popup (Follow/Sub/Donation, identisches Muster in allen 5 Szenen) ----------
    const alertCard = document.getElementById('alertCard');
    const alertIconEl = document.getElementById('alertIcon');
    const alertTitleEl = document.getElementById('alertTitle');
    const alertSubtextEl = document.getElementById('alertSubtext');
    let alertHideTimer = null;
    function showAlert(kind, icon, title, sub) {
      clearTimeout(alertHideTimer);
      alertCard.className = 'alert-card visible alert-' + kind;
      alertIconEl.textContent = icon;
      alertTitleEl.textContent = title;
      alertSubtextEl.textContent = sub;
      alertHideTimer = setTimeout(() => { alertCard.classList.remove('visible'); }, 5000);
    }
    function handleTwitchNotification(payload) {
      const type = payload.subscription.type;
      const event = payload.event;
      if (type === 'channel.follow') {
        showAlert('follow', '🎤', 'NEW FOLLOWER', (event.user_name || 'Zuschauer') + ' joined the crew');
        followerNameEl.textContent = event.user_name || 'Zuschauer';
      } else if (type === 'channel.subscribe') {
        showAlert('sub', '💿', 'NEW SUBSCRIBER', 'Tier 1 — welcome to the block party');
        loadSubTotal();
      } else if (type === 'channel.subscription.message') {
        showAlert('sub', '💿', 'RESUB', (event.user_name || 'Zuschauer') + ' — ' + (event.cumulative_months || event.streak_months || '?') + ' Monate dabei');
        loadSubTotal();
      } else if (type === 'channel.cheer') {
        showAlert('donation', '💰', (event.bits || 0) + ' BITS', (event.is_anonymous ? 'Anonym' : (event.user_name || 'Zuschauer')) + ' — thanks for the love 🙏');
      } else if (type === 'channel.raid') {
        showAlert('sub', '🚨', 'RAID', (event.from_broadcaster_user_name || 'Ein Raid') + ' bringt ' + (event.viewers || '?') + ' Zuschauer mit');
      }
    }

    // ---------- Twitch EventSub (natives WebSocket, 1:1 Verbindungs-/Reconnect-Logik aus goal.html/event-cards.html) ----------
    const TWITCH_EVENTSUB_URL = 'wss://eventsub.wss.twitch.tv/ws';
    let reconnectAttempts = 0;
    let reconnectTimer = null;
    function scheduleReconnect(reason) {
      reconnectAttempts += 1;
      const delay = Math.min(30000, 2000 * reconnectAttempts);
      console.log('[EventSub] verbinde neu in ' + (delay / 1000) + 's (' + reason + ')');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => connectTwitchEventSub(), delay);
    }
    async function subscribeToTwitchEvents(sessionId) {
      try {
        const cleanUrl = VERCEL_URL.replace(/\/$/, "");
        const res = await fetch(`${cleanUrl}/api/twitch-eventsub`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });
        const data = await res.json();
        if (!data || !data.success) {
          console.warn('[EventSub] Subscription fehlgeschlagen:', (data && data.message) || 'unbekannt');
          return;
        }
        console.log('[EventSub] verbunden, Events angemeldet.');
      } catch (e) {
        console.warn('[EventSub] Fehler:', e.message || e);
      }
    }
    function connectTwitchEventSub(url, isReconnectHandoff) {
      url = url || TWITCH_EVENTSUB_URL;
      const ws = new WebSocket(url);
      let handoffInProgress = false;
      ws.onopen = () => {};
      ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch (e) { return; }
        const messageType = data.metadata && data.metadata.message_type;
        if (messageType === 'session_welcome') {
          reconnectAttempts = 0;
          if (isReconnectHandoff) return;
          subscribeToTwitchEvents(data.payload.session.id);
          return;
        }
        if (messageType === 'session_keepalive') return;
        if (messageType === 'notification') { handleTwitchNotification(data.payload); return; }
        if (messageType === 'session_reconnect') {
          handoffInProgress = true;
          connectTwitchEventSub(data.payload.session.reconnect_url, true);
          return;
        }
        if (messageType === 'revocation') {
          console.warn('[EventSub] Subscription widerrufen:', data.payload.subscription.type);
          return;
        }
      };
      ws.onerror = () => {};
      ws.onclose = (event) => {
        if (handoffInProgress) return;
        scheduleReconnect(event.reason || `Code ${event.code}`);
      };
    }
    connectTwitchEventSub();

    // ---------- Test-Modus (?test=follow|sub|resub|bits|raid) ----------
    const TEST_ACTIONS = {
      follow: () => showAlert('follow', '🎤', 'NEW FOLLOWER', 'TapeDeckTravis joined the crew'),
      sub: () => showAlert('sub', '💿', 'NEW SUBSCRIBER', 'Tier 1 — welcome to the block party'),
      resub: () => showAlert('sub', '💿', 'RESUB', 'BoomBapBetty — 6 Monate dabei'),
      bits: () => showAlert('donation', '💰', '200 BITS', 'VinylVandal99 — thanks for the love 🙏'),
      cheer: () => showAlert('donation', '💰', '200 BITS', 'VinylVandal99 — thanks for the love 🙏'),
      raid: () => showAlert('sub', '🚨', 'RAID', 'Cassette_King bringt 12 Zuschauer mit'),
    };
    const testParam = params.get('test');
    if (testParam && TEST_ACTIONS[testParam]) {
      setTimeout(TEST_ACTIONS[testParam], 600);
    }
    if (testParam === 'chat') {
      setTimeout(() => addChatMessage('VinylVandal99', 'that flip reset was CLEAN 🔥', 'u-gold', null), 400);
      setTimeout(() => addChatMessage('BoomBapBetty', 'aerial demo omg', 'u-teal', null), 900);
    }
  </script>

</body>
</html>
